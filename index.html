    title: titleFor(),
    left: 'Отмена', className: `sheet-form${income ? ' income' : ''}`,
    body: `${canSwitch ? `<div class="seg kind-seg" id="f-kind"><button type="button" data-k="expense" class="${income ? '' : 'on'}">Расход</button><button type="button" data-k="income" class="${income ? 'on' : ''}">Доход</button></div>` : ''}
      <div class="amount-wrap"><input class="amount-input" id="f-amount" type="text" inputmode="decimal" placeholder="0" autocomplete="off" enterkeyhint="done" aria-label="Сумма" value="${esc(f.amount)}"><span class="amount-cur" id="f-sym"></span></div>
      <div class="chips scroll cur-chips" id="f-curs" aria-label="Валюта">${curList.map((c) => `<button type="button" class="chip sm" data-cur="${c}">${flagOf(c)} ${c}</button>`).join('')}</div>
      <div class="rate-line" id="f-rate-line"></div>
      <div class="rate-edit" id="f-rate-edit" hidden><span id="f-rate-label"></span><input class="input" id="f-rate" type="text" inputmode="decimal" placeholder="Курс" autocomplete="off" aria-label="Курс"><span>${esc(sym(b))}</span><button type="button" class="chip sm" id="f-rate-auto">Авто</button></div>
      <div class="field receipt-field" id="f-receipt-field"${income ? ' hidden' : ''}><button type="button" class="chip sm receipt-chip" id="f-receipt">📷 Распознать чек</button><span class="ai-note" id="f-ai-note" hidden></span></div>
      <div class="field"><div class="field-label">Категория</div><div class="cat-grid" id="f-cats"></div></div>
      <div class="field"><div class="field-label">Дата</div><div class="chips" id="f-dates">
        <button type="button" class="chip sm" data-d="0">Сегодня</button><button type="button" class="chip sm" data-d="-1">Вчера</button>
        <label class="chip sm date-chip">${icon('calendar', 17)}<span id="f-date-label"></span><input type="date" id="f-date" value="${f.date}" aria-label="Дата покупки"></label></div></div>
      <div class="field"><input class="input" id="f-comment" type="text" placeholder="Комментарий (необязательно)" maxlength="140" enterkeyhint="done" value="${esc(src.comment || '')}"></div>
      <div class="field"><input class="input" id="f-tags" type="text" placeholder="Теги: #отпуск #работа" autocapitalize="none" autocomplete="off" spellcheck="false" enterkeyhint="done" value="${esc((src.tags || []).map((t) => '#' + t).join(' '))}"><div class="chips tag-sugg" id="f-tag-sugg"></div></div>
      <div class="field" id="f-pay-field"${income ? ' hidden' : ''}><div class="field-label">Способ оплаты</div><div class="chips" id="f-pay">${st.settings.paymentMethods.map((p) => `<button type="button" class="chip sm${p === f.payment ? ' on' : ''}" data-p="${esc(p)}">${esc(p)}</button>`).join('')}</div></div>`,
    foot: `<button class="btn btn-primary" id="f-save" type="button">${editing ? 'Сохранить' : 'Добавить'}</button>
      ${editing ? `<div class="btn-row"><button class="btn btn-secondary" id="f-dup">Дублировать</button>${income ? '' : '<button class="btn btn-secondary" id="f-tpl">В шаблоны</button>'}<button class="btn btn-danger" id="f-del">Удалить</button></div>` : ''}`,
  });
  const q = (sel) => $(sel, s.sheet);
  /** Плитки категорий: расходные (последние использованные — первыми) или категории доходов. */
  const renderCats = () => {
    const list = income ? incomeCategoriesByRecency() : categoriesByRecency();
    if (f.categoryId && !list.some((c) => c.id === f.categoryId)) f.categoryId = null;
    q('#f-cats').innerHTML = list.map((c) =>
      `<button type="button" class="cat-tile${c.id === f.categoryId ? ' on' : ''}" data-c="${c.id}" style="--c:${c.color};--cs:${rgba(c.color, 0.12)}"><span class="em" style="background:${rgba(c.color, 0.16)}">${esc(c.emoji)}</span><span class="nm">${esc(c.name)}</span></button>`).join('');
  };
  renderCats();
  const kindSeg = q('#f-kind');
  if (kindSeg) kindSeg.addEventListener('click', (e) => {
    const x = e.target.closest('[data-k]');
    if (!x || (x.dataset.k === 'income') === income) return;
    income = x.dataset.k === 'income';
    $$('[data-k]', kindSeg).forEach((b2) => b2.classList.toggle('on', b2 === x));
    s.sheet.classList.toggle('income', income);
    s.sheet.querySelector('.sheet-head h2').textContent = titleFor();
    q('#f-pay-field').hidden = income;
    q('#f-receipt-field').hidden = income;
    q('#f-save').textContent = 'Добавить';
    renderCats();
  });
  const aiNote = (text) => { const n = q('#f-ai-note'); n.textContent = text; n.hidden = !text; };
  const pickCategory = (id) => {
    if (!id || !(income ? INCOME_CATEGORIES : st.categories).some((c) => c.id === id)) return false;
    f.categoryId = id;
    $$('.cat-tile', s.sheet).forEach((t) => t.classList.toggle('on', t.dataset.c === id));
    return true;
  };
  /** Результат распознавания чека → поля формы (пользователь проверяет и нажимает «Добавить»). */
  const applyReceipt = (r) => {
    if (r.amount > 0) { amountInput.value = String(r.amount).replace('.', ','); }
    const cur = /^[A-Z]{3}$/.test(r.currency || '') ? r.currency : null;
    if (cur && cur !== f.currency) {
      if (!st.settings.currencies.includes(cur)) { st.settings.currencies.push(cur); Store.save(); }
      if (!q(`#f-curs [data-cur="${cur}"]`)) q('#f-curs').insertAdjacentHTML('beforeend', `<button type="button" class="chip sm" data-cur="${cur}">${flagOf(cur)} ${cur}</button>`);
      Object.assign(f, { currency: cur, rate: null, rateSource: 'auto', ratePending: false, rateProvider: '', rateDate: '', rateOpen: false });
      syncCur();
    }
    if (/^\d{4}-\d{2}-\d{2}$/.test(r.date || '') && r.date <= todayISO() && toISO(parseISO(r.date)) === r.date) { f.date = r.date; syncDates(); }
    const text = String(r.comment || r.merchant || '').trim().slice(0, 140);
    if (text) q('#f-comment').value = text;
    pickCategory(r.categoryId);
    if (Array.isArray(r.tags) && r.tags.length) { q('#f-tags').value = unique([...parseTags(q('#f-tags').value), ...r.tags.map(normTag).filter(Boolean)]).slice(0, 8).map((t) => '#' + t).join(' '); renderTagSugg(); }
    loadRate();
    aiNote(r.amount > 0 ? '✨ Заполнено по чеку — проверьте и нажмите «Добавить»' : '✨ Сумму на чеке не нашёл — введите её');
  };
  q('#f-receipt').addEventListener('click', () => Receipt.start({ onResult: applyReceipt }));
  /** Категория по комментарию: сначала свои правила и словарь, если не вышло — ИИ (тихо, без ошибок). */
  let suggestToken = 0;
  const autoCategory = async () => {
    const text = q('#f-comment').value.trim();
    if (f.categoryId || income || text.length < 3) return;
    const local = parsePhrase(text);
    if (local.categoryId && pickCategory(local.categoryId)) { aiNote(''); return; }
    const tok = ++suggestToken;
    aiNote('✨ Подбираю категорию…');
    try {
      const r = await aiRequest('/api/ai/suggest', { description: text, baseCurrency: b, categories: aiCategoryList() }, { timeout: 8000 });
      if (tok !== suggestToken || s.closed || f.categoryId) return;
      aiNote(pickCategory(r.categoryId) ? '✨ Категория подобрана автоматически' : '');
    } catch (e) { if (tok === suggestToken) aiNote(''); }
  };
  const amountInput = q('#f-amount');
  // Фокус синхронно в обработчике нажатия — иначе iOS не откроет клавиатуру
  if (!editing) amountInput.focus({ preventScroll: true });

  const shake = (el) => { el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); };
  const syncCur = () => {
    q('#f-sym').textContent = sym(f.currency);
    $$('[data-cur]', s.sheet).forEach((x) => x.classList.toggle('on', x.dataset.cur === f.currency));
  };
  const syncDates = () => {
    const t = todayISO();
    $$('[data-d]', s.sheet).forEach((x) => x.classList.toggle('on', addDays(t, +x.dataset.d) === f.date));
    const other = f.date !== t && f.date !== addDays(t, -1);
    q('.date-chip').classList.toggle('on', other);
    q('#f-date-label').textContent = other ? fmtDay(f.date) : 'Другая дата';
    if (q('#f-date').value !== f.date) q('#f-date').value = f.date;
  };
  const renderRate = () => {
    const line = q('#f-rate-line'), edit = q('#f-rate-edit');
    if (f.currency === b) { line.innerHTML = ''; edit.hidden = true; return; }
    const amt = parseNum(amountInput.value);
    let html;
    if (f.loading) html = `<span class="spinner"></span> Получаю курс на ${fmtDay(minISO(f.date, todayISO()))}…`;
    else if (f.rate > 0) {
      const src = f.rateSource === 'manual' ? '<span class="badge-src manual">вручную</span>'
        : f.ratePending ? `<span class="badge-src pending">приблизительно${f.rateDate ? ' · ' + fmtShortDate(f.rateDate) : ''}</span>`
        : `<span class="badge-src">авто${f.rateProvider ? ' · ' + esc(f.rateProvider) : ''}${f.rateDate ? ', ' + fmtShortDate(f.rateDate) : ''}</span>`;
      html = `${amt > 0 ? `<b>≈ ${fmtMoney(amt * f.rate, b)}</b> ·` : ''} 1 ${f.currency} = ${fmtRate(f.rate)} ${esc(sym(b))} ${src}`;
    } else html = `<span class="warn-text">Нет курса${navigator.onLine === false ? ' (нет интернета)' : ''} — введите вручную</span>`;
    line.innerHTML = `${html} <button type="button" class="link-btn sm" data-rate-toggle>${f.rateOpen ? 'Готово' : 'Изменить курс'}</button>`;
    edit.hidden = !(f.rateOpen || (!f.loading && !(f.rate > 0)));
    q('#f-rate-label').textContent = `1 ${f.currency} =`;
    const ri = q('#f-rate');
    if (document.activeElement !== ri) ri.value = f.rate > 0 ? fmtRateInput(f.rate) : '';
  };
  /** Автоматический курс на дату покупки (кэш → API → ближайший известный). */
  const loadRate = async () => {
    if (f.currency === b) { Object.assign(f, { rate: 1, rateSource: 'auto', ratePending: false, rateProvider: '', rateDate: '' }); renderRate(); return; }
    if (f.rateSource === 'manual') { renderRate(); return; }
    const tok = ++f.token;
    const d = minISO(f.date, todayISO());
    let r = Rates.peek(f.currency, b, d), pending = false;
    if (!r) {
      f.loading = true; renderRate();
      r = await Rates.get(f.currency, b, d).catch(() => null);
      if (tok !== f.token || s.closed) return;
      f.loading = false;
      if (!r) { r = Rates.nearest(f.currency, b, d); pending = !!r; }
    }
    if (r) Object.assign(f, { rate: r.rate, rateProvider: r.provider, rateDate: r.date, ratePending: pending });
    else Object.assign(f, { rate: null, ratePending: false, rateOpen: true });
    renderRate();
  };
  const renderTagSugg = () => {
    const have = new Set(parseTags(q('#f-tags').value));
    q('#f-tag-sugg').innerHTML = allTags().filter((t) => !have.has(t)).slice(0, 8).map((t) => `<button type="button" class="chip sm" data-tag="${esc(t)}">#${esc(t)}</button>`).join('');
  };

  // --- обработчики ---
  amountInput.addEventListener('input', () => {
    const clean = amountInput.value.replace(/[^\d.,\s]/g, '');
    if (clean !== amountInput.value) amountInput.value = clean;
    renderRate();
  });
  amountInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); amountInput.blur(); } });
  q('#f-curs').addEventListener('click', (e) => {
    const x = e.target.closest('[data-cur]');
    if (!x || x.dataset.cur === f.currency) return;
    Object.assign(f, { currency: x.dataset.cur, rateSource: 'auto', rate: null, rateOpen: false, ratePending: false });
    syncCur(); loadRate();
  });
  q('#f-rate-line').addEventListener('click', (e) => {
    if (!e.target.closest('[data-rate-toggle]')) return;
    f.rateOpen = !f.rateOpen;
    renderRate();
    if (f.rateOpen) q('#f-rate').focus();
  });
  q('#f-rate').addEventListener('input', (e) => {
    const v = parseNum(e.target.value);
    Object.assign(f, { rate: v > 0 ? v : null, rateSource: 'manual', ratePending: false, rateProvider: '', rateDate: '' });
    renderRate();
  });
  q('#f-rate-auto').addEventListener('click', () => {
    Object.assign(f, { rateSource: 'auto', rate: null, rateOpen: false });
    loadRate();
  });
  q('#f-cats').addEventListener('click', (e) => {
    const x = e.target.closest('[data-c]');
    if (!x) return;
    f.categoryId = x.dataset.c;
    $$('.cat-tile', s.sheet).forEach((t) => t.classList.toggle('on', t === x));
  });
  q('#f-dates').addEventListener('click', (e) => {
    const x = e.target.closest('[data-d]');
    if (!x) return;
    f.date = addDays(todayISO(), +x.dataset.d);
    syncDates(); loadRate();
  });
  q('#f-date').addEventListener('change', (e) => {
    if (!e.target.value) { e.target.value = f.date; return; }
    f.date = e.target.value;
    syncDates(); loadRate();
  });
  q('#f-tags').addEventListener('input', renderTagSugg);
  q('#f-tag-sugg').addEventListener('click', (e) => {
    const x = e.target.closest('[data-tag]');
    if (!x) return;
    const inp = q('#f-tags');
    inp.value = (inp.value.trim() + ' #' + x.dataset.tag).trim() + ' ';
    renderTagSugg();
  });
  q('#f-pay').addEventListener('click', (e) => {
    const x = e.target.closest('[data-p]');
    if (!x) return;
    f.payment = f.payment === x.dataset.p ? '' : x.dataset.p;
    $$('[data-p]', s.sheet).forEach((p) => p.classList.toggle('on', p.dataset.p === f.payment));
  });
  ['#f-comment', '#f-tags'].forEach((sel) => q(sel).addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); e.target.blur(); } }));
  q('#f-comment').addEventListener('change', autoCategory);

  /** Собирает данные формы; при ошибке подсвечивает поле и возвращает null. */
  const collect = () => {
    const amount = parseNum(amountInput.value);
    if (!(amount > 0)) { shake(q('.amount-wrap')); toast('Введите сумму'); amountInput.focus(); return null; }
    if (!f.categoryId) { shake(q('#f-cats')); toast('Выберите категорию'); return null; }
    if (f.currency !== b && !(f.rate > 0)) {
      if (f.loading) { toast('Курс ещё загружается…'); return null; }
      f.rateOpen = true; renderRate(); shake(q('#f-rate-edit')); q('#f-rate').focus(); toast('Укажите курс'); return null;
    }
    const rate = f.currency === b ? 1 : f.rate;
    return {
      amount: round2(amount), currency: f.currency, rate: sig(rate),
      rateSource: f.currency === b ? 'auto' : f.rateSource, rateProvider: f.currency === b ? '' : f.rateProvider || '',
      rateDate: f.currency === b ? '' : f.rateDate || '', ratePending: f.currency === b ? false : f.ratePending,
      baseAmount: round2(amount * rate), categoryId: f.categoryId, date: f.date,
      comment: q('#f-comment').value.trim(), payment: income ? '' : f.payment, tags: parseTags(q('#f-tags').value),
    };
  };
  q('#f-save').addEventListener('click', () => {
    const data = collect();
    if (!data) return;
    st.settings.lastCurrency = data.currency;
    let rec;
    if (editing) {
      Object.assign(editing, data, { updatedAt: Date.now() });
      delete editing.demo; delete editing.demoFactor;
      rec = editing;
    } else {
      rec = { id: uid(), ...data, createdAt: (prefill && prefill.createdAt) || Date.now(), updatedAt: Date.now() };
      if (income) { rec.kind = 'income'; st.incomes.push(rec); } else st.expenses.push(rec);
    }
    if (onSaved) onSaved(rec);
    App.flash(rec.id);
    Sheet.close(s);
    Store.commit();
    if (!editing) fabSuccess();
    toast(editing ? 'Изменения сохранены' : income ? `Доход: +${fmtMoney(rec.amount, rec.currency)}` : `Добавлено: ${fmtMoney(rec.amount, rec.currency)}`);
  });
  if (editing) {
    q('#f-del').addEventListener('click', () => { Sheet.close(s); deleteExpense(editing.id); });
    q('#f-dup').addEventListener('click', () => {
      const data = collect() || editing;
      Sheet.close(s);
      setTimeout(() => openExpenseForm({ prefill: { ...data, isCopy: true, kind: income ? 'income' : 'expense' } }), 0);
    });
    if (q('#f-tpl')) q('#f-tpl').addEventListener('click', () => {
      const data = collect();
      if (!data) return;
      st.templates.push({ id: uid(), name: (data.comment || getCat(data.categoryId).name).slice(0, 24), amount: data.amount, currency: data.currency, categoryId: data.categoryId, payment: data.payment, comment: data.comment });
      Store.commit();
      toast('Шаблон добавлен на главный экран');
    });
  }
  syncCur(); syncDates(); renderTagSugg();
  if (editing) renderRate(); else loadRate();
}

/** Удаление с возможностью отмены. */
function deleteExpense(id) {
  const row = document.querySelector(`.view.active .tx[data-id="${CSS.escape(id)}"]`);
  if (row && !row.dataset.leaving) {
    row.dataset.leaving = '1';
    const list = row.parentElement, head = list.previousElementSibling;
    const targets = list.children.length === 1 ? [list, head && head.classList.contains('day-head') ? head : null].filter(Boolean) : [row];
    Promise.all(targets.map((t) => collapseOut(t))).then(() => deleteExpense(id));
    return;
  }
  const st = S();
  const key = st.expenses.some((e) => e.id === id) ? 'expenses' : 'incomes';
  const arr = st[key];
  const i = arr.findIndex((e) => e.id === id);
  if (i < 0) return;
  const [removed] = arr.splice(i, 1);
  Store.commit();
  toast(key === 'incomes' ? 'Доход удалён' : 'Покупка удалена', { action: 'Отменить', onAction: () => { const a = S()[key]; a.splice(Math.min(i, a.length), 0, removed); App.flash(removed.id); Store.commit(); } });
}

/** Быстрое добавление по шаблону одним нажатием. */
let tplBusy = false;
async function quickAddTemplate(id) {
  const st = S(), b = base(), t = st.templates.find((x) => x.id === id);
  if (!t || tplBusy) return;
  tplBusy = true;
  try {
    const date = todayISO();
    let r = { rate: 1, provider: '', date: '' }, pending = false;
    if (t.currency !== b) {
      r = await Rates.get(t.currency, b, date, 4000).catch(() => null);
      if (!r) { r = Rates.nearest(t.currency, b, date); pending = !!r; }
      if (!r) {
        toast('Нет курса без интернета — введите его вручную');
        openExpenseForm({ prefill: { ...t, tags: [] } });
        return;
      }
    }
    const e = makeExpense({ ...t, date, rate: r.rate, rateProvider: r.provider, rateDate: r.date, ratePending: pending });
    st.expenses.push(e);
    App.flash(e.id);
    Store.commit();
    fabSuccess();
    if (navigator.vibrate) navigator.vibrate(8);
    toast(`Добавлено: ${t.name} · ${fmtMoney(t.amount, t.currency)}`, { action: 'Отменить', onAction: () => { st.expenses = st.expenses.filter((x) => x.id !== e.id); Store.commit(); } });
  } finally { tplBusy = false; }
}

/** Список шаблонов и редактор шаблона. */
function openTemplatesSheet() {
  const s = Sheet.open({
    title: 'Шаблоны', body: '<div id="tpl-list"></div>',
    foot: '<button class="btn btn-primary" data-new>＋ Новый шаблон</button>',
    refresh: () => render(),
  });
  const render = () => {
    const st = S();
    $('#tpl-list', s.sheet).innerHTML = `<p class="sheet-text">Нажатие на шаблон на главном экране сразу добавляет покупку. Долгое нажатие — редактирование.</p>`
      + (st.templates.length ? `<div class="list">${st.templates.map((t) => `<button class="row" data-id="${t.id}"><span class="ri">${esc(getCat(t.categoryId).emoji)}</span><span class="rl">${esc(t.name)}<small>${esc(getCat(t.categoryId).name)}${t.payment ? ' · ' + esc(t.payment) : ''}</small></span><span class="rv">${fmtMoney(t.amount, t.currency)}</span></button>`).join('')}</div>`
        : '<div class="empty">Шаблонов пока нет</div>');
  };
  $('#tpl-list', s.sheet).addEventListener('click', (e) => { const x = e.target.closest('[data-id]'); if (x) openTemplateEditor(x.dataset.id); });
  $('[data-new]', s.sheet).addEventListener('click', () => openTemplateEditor(null));
  render();
}
function openTemplateEditor(id) {
  const st = S(), b = base();
  const t = id ? st.templates.find((x) => x.id === id) : null;
  const f = t ? { ...t } : { name: '', amount: '', currency: st.settings.lastCurrency || b, categoryId: null, payment: '', comment: '' };
  const curList = unique([...st.settings.currencies, f.currency]);
  const s = Sheet.open({
    title: t ? 'Шаблон' : 'Новый шаблон', left: 'Отмена',
    body: `<div class="field" style="margin-top:4px"><div class="field-label">Название</div><input class="input" id="t-name" maxlength="24" placeholder="Например, Кофе" value="${esc(f.name)}"></div>
      <div class="field"><div class="field-label">Сумма</div><input class="input" id="t-amount" inputmode="decimal" placeholder="0" value="${f.amount !== '' ? String(f.amount).replace('.', ',') : ''}"></div>
      <div class="field"><div class="chips" id="t-curs">${curList.map((c) => `<button type="button" class="chip sm${c === f.currency ? ' on' : ''}" data-cur="${c}">${flagOf(c)} ${c}</button>`).join('')}</div></div>
      <div class="field"><div class="field-label">Категория</div><div class="cat-grid" id="t-cats">${st.categories.map((c) => `<button type="button" class="cat-tile${c.id === f.categoryId ? ' on' : ''}" data-c="${c.id}" style="--c:${c.color};--cs:${rgba(c.color, 0.12)}"><span class="em" style="background:${rgba(c.color, 0.16)}">${esc(c.emoji)}</span><span class="nm">${esc(c.name)}</span></button>`).join('')}</div></div>

/** Смена основной валюты: курс X→новая = курс X→старая × курс старая→новая на дату покупки. Ручные курсы сохраняют смысл. */
async function changeBaseCurrency(newBase) {
  const st = S(), old = base();
  if (navigator.onLine === false) { toast('Для пересчёта нужен интернет'); return; }
  const ok = await confirmSheet({
    title: `Перейти на ${newBase}?`,
    text: `Все суммы и бюджеты будут пересчитаны из ${old} в ${newBase} по курсам на даты покупок. Ручные курсы сохранятся через кросс-курс.`,
    ok: 'Пересчитать',
  });
  if (!ok) return;
  const busy = showBusy('Пересчитываю…');
  try {
    const today = todayISO();
    const dates = unique([...st.expenses, ...st.incomes].map((e) => minISO(e.date, today))).sort();
    if (dates.length) { try { await Rates.prefetchRange(newBase, [old], dates[0], dates[dates.length - 1]); } catch (e) { /* по одной дате */ } }
    const cross = {};
    for (const d of unique([...dates, today])) {
      const r = await Rates.get(old, newBase, d);
      if (!r) throw new Error('нет курса на ' + d);
      cross[d] = r.rate;
    }
    [...st.expenses, ...st.incomes].forEach((e) => {
      const d = minISO(e.date, today);
      if (e.currency === newBase) Object.assign(e, { rate: 1, rateSource: 'auto', ratePending: false, rateProvider: '', rateDate: '' });
      else if (e.rate > 0) e.rate = sig(e.rate * cross[d]);
      else e.ratePending = true;
      e.baseAmount = e.rate > 0 ? round2(e.amount * e.rate) : null;
    });
    const k = cross[today];
    const nice = (v) => (v >= 1000 ? Math.round(v / 100) * 100 : Math.round(v));
    st.categories.forEach((c) => { if (c.budget > 0) c.budget = nice(c.budget * k); });
    if (st.settings.totalBudget > 0) st.settings.totalBudget = nice(st.settings.totalBudget * k);
    st.settings.baseCurrency = newBase;
    if (!st.settings.currencies.includes(newBase)) st.settings.currencies.unshift(newBase);
    Store.commit();
    toast(`Основная валюта: ${newBase}`);
  } catch (e) {
    toast('Не удалось получить курсы. Проверьте интернет и попробуйте ещё раз');
  } finally { busy.close(); }
}

/** На телефоне — системное меню «Поделиться» (можно сохранить в «Файлы»), на компьютере — скачивание. */
async function shareOrDownload(blob, filename) {
  const file = new File([blob], filename, { type: blob.type });
  if (isTouch() && navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: filename }); return true; }
    catch (e) { if (e.name === 'AbortError') return false; /* иначе — обычное скачивание */ }
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
  return true;
}
async function exportJSON() {
  const st = S();

  const ok = await shareOrDownload(new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' }), `traty-backup-${todayISO()}.json`);
  if (ok) { st.meta.lastBackupAt = Date.now(); Store.commit(); toast('Резервная копия сохранена'); }

const CSV_HEAD = ['Дата', 'Сумма', 'Валюта', 'Курс', 'Источник курса', 'Сумма в основной валюте', 'Основная валюта', 'Категория', 'Способ оплаты', 'Теги', 'Комментарий', 'ID'];
async function exportCSV() {
  const st = S(), b = base();
  const cell = (v) => { const s = String(v ?? ''); return /[;"\n\r]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
  const num = (v) => (v == null ? '' : String(v).replace('.', ','));
  const lines = [CSV_HEAD.join(';')].concat(st.expenses.slice().sort(sortByDateDesc).map((e) => [
    e.date, num(e.amount), e.currency, num(e.rate), e.rateSource === 'manual' ? 'вручную' : 'авто', num(e.baseAmount), b,
    getCat(e.categoryId).name, e.payment, (e.tags || []).map((t) => '#' + t).join(' '), e.comment, e.id,
  ].map(cell).join(';')));
  // BOM + «;» + десятичная запятая — так файл корректно открывается в Excel с русской/турецкой локалью
  await shareOrDownload(new Blob(['﻿' + lines.join('\r\n')], { type: 'text/csv' }), `traty-${todayISO()}.csv`);
}
function parseCSV(text) {
  text = text.replace(/^﻿/, '');
  const first = text.split(/\r?\n/, 1)[0];
  const count = (ch) => first.split(ch).length - 1;
  const delim = count('\t') > 0 ? '\t' : count(';') >= count(',') ? ';' : ',';
  const rows = [];
  let row = [], field = '', quoted = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (quoted) {
      if (ch === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else quoted = false; } else field += ch;
    } else if (ch === '"') quoted = true;
    else if (ch === delim) { row.push(field); field = ''; }
    else if (ch === '\n' || ch === '\r') { if (ch === '\r' && text[i + 1] === '\n') i++; row.push(field); rows.push(row); row = []; field = ''; }
    else field += ch;
  }
  if (field || row.length) { row.push(field); rows.push(row); }
  return rows.filter((r) => r.some((c) => c.trim() !== ''));
}
function parseDateLoose(s) {
  s = String(s || '').trim();
  let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if (m) return `${m[1]}-${pad(m[2])}-${pad(m[3])}`;
  m = s.match(/^(\d{1,2})[./](\d{1,2})[./](\d{2,4})/);
  if (m) return `${m[3].length === 2 ? '20' + m[3] : m[3]}-${pad(m[2])}-${pad(m[1])}`;
  return null;
}
/** CSV → покупки. Понимает экспорт этого приложения и простые таблицы (дата, сумма, валюта, категория…). */
function parseCSVExpenses(text) {
  const rows = parseCSV(text);
  if (rows.length < 2) return null;
  const head = rows[0].map((h) => h.trim().toLowerCase());
  const col = (...names) => head.findIndex((h) => names.includes(h));
  const C = {
    date: col('дата', 'date'), amount: col('сумма', 'amount'), currency: col('валюта', 'currency'), rate: col('курс', 'rate'),
    src: col('источник курса', 'rate_source', 'источник'), baseAmount: col('сумма в основной валюте', 'base_amount'), baseCur: col('основная валюта', 'base_currency'),
    cat: col('категория', 'category'), pay: col('способ оплаты', 'payment'), tags: col('теги', 'tags'), comment: col('комментарий', 'comment', 'описание', 'note'), id: col('id'),
  };
  if (C.date < 0 || C.amount < 0) return null;
  const b = base();
  const newCats = [];
  const catByName = (name) => {
    name = String(name || '').trim();
    if (!name) return 'other';
    const all = [...S().categories, ...newCats];
    const found = all.find((c) => c.name.toLowerCase() === name.toLowerCase());
    if (found) return found.id;
    const used = new Set(all.map((c) => c.color));
    const c = { id: 'c' + uid(), name: name.slice(0, 30), emoji: '🏷️', color: SWATCHES.find((x) => !used.has(x)) || SWATCHES[newCats.length % SWATCHES.length], budget: null };
    newCats.push(c);
    return c.id;
  };
  const expenses = [];
  rows.slice(1).forEach((r) => {
    const get = (i) => (i >= 0 ? (r[i] || '').trim() : '');
    const date = parseDateLoose(get(C.date));
    const amount = Math.abs(parseNum(get(C.amount)));
    if (!date || !(amount > 0)) return;
    const currency = (get(C.currency) || b).toUpperCase().slice(0, 3);
    const fileBase = (get(C.baseCur) || b).toUpperCase();
    let rate = parseNum(get(C.rate));
    if (currency === b) rate = 1;
    else if (!(rate > 0) || fileBase !== b) rate = null;
    const e = makeExpense({
      amount, currency, rate, date, categoryId: catByName(get(C.cat)), payment: get(C.pay), comment: get(C.comment),
      tags: parseTags(get(C.tags)), rateSource: /ручн|manual/i.test(get(C.src)) && rate ? 'manual' : 'auto',
    });
    if (get(C.id)) e.id = get(C.id);
    e.createdAt = parseISO(date).getTime() + 12 * 36e5;
    expenses.push(e);
  });
  return { kind: 'csv', expenses, categories: newCats };
}
function normalizeExpense(x, fileBase) {
  if (!x || typeof x !== 'object') return null;
  const amount = Number(x.amount), date = String(x.date || '').slice(0, 10);
  if (!(amount > 0) || !/^\d{4}-\d{2}-\d{2}$/.test(date)) return null;
  const b = base();
  const currency = String(x.currency || b).toUpperCase().slice(0, 3);
  let rate = Number(x.rate) > 0 ? Number(x.rate) : null;
  if (fileBase && fileBase !== b) rate = currency === b ? 1 : null; // другая основная валюта — курс пересчитаем
  return {
    id: String(x.id || uid()), amount: round2(amount), currency, rate,
    rateSource: x.rateSource === 'manual' && rate ? 'manual' : 'auto', rateProvider: String(x.rateProvider || ''), rateDate: String(x.rateDate || ''),
    ratePending: !!x.ratePending || rate == null, baseAmount: rate ? round2(amount * rate) : null,

function normalizeInboxItem(raw) {

const INBOX_SOURCES = { wallet: ['💳', 'Apple Pay'], sms: ['💬', 'SMS'], mail: ['✉️', 'Почта'], test: ['🧪', 'Тест'], quick: ['⚡', 'Быстрая запись'] };

const Inbox = {
  busy: false,
  lastTry: 0,
  configured() { const c = S().settings.inbox; return !!(c && c.url && c.token); },
  /** Запрос к серверу «Входящих» с ключом в заголовке. */
  async req(path, { method = 'GET', body, cfg } = {}) {
    const c = cfg || S().settings.inbox;
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 9000);
    try {
      const res = await fetch(c.url.replace(/\/+$/, '') + path, {
        method, cache: 'no-store', signal: ctrl.signal,
        headers: { Authorization: 'Bearer ' + c.token, ...(body ? { 'Content-Type': 'application/json' } : {}) },
        body: body ? JSON.stringify(body) : undefined,

      try { j = await res.json(); } catch (e) { /* не JSON */ }

      items.forEach((raw) => {

        seen.add(raw.id);
        const it = normalizeInboxItem(raw);
        if (it) fresh.push(it);
      });

      for (const it of fresh.sort((a, b) => a.at - b.at)) {

        }

      const ids = items.map((x) => x && x.id).filter(Boolean);

    if (!auto.length && !pending) return;
    if (Sheet.stack.some((x) => x.sheet.classList.contains('sheet-inbox'))) return; // лист уже открыт и обновится сам
    auto.forEach((e) => App.flash(e.id));
    const what = auto.length === 1 ? `${auto[0].comment || getCat(auto[0].categoryId).name} · ${fmtMoney(auto[0].amount, auto[0].currency)}` : `${auto.length} ${plural(auto.length, 'трата', 'траты', 'трат')}`;
    if (auto.length && pending) toast(`Добавлено автоматически: ${what}. Ещё ${pending} ждут подтверждения`, { action: 'Разобрать', onAction: openInboxSheet });
    else if (auto.length) toast(`Добавлено автоматически: ${what}`);
    else toast(`Новые траты из банка: ${pending}`, { action: 'Разобрать', onAction: openInboxSheet });
  },
};
function inboxErrorText(e) {
  if (e && e.status === 401) return 'Ключ не совпадает с TOKEN на сервере';
  if (e && e.message === 'not_configured') return 'На сервере не настроены INBOX или TOKEN';
  if (e && e.status) return `Сервер ответил ошибкой (${e.status})`;
  return navigator.onLine === false ? 'Нет интернета' : 'Сервер недоступен — проверьте адрес';
}

/** Копирование через скрытое поле (работает синхронно в обработчике нажатия). */
function copyFallback(text) {
  const ta = document.createElement('textarea');
  ta.value = text; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
  document.body.append(ta); ta.select(); ta.setSelectionRange(0, text.length);
  let ok = false;
  try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
  ta.remove();
  return ok;
}
/** Копирование в буфер обмена (с запасным способом для старых браузеров). */
async function copyText(text, okMsg = 'Скопировано') {
  try { await navigator.clipboard.writeText(text); toast(okMsg); return; } catch (e) { /* запасной способ */ }
  toast(copyFallback(text) ? okMsg : 'Не удалось скопировать');
}

/** Лист «Входящие»: подтверждение трат из банка. */
function openInboxSheet() {
  const existing = Sheet.stack.find((x) => x.sheet.classList.contains('sheet-inbox'));
  if (existing) return;
  let busy = false;
  const s = Sheet.open({
    title: 'Входящие', className: 'sheet-inbox',
    right: Inbox.configured() ? '<button class="link-btn" data-ib-sync>Обновить</button>' : '',
    body: '<div id="ib-box"></div>',
    refresh: () => render(),
  });
  const box = $('#ib-box', s.sheet);
  const byId = (id) => S().inbox.find((x) => x.id === id);
  const render = () => {
    const st = S();
    if (!st.inbox.length) {
      box.innerHTML = Inbox.configured()
        ? `<div class="empty"><div class="em">📭</div><b>Новых трат нет</b>Они появятся здесь после оплаты Apple Pay или SMS от банка.${st.meta.inboxSyncAt ? `<br><small class="muted">Проверено в ${timeOf(st.meta.inboxSyncAt)}</small>` : ''}</div>`
        : `<div class="empty"><div class="em">🏦</div><b>Не настроено</b>Подключите автоматический ввод трат из Apple Pay и SMS.</div><button class="btn btn-primary" data-ib-setup>Настроить</button>`;
      return;
    }
    const cats = categoriesByRecency();
    const ready = st.inbox.filter((it) => it.amount > 0 && it.categoryId && !it.dup);
    box.innerHTML = '<p class="sheet-text">Выберите категорию и нажмите «Добавить». Категорию магазина приложение запомнит и в следующий раз добавит такую трату само.</p>'
      + st.inbox.slice().sort((a, b) => b.at - a.at).map((it) => {
        const [ico, label] = inboxSrc(it);
        const order = it.categoryId ? [getCat(it.categoryId), ...cats.filter((c) => c.id !== it.categoryId)] : cats;
        return `<div class="ib-item" data-id="${esc(it.id)}">
          <div class="ib-meta">${ico} ${label}${it.card ? ' · ' + esc(it.card) : ''} · ${fmtDayHeader(it.date)}, ${timeOf(it.at)}</div>
          <div class="ib-main"><div class="ib-title">${esc(it.merchant || (it.text ? it.text.slice(0, 70) : 'Без названия'))}</div>
            <div class="ib-amt">${it.amount > 0 ? fmtMoney(it.amount, it.currency) : '<span class="warn-text">сумма?</span>'}</div></div>
          ${it.text && it.merchant ? `<div class="ib-text">${esc(it.text)}</div>` : ''}
          ${it.dup ? `<div class="ib-dup">⚠️ Возможно, дубль: ${esc(it.dup)}</div>` : ''}
          <div class="chips scroll ib-cats">${order.map((c) => `<button type="button" class="chip sm${c.id === it.categoryId ? ' on' : ''}" data-ib-cat="${c.id}">${esc(c.emoji)} ${esc(c.name)}</button>`).join('')}</div>
          <div class="btn-row"><button class="btn btn-secondary" data-ib-del>Удалить</button><button class="btn btn-secondary" data-ib-edit>Изменить</button><button class="btn btn-primary" data-ib-ok>Добавить</button></div>
        </div>`;
      }).join('')
      + (ready.length > 1 ? `<button class="btn btn-primary" data-ib-all style="margin-top:6px">Добавить все с категорией (${ready.length})</button>` : '');
  };
  const openForm = (it) => {
    openExpenseForm({
      prefill: { amount: it.amount, currency: it.currency || base(), categoryId: it.categoryId, comment: it.merchant || '', payment: inboxPayment(it), date: it.date, keepDate: true, createdAt: it.at, title: 'Трата из банка' },
      onSaved: (rec) => {
        rec.source = it.source;
        learnMerchant(it.merchant, rec.categoryId);
        S().inbox = S().inbox.filter((x) => x.id !== it.id);
      },
    });
  };
  const addOne = async (it) => {
    if (!(it.amount > 0) || !it.categoryId) { if (!it.categoryId && it.amount > 0) toast('Выберите категорию'); else openForm(it); return null; }
    const e = await expenseFromInbox(it, it.categoryId);
    if (!e) { toast('Нет курса — введите его вручную'); openForm(it); return null; }
    return e;
  };
  const restore = (items, expenseIds) => {
    const st = S();
    st.expenses = st.expenses.filter((x) => !expenseIds.includes(x.id));
    items.forEach((it) => { if (!st.inbox.some((x) => x.id === it.id)) st.inbox.push(it); });
    Store.commit();
  };
  box.addEventListener('click', async (ev) => {
    const t = ev.target;
    if (t.closest('[data-ib-setup]')) { Sheet.close(s); openInboxSetupSheet(); return; }
    if (busy) return;
    if (t.closest('[data-ib-all]')) {
      busy = true;
      try {
        const items = S().inbox.filter((it) => it.amount > 0 && it.categoryId && !it.dup).map((it) => ({ ...it }));
        const added = [];
        for (const it of items) { const e = await expenseFromInbox(byId(it.id) || it, it.categoryId); if (e) added.push(e.id); }
        Store.commit();
        toast(`Добавлено: ${added.length}`, { action: 'Отменить', onAction: () => restore(items, added) });
      } finally { busy = false; }
      return;
    }
    const card = t.closest('.ib-item');
    const it = card && byId(card.dataset.id);
    if (!it) return;
    const cat = t.closest('[data-ib-cat]');
    if (cat) {
      it.categoryId = cat.dataset.ibCat;
      Store.save();
      $$('[data-ib-cat]', card).forEach((x) => x.classList.toggle('on', x === cat));
      return;
    }
    if (t.closest('[data-ib-edit]')) { openForm(it); return; }
    if (t.closest('[data-ib-del]')) {
      const copy = { ...it };
      await collapseOut(card, -1);
      S().inbox = S().inbox.filter((x) => x.id !== it.id);
      Store.commit();
      toast('Удалено из «Входящих»', { action: 'Отменить', onAction: () => restore([copy], []) });
      return;
    }
    if (t.closest('[data-ib-ok]')) {
      busy = true;
      try {
        const copy = { ...it };
        const e = await addOne(it);
        if (!e) return;
        await collapseOut(card, 1);
        App.flash(e.id);
        Store.commit();
        fabSuccess();
        if (navigator.vibrate) navigator.vibrate(8);
        toast(`Добавлено: ${fmtMoney(e.amount, e.currency)}`, { action: 'Отменить', onAction: () => restore([copy], [e.id]) });
      } finally { busy = false; }
    }
  });
  const syncBtn = $('[data-ib-sync]', s.sheet);
  if (syncBtn) syncBtn.addEventListener('click', async () => {
    syncBtn.disabled = true;
    const r = await Inbox.sync({ force: true, loud: true });
    syncBtn.disabled = false;
    if (r && !r.added && !r.pending) { render(); toast('Новых трат нет'); }
    else if (r && r.added) toast(`Добавлено сразу (знакомые магазины): ${r.added}`);
  });
  render();
}

/* =====================================================================
   9b. Анимации-помощники: счётчик чисел, конфетти
   ===================================================================== */
const reduceMotion = () => window.matchMedia('(prefers-reduced-motion: reduce)').matches;
/** Плавно «досчитывает» число в элементе от from до to. */
function countUp(el, from, to, fmt, ms = 650) {
  if (!el) return;
  if (reduceMotion() || !isFinite(from) || Math.abs(to - from) < 0.005) { el.textContent = fmt(to); return; }
  const t0 = performance.now();
  const step = (t) => {
    const k = Math.min(1, (t - t0) / ms), e = 1 - Math.pow(1 - k, 3);
    el.textContent = fmt(from + (to - from) * e);
    if (k < 1 && el.isConnected) requestAnimationFrame(step);
  };
  el.textContent = fmt(from);
  requestAnimationFrame(step);
}
const EASE_OUT = 'cubic-bezier(.2,.8,.2,1)';
/** Строки и карточки появляются «лесенкой» (только первые — те, что видны на экране). */
function staggerIn(root, selector, { step = 32, start = 0, max = 12 } = {}) {
  if (!root || !root.animate || reduceMotion()) return;
  $$(selector, root).filter((el) => el.offsetParent !== null).slice(0, max).forEach((el, i) => {
    el.animate([{ opacity: 0, transform: 'translateY(10px)' }, { opacity: 1, transform: 'none' }], { duration: 380, delay: start + i * step, easing: EASE_OUT, fill: 'backwards' });
  });
}
const STAGGER_ROWS = ':scope > .card, :scope > .list, .stats > *, .tx-list > .tx, .list > .row, .list > .budget-row';
/** Въезд блока: dir > 0 — справа, dir < 0 — слева, 0 — снизу; строки внутри — «лесенкой». */
function slideIn(el, dir = 0) {
  if (!el || !el.animate || reduceMotion()) return;
  el.animate([{ opacity: 0, transform: dir ? `translateX(${dir < 0 ? -22 : 22}px)` : 'translateY(8px)' }, { opacity: 1, transform: 'none' }], { duration: 320, easing: EASE_OUT });
  staggerIn(el, STAGGER_ROWS, { start: 60 });
}
/** Плавно схлопывает элемент (удаление, скрытие). dir — куда уезжает: −1 влево, 1 вправо, 0 — просто тает. */
function collapseOut(el, dir = 0) {
  if (!el || !el.animate || reduceMotion() || !el.isConnected) return Promise.resolve();
  const h = el.offsetHeight, cs = getComputedStyle(el);

  return el.animate([
    { height: h + 'px', opacity: 1, transform: 'none', marginTop: cs.marginTop, marginBottom: cs.marginBottom, paddingTop: cs.paddingTop, paddingBottom: cs.paddingBottom },
    { height: h + 'px', opacity: 0, transform: `translateX(${dir * 40}px) scale(.97)`, offset: 0.55 },
    { height: '0px', opacity: 0, transform: `translateX(${dir * 40}px) scale(.97)`, marginTop: '0px', marginBottom: '0px', paddingTop: '0px', paddingBottom: '0px' },
  ], { duration: 340, easing: 'cubic-bezier(.4,0,.2,1)', fill: 'forwards' }).finished.catch(() => {});
}
/** Примеры в строке «ввод фразой» плавно сменяют друг друга. */
const PhraseHints = {

};
/** Число «докручивается» от прошлого показанного значения (для каждого места — своё). */
const shownNumbers = {};
function rollNumber(key, el, value, fmt) {
  if (!el) return;
  const from = key in shownNumbers ? shownNumbers[key] : 0;

/**
 * Скользящий «бегунок» у переключателей (.seg): плавно переезжает к выбранному пункту.
 * Работает для всех переключателей, в том числе появляющихся в листах.
 */
const SegThumb = {
  init() {
    const scan = (root) => { if (root.matches && root.matches('.seg')) this.attach(root); $$('.seg', root).forEach((x) => this.attach(x)); };

    new MutationObserver((muts) => {
      for (const m of muts) {
        if (m.type === 'childList') m.addedNodes.forEach((n) => { if (n.nodeType === 1) scan(n); });
        else if (m.target.parentElement && m.target.parentElement.classList.contains('has-thumb')) this.update(m.target.parentElement, true);
      }
    }).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ['class'] });
  },
  attach(seg) {
    if (seg._thumb) return;
    const t = document.createElement('i');

    seg.prepend(t);
    seg._thumb = t;
    seg.classList.add('has-thumb');

    if (!animate || t.style.opacity === '0' || !t.style.width) t.style.transition = 'none';
    t.style.opacity = '1';
    t.style.width = on.offsetWidth + 'px';
    t.style.height = on.offsetHeight + 'px';
    t.style.transform = `translate(${on.offsetLeft}px, ${on.offsetTop}px)`;
    if (t.style.transition === 'none') { void t.offsetWidth; t.style.transition = ''; }
  },

/** Небольшой праздничный салют (цель достигнута, долг закрыт). */
function confetti(x = window.innerWidth / 2, y = window.innerHeight * 0.35) {

const GOAL_EMOJIS = ['🎯', '✈️', '🏖️', '🏠', '🚗', '💻', '📱', '🎓', '💍', '🎁', '🛟', '🏥', '🐶', '🎸', '📷', '🚲', '🛋️', '👶'];

function normalizeGoal(x) {

    id: String(x.id || uid()), name: String(x.name || 'Цель').slice(0, 40), emoji: firstGrapheme(x.emoji) || '🎯',

function openGoalEditor(id) {

  const g = id ? st.goals.find((x) => x.id === id) : null;
  if (id && !g) return;
  const f = g ? { ...g } : { name: '', emoji: '🎯', color: GOAL_COLORS[st.goals.length % GOAL_COLORS.length], currency: b, target: '', saved: 0, deadline: null };
  const s = Sheet.open({
    title: g ? 'Цель' : 'Новая цель', left: 'Отмена',
    body: `<div class="cat-preview"><span class="em" id="g-prev" style="background:${rgba(f.color, 0.16)}">${esc(f.emoji)}</span></div>
      <div class="field"><input class="input" id="g-name" maxlength="40" placeholder="Например, Отпуск в Грузии" value="${esc(f.name)}"></div>
      <div class="field"><div class="field-label">Сколько нужно</div>${moneyFieldHtml('g-target', f.target, f.currency)}</div>
      ${g ? '' : `<div class="field"><div class="field-label">Уже отложено (необязательно)</div><input class="input" id="g-saved" inputmode="decimal" placeholder="0" autocomplete="off"></div>`}
      <div class="field"><div class="field-label">Срок</div><div class="chips" id="g-dl">
        <button type="button" class="chip sm${f.deadline ? '' : ' on'}" data-none>Без срока</button>
        <label class="chip sm date-chip${f.deadline ? ' on' : ''}">${icon('calendar', 17)}<span id="g-dl-label">${f.deadline ? fmtDay(f.deadline, true) : 'Выбрать дату'}</span><input type="date" id="g-dl-in" value="${f.deadline || ''}" min="${todayISO()}" aria-label="Срок цели"></label></div></div>
      <div class="field"><div class="field-label">Значок</div><div class="emoji-grid" id="g-emojis">${GOAL_EMOJIS.map((em) => `<button type="button" class="${em === f.emoji ? 'on' : ''}" data-em="${em}">${em}</button>`).join('')}</div></div>
      <div class="field"><div class="field-label">Цвет</div><div class="swatches" id="g-colors">${GOAL_COLORS.map((c) => `<button type="button" class="swatch${c === f.color ? ' on' : ''}" data-col="${c}" style="background:${c}" aria-label="Цвет"></button>`).join('')}</div></div>
      ${g && g.log.length ? `<div class="field"><div class="field-label">История</div><div class="list">${g.log.slice(-12).reverse().map((l) => `<div class="row"><span class="ri">${l.amount >= 0 ? '⬆️' : '⬇️'}</span><span class="rl">${fmtDay(toISO(new Date(l.at)))}</span><span class="rv ${l.amount >= 0 ? 'ok-text' : ''}">${l.amount >= 0 ? '+' : '−'}${fmtMoney(Math.abs(l.amount), g.currency)}</span></div>`).join('')}</div></div>` : ''}`,
    foot: `<button class="btn btn-primary" data-save>${g ? 'Сохранить' : 'Создать цель'}</button>${g ? '<div class="btn-row"><button class="btn btn-danger" data-del>Удалить цель</button></div>' : ''}`,
  });
  const q = (sel) => $(sel, s.sheet);
  if (!g) q('#g-name').focus({ preventScroll: true });
  bindCurChips(s.sheet, 'g-target', (c) => { f.currency = c; });
  q('#g-emojis').addEventListener('click', (e) => {
    const x = e.target.closest('[data-em]'); if (!x) return;
    f.emoji = x.dataset.em; q('#g-prev').textContent = f.emoji;
    $$('#g-emojis button', s.sheet).forEach((bt) => bt.classList.toggle('on', bt === x));
  });
  q('#g-colors').addEventListener('click', (e) => {
    const x = e.target.closest('[data-col]'); if (!x) return;
    f.color = x.dataset.col; q('#g-prev').style.background = rgba(f.color, 0.16);
    $$('#g-colors .swatch', s.sheet).forEach((bt) => bt.classList.toggle('on', bt === x));
  });
  const syncDl = () => {
    q('[data-none]').classList.toggle('on', !f.deadline);
    q('#g-dl .date-chip').classList.toggle('on', !!f.deadline);
    q('#g-dl-label').textContent = f.deadline ? fmtDay(f.deadline, true) : 'Выбрать дату';
  };
  q('[data-none]').addEventListener('click', () => { f.deadline = null; q('#g-dl-in').value = ''; syncDl(); });
  q('#g-dl-in').addEventListener('change', (e) => { f.deadline = e.target.value || null; syncDl(); });
  q('[data-save]').addEventListener('click', () => {
    const target = parseNum(q('#g-target').value);
    const name = q('#g-name').value.trim();
    if (!name) { shakeEl(q('#g-name')); toast('Как назовём цель?'); q('#g-name').focus(); return; }
    if (!(target > 0)) { shakeEl(q('.amount-wrap')); toast('Введите сумму цели'); return; }
    const data = { name, emoji: f.emoji, color: f.color, currency: f.currency, target: round2(target), deadline: f.deadline };
    let goal;
    if (g) { Object.assign(g, data); goal = g; }
    else {
      const saved = Math.max(0, parseNum(q('#g-saved').value) || 0);
      goal = normalizeGoal({ ...data, id: uid(), saved, createdAt: Date.now(), log: saved > 0 ? [{ at: Date.now(), amount: saved }] : [] });
      st.goals.push(goal);
    }
    const reached = goal.saved >= goal.target;
    if (reached && !goal.doneAt) goal.doneAt = Date.now();
    if (!reached) goal.doneAt = null;
    Sheet.close(s);
    Store.commit();
    toast(g ? 'Цель сохранена' : `Цель «${goal.name}» создана`);
  });
  const del = q('[data-del]');
  if (del) del.addEventListener('click', async () => {
    const ok = await confirmSheet({ title: `Удалить «${g.name}»?`, text: 'Цель и история пополнений будут удалены. Ваши покупки и доходы не изменятся.', ok: 'Удалить', danger: true });
    if (!ok) return;
    const i = st.goals.indexOf(g);
    st.goals.splice(i, 1);
    Sheet.close(s);
    Store.commit();
    toast('Цель удалена', { action: 'Отменить', onAction: () => { S().goals.splice(Math.min(i, S().goals.length), 0, g); Store.commit(); } });
  });
}
/** Пополнить цель или снять с неё. */
function openGoalTopUp(id) {
  const st = S(), g = st.goals.find((x) => x.id === id);
  if (!g) return;
  let mode = 'add';
  const left = Math.max(0, g.target - g.saved);
  const quick = unique([niceRound(g.target * 0.05), niceRound(g.target * 0.1), niceRound(g.target * 0.25)]).filter((v) => v > 0);
  const s = Sheet.open({
    title: `${g.emoji} ${g.name}`, left: 'Отмена',
    body: `<div class="seg kind-seg" id="gt-mode"><button type="button" class="on" data-m="add">Пополнить</button><button type="button" data-m="take">Снять</button></div>
      <div class="amount-wrap"><input class="amount-input" id="gt-amt" type="text" inputmode="decimal" placeholder="0" autocomplete="off" enterkeyhint="done"><span class="amount-cur">${esc(sym(g.currency))}</span></div>
      <div class="chips" id="gt-quick" style="margin-top:6px">${quick.map((v) => `<button type="button" class="chip sm" data-v="${v}">+${fmtMoney(v, g.currency, { short: true })}</button>`).join('')}
        ${left > 0 ? `<button type="button" class="chip sm" data-v="${left}">Вся сумма до цели</button>` : ''}</div>
      <p class="sheet-text" style="margin-top:16px">Отложено <b>${fmtMoney(g.saved, g.currency)}</b> из ${fmtMoney(g.target, g.currency)}${left > 0 ? ` · осталось ${fmtMoney(left, g.currency)}` : ''}</p>`,
    foot: '<button class="btn btn-primary" data-save>Пополнить</button>',
  });
  const q = (sel) => $(sel, s.sheet), input = q('#gt-amt');
  input.focus({ preventScroll: true });
  q('#gt-mode').addEventListener('click', (e) => {
    const x = e.target.closest('[data-m]'); if (!x) return;
    mode = x.dataset.m;
    $$('#gt-mode button', s.sheet).forEach((bt) => bt.classList.toggle('on', bt === x));
    q('[data-save]').textContent = mode === 'add' ? 'Пополнить' : 'Снять';
    q('#gt-quick').hidden = mode !== 'add';
  });
  q('#gt-quick').addEventListener('click', (e) => { const x = e.target.closest('[data-v]'); if (x) input.value = String(x.dataset.v).replace('.', ','); });
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter') q('[data-save]').click(); });
  q('[data-save]').addEventListener('click', () => {
    let v = parseNum(input.value);
    if (!(v > 0)) { shakeEl(q('.amount-wrap')); return; }
    if (mode === 'take') v = -Math.min(v, g.saved);
    if (!v) { toast('В цели пока ничего нет'); return; }
    const before = g.saved;
    g.saved = round2(Math.max(0, g.saved + v));
    g.log.push({ at: Date.now(), amount: round2(v) });
    if (g.log.length > 200) g.log.splice(0, g.log.length - 200);
    const reached = g.saved >= g.target && before < g.target;
    if (g.saved >= g.target) g.doneAt = g.doneAt || Date.now(); else g.doneAt = null;
    Sheet.close(s);
    Store.commit();
    if (reached) { setTimeout(() => confetti(), 250); toast(`🎉 Цель «${g.name}» достигнута!`, { duration: 4500 }); }
    else toast(v > 0 ? `+${fmtMoney(v, g.currency)} в «${g.name}»` : `Снято ${fmtMoney(-v, g.currency)}`);
  });
}

/* ---------- Долги ---------- */
function normalizeDebt(x) {
  if (!x || typeof x !== 'object' || !(Number(x.amount) > 0)) return null;
  return {
    id: String(x.id || uid()), person: String(x.person || '').trim().slice(0, 40) || 'Без имени',
    dir: x.dir === 'out' ? 'out' : 'in', amount: round2(Number(x.amount)),
    currency: /^[A-Z]{3}$/.test(x.currency) ? x.currency : base(),
    date: /^\d{4}-\d{2}-\d{2}$/.test(x.date) ? x.date : todayISO(), comment: String(x.comment || '').slice(0, 140),
    paid: round2(clamp(Number(x.paid) || 0, 0, Number(x.amount))), closedAt: Number(x.closedAt) || null,
    createdAt: Number(x.createdAt) || Date.now(),
    log: Array.isArray(x.log) ? x.log.filter((l) => l && isFinite(l.amount)).slice(-100).map((l) => ({ at: Number(l.at) || Date.now(), amount: round2(Number(l.amount)) })) : [],
  };
}
const debtLeft = (d) => round2(Math.max(0, d.amount - d.paid));
/** Цвет «аватарки» по имени — один и тот же человек всегда одного цвета. */
function personColor(name) {
  let h = 0;
  for (const ch of String(name)) h = (h * 31 + ch.codePointAt(0)) >>> 0;
  return GOAL_COLORS[h % GOAL_COLORS.length];
}
const avatar = (name) => `<span class="avatar" style="background:${rgba(personColor(name), 0.16)};color:${personColor(name)}">${esc(firstGrapheme(name).toUpperCase())}</span>`;
function debtRow(d, i) {
  const left = debtLeft(d), closed = !!d.closedAt;
  const sub = [d.comment ? esc(d.comment) : '', fmtDay(d.date), d.paid > 0 && !closed ? `вернули ${fmtMoney(d.paid, d.currency, { short: true })}` : ''].filter(Boolean).join(' · ');
  return `<button class="debt-row${closed ? ' closed' : ''}" style="--i:${i}" data-action="debt-open" data-id="${d.id}">
    ${avatar(d.person)}
    <span class="tx-main"><span class="tx-title">${esc(d.person)}</span><span class="tx-sub">${sub}</span></span>
    <span class="tx-amt"><span class="tx-base ${closed ? 'muted' : d.dir === 'in' ? 'ok-text' : 'bad-text'}">${closed ? '✓ ' + fmtMoney(d.amount, d.currency, { short: true }) : (d.dir === 'in' ? '+' : '−') + fmtMoney(left, d.currency, { short: true })}</span>
    <span class="tx-orig">${closed ? 'закрыт' : d.dir === 'in' ? 'вам должны' : 'вы должны'}</span></span></button>`;
}
function renderDebts() {
  const st = S(), box = $('#pl-content');
  const active = st.debts.filter((d) => !d.closedAt).sort((a, b) => (a.date < b.date ? 1 : -1));
  const closed = st.debts.filter((d) => d.closedAt).sort((a, b) => b.closedAt - a.closedAt);
  if (!st.debts.length) {
    box.innerHTML = `<div class="card empty plan-empty"><div class="em float">🤝</div><b>Кто кому должен</b>Заплатили за друга или взяли в долг — запишите, чтобы не забыть. Частичные возвраты тоже учитываются.
      <button class="btn btn-primary" data-action="debt-new" style="margin-top:18px">Записать долг</button></div>`;
    return;
  }
  const sums = (dir) => {
    const by = {};
    active.filter((d) => d.dir === dir).forEach((d) => { by[d.currency] = (by[d.currency] || 0) + debtLeft(d); });
    const keys = Object.keys(by);
    return keys.length ? keys.map((k) => fmtMoney(by[k], k, { short: true })).join('<br>') : '—';
  };
  box.innerHTML = `<div class="debt-sum">
      <div class="ds in"><span>Вам должны</span><b>${sums('in')}</b></div>
      <div class="ds out"><span>Вы должны</span><b>${sums('out')}</b></div></div>
    ${active.length ? `<div class="tx-list stagger">${active.map(debtRow).join('')}</div>` : '<p class="hint" style="text-align:center">Все долги закрыты 🎉</p>'}
    <button class="btn btn-secondary add-dashed" data-action="debt-new">＋ Записать долг</button>
    ${closed.length ? `<details class="closed-debts"><summary>Закрытые · ${closed.length}</summary><div class="tx-list">${closed.slice(0, 50).map(debtRow).join('')}</div></details>` : ''}`;
}
function openDebtEditor(id, preset = {}) {
  const st = S(), b = base();
  const d = id ? st.debts.find((x) => x.id === id) : null;
  if (id && !d) return;
  const f = d ? { ...d } : { dir: preset.dir || 'in', person: preset.person || '', amount: '', currency: b, date: todayISO(), comment: '' };
  const people = unique(st.debts.slice().sort((a, c) => c.createdAt - a.createdAt).map((x) => x.person)).slice(0, 8);
  const s = Sheet.open({
    title: d ? 'Долг' : 'Новый долг', left: 'Отмена',
    body: `<div class="seg kind-seg" id="d-dir"><button type="button" data-dir="in" class="${f.dir === 'in' ? 'on' : ''}">Мне должны</button><button type="button" data-dir="out" class="${f.dir === 'out' ? 'on' : ''}">Я должен</button></div>
      <div class="field"><input class="input" id="d-person" maxlength="40" placeholder="Кто? Например, Ахмед" value="${esc(f.person)}" autocomplete="off">
        ${people.length ? `<div class="chips" id="d-people" style="margin-top:8px">${people.map((p) => `<button type="button" class="chip sm" data-p="${esc(p)}">${esc(p)}</button>`).join('')}</div>` : ''}</div>
      <div class="field"><div class="field-label">Сумма</div>${moneyFieldHtml('d-amt', f.amount, f.currency)}</div>
      <div class="field"><input class="input" id="d-comment" maxlength="140" placeholder="За что? (необязательно)" value="${esc(f.comment)}"></div>
      <div class="field"><div class="field-label">Дата</div><div class="chips" id="d-dates">
        <button type="button" class="chip sm" data-d="0">Сегодня</button><button type="button" class="chip sm" data-d="-1">Вчера</button>
        <label class="chip sm date-chip">${icon('calendar', 17)}<span id="d-date-label"></span><input type="date" id="d-date" value="${f.date}" aria-label="Дата"></label></div></div>`,
    foot: `<button class="btn btn-primary" data-save>${d ? 'Сохранить' : 'Записать'}</button>${d ? '<div class="btn-row"><button class="btn btn-danger" data-del>Удалить</button></div>' : ''}`,
  });
  const q = (sel) => $(sel, s.sheet);
  if (!d) q('#d-person').focus({ preventScroll: true });
  bindCurChips(s.sheet, 'd-amt', (c) => { f.currency = c; });
  q('#d-dir').addEventListener('click', (e) => {
    const x = e.target.closest('[data-dir]'); if (!x) return;
    f.dir = x.dataset.dir;
    $$('#d-dir button', s.sheet).forEach((bt) => bt.classList.toggle('on', bt === x));
  });
  const pp = q('#d-people');
  if (pp) pp.addEventListener('click', (e) => { const x = e.target.closest('[data-p]'); if (x) { q('#d-person').value = x.dataset.p; q('#d-amt').focus(); } });
  const syncDates = () => {
    const t = todayISO();
    $$('#d-dates [data-d]', s.sheet).forEach((x) => x.classList.toggle('on', addDays(t, +x.dataset.d) === f.date));
    const other = f.date !== t && f.date !== addDays(t, -1);
    q('#d-dates .date-chip').classList.toggle('on', other);
    q('#d-date-label').textContent = other ? fmtDay(f.date) : 'Другая дата';
  };
  q('#d-dates').addEventListener('click', (e) => { const x = e.target.closest('[data-d]'); if (x) { f.date = addDays(todayISO(), +x.dataset.d); q('#d-date').value = f.date; syncDates(); } });
  q('#d-date').addEventListener('change', (e) => { if (e.target.value) { f.date = e.target.value; syncDates(); } });
  syncDates();
  q('[data-save]').addEventListener('click', () => {
    const person = q('#d-person').value.trim();
    const amount = parseNum(q('#d-amt').value);
    if (!person) { shakeEl(q('#d-person')); toast('Укажите, кто'); q('#d-person').focus(); return; }
    if (!(amount > 0)) { shakeEl(q('.amount-wrap')); toast('Введите сумму'); return; }
    const data = { person, dir: f.dir, amount: round2(amount), currency: f.currency, date: f.date, comment: q('#d-comment').value.trim() };
    if (d) {
      Object.assign(d, data);
      d.paid = Math.min(d.paid, d.amount);
      d.closedAt = d.paid >= d.amount ? d.closedAt || Date.now() : null;
    } else st.debts.push(normalizeDebt({ ...data, id: uid(), createdAt: Date.now() }));
    Sheet.close(s);
    Store.commit();
    toast(d ? 'Сохранено' : `${person}: ${f.dir === 'in' ? 'вам должны' : 'вы должны'} ${fmtMoney(amount, f.currency)}`);

  const del = q('[data-del]');
  if (del) del.addEventListener('click', () => {
    const i = st.debts.indexOf(d);
    st.debts.splice(i, 1);

    Store.commit();
    toast('Долг удалён', { action: 'Отменить', onAction: () => { S().debts.splice(Math.min(i, S().debts.length), 0, d); Store.commit(); } });
  });
}
/** Карточка долга: возврат целиком или частями. */
function openDebtSheet(id) {
  const st = S(), d = st.debts.find((x) => x.id === id);
  if (!d) return;
  const s = Sheet.open({ title: d.person, right: '<button class="link-btn" data-edit>Изменить</button>', body: '<div id="debt-box"></div>', refresh: () => render() });
  const render = () => {
    if (!st.debts.includes(d)) { Sheet.close(s); return; }
    const left = debtLeft(d), p = d.amount ? d.paid / d.amount : 0, closed = !!d.closedAt;
    $('#debt-box', s.sheet).innerHTML = `<div class="debt-hero ${d.dir}">
        ${avatar(d.person)}
        <div class="dh-label">${closed ? 'Долг закрыт' : d.dir === 'in' ? 'Вам должны' : 'Вы должны'}</div>
        <div class="dh-amt">${fmtMoney(closed ? d.amount : left, d.currency)}</div>
        ${d.comment ? `<div class="dh-sub">${esc(d.comment)} · ${fmtDay(d.date)}</div>` : `<div class="dh-sub">${fmtDay(d.date)}</div>`}
        <div class="progress" style="margin-top:14px"><i style="width:${clamp(p * 100, 0, 100)}%;background:var(--ok)"></i></div>
        <div class="dh-sub" style="margin-top:6px">Возвращено ${fmtMoney(d.paid, d.currency)} из ${fmtMoney(d.amount, d.currency)}</div>
      </div>
      ${closed ? '<button class="btn btn-secondary" data-reopen>Открыть снова</button>' : `<button class="btn btn-primary" data-all>${d.dir === 'in' ? 'Вернули всё' : 'Я вернул всё'} ✓</button>
        <div class="partial" id="partial"><input class="input" id="part-in" inputmode="decimal" placeholder="Вернули часть — сколько?" autocomplete="off" enterkeyhint="done"><button class="btn btn-secondary" data-part>Записать</button></div>`}
      ${d.log.length ? `<div class="field"><div class="field-label">Возвраты</div><div class="list">${d.log.slice(-10).reverse().map((l) => `<div class="row"><span class="ri">↩️</span><span class="rl">${fmtDay(toISO(new Date(l.at)))}</span><span class="rv">${fmtMoney(l.amount, d.currency)}</span></div>`).join('')}</div></div>` : ''}`;
  };
  const pay = (v) => {
    v = round2(Math.min(v, debtLeft(d)));
    if (!(v > 0)) return;
    d.paid = round2(d.paid + v);
    d.log.push({ at: Date.now(), amount: v });
    const done = d.paid >= d.amount;
    if (done) d.closedAt = Date.now();
    Store.commit();
    if (done) { confetti(); toast('Долг закрыт 🎉'); Sheet.close(s); }
    else toast(`Записан возврат ${fmtMoney(v, d.currency)}`);
  };
  s.body.addEventListener('click', (e) => {
    if (e.target.closest('[data-all]')) pay(debtLeft(d));
    if (e.target.closest('[data-part]')) {
      const v = parseNum($('#part-in', s.sheet).value);
      if (!(v > 0)) { shakeEl($('#partial', s.sheet)); return; }
      pay(v);
    }
    if (e.target.closest('[data-reopen]')) { d.closedAt = null; d.paid = 0; d.log = []; Store.commit(); toast('Долг снова открыт'); }
  });
  s.body.addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.target.id === 'part-in') $('[data-part]', s.sheet).click(); });
  $('[data-edit]', s.sheet).addEventListener('click', () => openDebtEditor(d.id));
  render();
}

/* =====================================================================
   9d. Ввод одной фразой: «кофе 120», «такси 380 вчера», «зарплата 45к»
   ===================================================================== */
/** Ключевые слова → категория расходов (по началу слова). */

/**
 * Разбирает фразу. Возвращает { kind, amount, currency, date, categoryId, comment, tags } (amount может быть null).
 * Порядок: теги → дата → «к/тыс» → валюта словом → сумма → категория → остаток — комментарий.
 */
function parsePhrase(input) {
  let t = ' ' + String(input || '').replace(/\s+/g, ' ').trim() + ' ';
  const out = { kind: 'expense', amount: null, currency: null, date: todayISO(), dateSet: false, categoryId: null, comment: '', tags: [] };
  if (!t.trim()) return out;
  // доход: «+5000», «зарплата 45к», «получил 300»
  if (/^\s*\+/.test(t)) { out.kind = 'income'; t = t.replace(/^\s*\+/, ' '); }
  if (INCOME_WORDS.test(t)) out.kind = 'income';
  // теги
  t = t.replace(/(^|\s)#([\p{L}\p{N}_-]+)/gu, (m, sp, tag) => { out.tags.push(normTag(tag)); return ' '; });
  // дата
  const today = todayISO();
  const setDate = (d) => { out.date = d; out.dateSet = true; return ' '; };
  t = t.replace(/(^|\s)позавчера(?=\s|$|[.,!])/i, () => setDate(addDays(today, -2)));
  t = t.replace(/(^|\s)вчера(?=\s|$|[.,!])/i, () => setDate(addDays(today, -1)));
  t = t.replace(/(^|\s)сегодня(?=\s|$|[.,!])/i, () => setDate(today));
  // «12.11», «05.03.2026» (месяц — двумя цифрами, иначе «1.5» — это сумма); не перед символом валюты
  t = t.replace(/(^|\s)(\d{1,2})[./](\d{2})(?:[./](\d{2,4}))?(?=\s|$)(?!\s?[₺$€£₽₾₸₴])/, (m, sp, dd, mm, yy) => {
    const now = new Date(), d = +dd, mo = +mm;
    if (d < 1 || d > 31 || mo < 1 || mo > 12) return m;
    let y = yy ? (+yy < 100 ? 2000 + +yy : +yy) : now.getFullYear();
    let iso = `${y}-${pad(mo)}-${pad(d)}`;
    if (!yy && iso > today) iso = `${y - 1}-${pad(mo)}-${pad(d)}`; // «25.12» в январе — это прошлый декабрь
    return parseISO(iso).getDate() === d ? setDate(iso) : m;
  });
  for (let wd = 0; wd < 7; wd++) {
    const re = new RegExp(`(^|\\s)(во?\\s)?(${WEEKDAY_WORDS[wd]})(?=\\s|$|[.,!])`, 'i');
    if (re.test(t)) {
      t = t.replace(re, ' ');
      const diff = (new Date().getDay() - wd + 7) % 7 || 7; // ближайший прошедший такой день
      setDate(addDays(today, -diff));
      break;
    }
  }
  // «45к», «1,5 тыс»
  t = t.replace(/(\d+(?:[.,]\d+)?)\s?(к|k|тыс\.?|тысяч[иа]?)(?=\s|$|[.,!])/gi, (m, n) => String(Math.round(parseNum(n) * 1000)));
  // валюта словом
  for (const [re, code] of CUR_WORDS) { if (re.test(t)) { out.currency = code; t = t.replace(re, ' '); break; } }
  // сумма (рядом с символом валюты — приоритетнее)
  let best = null;
  for (const m of t.matchAll(MONEY_RE)) {
    const amount = parseAmountStr(m[2]);
    if (!(amount > 0)) continue;
    const cur = curFrom(m[1] && /[^\p{L}]/u.test(m[1]) ? m[1] : null) || curFrom(m[3] && /[^\p{L}]/u.test(m[3]) ? m[3] : null) || curFrom(m[1] && /^[A-Z]{3}$/.test(m[1]) ? m[1] : null) || curFrom(m[3] && /^[A-Z]{3}$/.test(m[3]) ? m[3] : null);
    if (!best || (cur && !best.cur)) best = { amount, cur, m };
    if (cur) break;
  }
  if (best) {
    out.amount = round2(best.amount);
    if (best.cur) out.currency = best.cur;
    // вырезаем саму сумму (и символ валюты, если он был частью совпадения)
    const whole = best.m[0];
    let rest = whole.replace(best.m[2], ' ');
    [best.m[1], best.m[3]].forEach((part) => { if (part && curFrom(part)) rest = rest.replace(part, ' '); });
    t = t.replace(whole, rest);
  }
  // остаток — комментарий; категория — по словам
  let words = t.replace(/[,!]+/g, ' ').replace(/\s+/g, ' ').trim();
  words = words.replace(/^(на|за|в|во)\s+/i, '').replace(/\s+(на|за|в|во)$/i, '');
  out.comment = words ? words.charAt(0).toUpperCase() + words.slice(1) : '';
  const low = ' ' + words.toLowerCase().replace(/ё/g, 'е') + ' ';
  // '=слово' — только целое слово («бар» не должен ловить «барбершоп»), иначе — начало слова
  const hit = (list) => list.find(([, keys]) => keys.some((k) => (k[0] === '=' ? low.includes(' ' + k.slice(1) + ' ') : low.includes(' ' + k.replace(/ё/g, 'е')))));
  if (out.kind === 'income') {
    const h = hit(INCOME_HINTS);
    out.categoryId = h ? h[0] : 'other_in';
  } else if (words) {
    const ids = new Set(S().categories.map((c) => c.id));
    const norm = (x) => String(x).toLowerCase().replace(/ё/g, 'е').replace(/[^\p{L}\p{N}]+/gu, ' ').trim();
    // 1) запомненный магазин, 2) название категории, 3) словарь подсказок, 4) подсказки магазинов
    const learned = suggestCategory(words);
    const byName = S().categories.find((c) => { const n = norm(c.name); return n && (low.includes(' ' + n + ' ') || n.split(' ').some((w) => w.length >= 4 && low.includes(' ' + w.slice(0, Math.max(4, w.length - 2))))); });
    const h = hit(PHRASE_HINTS.filter(([id]) => ids.has(id)));
    out.categoryId = learned && learned.learned ? learned.id : byName ? byName.id : h ? h[0] : learned ? learned.id : null;
  }
  return out;
}

/** Запись по разобранной фразе (с автоматическим курсом). Возвращает запись или null. */

function monthStats(ym) {
  const st = S(), from = ym + '-01', to = monthEnd(from), today = todayISO();
  const list = inRange(st.expenses, from, to), incomes = inRange(st.incomes, from, to);
  const total = sumBase(list), income = sumBase(incomes);
  const pf = addMonths(from, -1), prevTotal = sumBase(inRange(st.expenses, pf, monthEnd(pf)));
  const byCat = new Map();
  list.forEach((e) => byCat.set(e.categoryId, (byCat.get(e.categoryId) || 0) + (e.baseAmount || 0)));
  const cats = [...byCat].map(([id, sum]) => ({ cat: getCat(id), sum })).filter((x) => x.sum > 0).sort((a, b) => b.sum - a.sum);
  const byDay = {};
  list.forEach((e) => { byDay[e.date] = (byDay[e.date] || 0) + (e.baseAmount || 0); });
  const bigDay = Object.entries(byDay).sort((a, b) => b[1] - a[1])[0] || null;
  const lastDay = minISO(to, today);
  const days = lastDay < from ? 0 : daysBetween(from, lastDay) + 1;
  let freeDays = 0;
  for (let d = from; d <= lastDay; d = addDays(d, 1)) if (!byDay[d]) freeDays++;
  const top = list.slice().sort((a, b) => (b.baseAmount || 0) - (a.baseAmount || 0)).slice(0, 3);
  const withBudget = st.categories.filter((c) => c.budget > 0);
  const kept = withBudget.filter((c) => (byCat.get(c.id) || 0) <= c.budget).length;
  return { ym, from, to, list, total, income, balance: income - total, prevTotal, cats, bigDay, days, freeDays, top, avg: days ? total / days : 0, withBudget: withBudget.length, kept };
}

/** Рисует картинку итогов (1080×1350) на canvas. */

/* =====================================================================
   9f. Бюджеты: предупреждение о 80 % и 100 % лимита (внутри приложения)
   ===================================================================== */
const BudgetAlerts = {
  timer: null,
  /** Уровни: 0 — меньше 80 %, 1 — от 80 %, 2 — превышен. */
  levels() {
    const st = S(), t = todayISO(), from = monthStart(t), to = monthEnd(t);
    const list = inRange(st.expenses.filter((e) => !e.demo), from, to);
    const by = {};
    list.forEach((e) => { by[e.categoryId] = (by[e.categoryId] || 0) + (e.baseAmount || 0); });
    const lv = (spent, lim) => (lim > 0 ? (spent >= lim ? 2 : spent >= lim * 0.8 ? 1 : 0) : 0);
    const out = { total: { level: lv(sumBase(list), st.settings.totalBudget), name: 'Общий бюджет' } };
    st.categories.forEach((c) => { if (c.budget > 0) out[c.id] = { level: lv(by[c.id] || 0, c.budget), name: `«${c.name}»` }; });
    return { ym: from.slice(0, 7), out };
  },
  check({ silent = false } = {}) {
    const st = S(), { ym, out } = this.levels();
    const prev = (st.meta.budgetAlerts && st.meta.budgetAlerts[ym]) || {};
    const fresh = [];
    const next = {};
    Object.entries(out).forEach(([k, v]) => {
      next[k] = v.level;
      if (v.level > (prev[k] || 0)) fresh.push(v);
    });
    st.meta.budgetAlerts = { [ym]: { ...prev, ...next } };
    Store.save();
    if (silent || !fresh.length) return;
    fresh.sort((a, b) => b.level - a.level);
    const over = fresh.filter((x) => x.level === 2), warn = fresh.filter((x) => x.level === 1);
    const msg = over.length
      ? `🔴 ${over.map((x) => x.name).join(', ')}: лимит превышен`
      : `⚠️ ${warn.map((x) => x.name).join(', ')}: потрачено 80% бюджета`;
    setTimeout(() => toast(msg, { action: 'Бюджеты', duration: 6000, onAction: () => { PlanView.tab = 'budgets'; App.go('budgets'); renderPlans(); } }), 700);
  },
  schedule() { clearTimeout(this.timer); this.timer = setTimeout(() => this.check(), 250); },
};
