/* =====================================================================
   9h. Облачная копия: шифруется на телефоне (AES-256-GCM), ключ — из кода восстановления.
   Сервер хранит только шифротекст и не знает кода; id копии тоже выводится из кода.
   ===================================================================== */
const BC_ALPHABET = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; // без 0/O и 1/I, чтобы не путать
const bytesToB64 = (bytes) => { let s = ''; bytes.forEach((b) => { s += String.fromCharCode(b); }); return btoa(s); };
const b64ToBytes = (b64) => Uint8Array.from(atob(b64), (c) => c.charCodeAt(0));
const b64uToBytes = (s) => b64ToBytes(String(s).replace(/-/g, '+').replace(/_/g, '/') + '==='.slice((String(s).length + 3) % 4));
/** Быстрый хеш строки (чтобы не отправлять одинаковую копию повторно). */
function cyrb53(str, seed = 0) {
  let h1 = 0xdeadbeef ^ seed, h2 = 0x41c6ce57 ^ seed;
  for (let i = 0; i < str.length; i++) { const ch = str.charCodeAt(i); h1 = Math.imul(h1 ^ ch, 2654435761); h2 = Math.imul(h2 ^ ch, 1597334677); }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(36);
}
const Backup = {
  busy: false,
  cfg() { return S().settings.backup; },
  on() { const c = this.cfg(); return !!(c.enabled && c.code); },
  /** Новый код: 20 случайных байт → 32 символа, группы по 4. */
  newCode() {
    const bytes = crypto.getRandomValues(new Uint8Array(20));
    let bits = 0, val = 0, out = '';
    bytes.forEach((b) => { val = (val << 8) | b; bits += 8; while (bits >= 5) { out += BC_ALPHABET[(val >>> (bits - 5)) & 31]; bits -= 5; } });
    return out.match(/.{4}/g).join('-');
  },
  /** Код → байты (или null, если код с ошибкой). Регистр, пробелы и дефисы не важны. */
  codeBytes(code) {
    const clean = String(code || '').toUpperCase().replace(/[\s-]/g, '');
    if (clean.length !== 32 || [...clean].some((ch) => !BC_ALPHABET.includes(ch))) return null;
    const out = new Uint8Array(20);
    let bits = 0, val = 0, i = 0;
    for (const ch of clean) { val = (val << 5) | BC_ALPHABET.indexOf(ch); bits += 5; if (bits >= 8) { out[i++] = (val >>> (bits - 8)) & 255; bits -= 8; } }
    return out;
  },
  async keys(code) {
    const raw = this.codeBytes(code);
    if (!raw) throw new Error('bad_code');
    const base = await crypto.subtle.importKey('raw', raw, 'HKDF', false, ['deriveBits', 'deriveKey']);
    const salt = new TextEncoder().encode('traty-backup-v1');
    const idBits = new Uint8Array(await crypto.subtle.deriveBits({ name: 'HKDF', hash: 'SHA-256', salt, info: new TextEncoder().encode('id') }, base, 128));
    const key = await crypto.subtle.deriveKey({ name: 'HKDF', hash: 'SHA-256', salt, info: new TextEncoder().encode('enc') }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
    return { id: Array.from(idBits, (b) => b.toString(16).padStart(2, '0')).join(''), key };
  },
  async gzip(bytes, dir) {
    const S2 = dir === 'c' ? window.CompressionStream : window.DecompressionStream;
    const stream = new Blob([bytes]).stream().pipeThrough(new S2('gzip'));
    return new Uint8Array(await new Response(stream).arrayBuffer());
  },
  async encrypt(code, text) {
    const { id, key } = await this.keys(code);
    let data = new TextEncoder().encode(text), gz = false;
    if (window.CompressionStream) { try { data = await this.gzip(data, 'c'); gz = true; } catch (e) { /* без сжатия */ } }
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, data));
    return { id, envelope: { v: 1, alg: 'A256GCM', gz, iv: bytesToB64(iv), ct: bytesToB64(ct) } };
  },
  async decrypt(code, envl) {
    const { key } = await this.keys(code);
    let data = new Uint8Array(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64ToBytes(envl.iv) }, key, b64ToBytes(envl.ct)));
    if (envl.gz) data = await this.gzip(data, 'd');
    return new TextDecoder().decode(data);
  },
  snapshot() {
    const st = S();
    return { settings: st.settings, categories: st.categories, templates: st.templates, merchantRules: st.merchantRules, expenses: st.expenses, incomes: st.incomes, goals: st.goals, debts: st.debts, inbox: st.inbox };
  },
  count(x) { return (x.expenses || []).filter((e) => !e.demo).length + (x.incomes || []).length + (x.goals || []).length + (x.debts || []).length; },
  /**
   * Отправить копию. Автоматическая копия пропускается, если ничего не изменилось
   * или данных вдруг стало намного меньше (защита от случайного «Удалить всё»).
   */
  async upload({ manual = false } = {}) {
    if (this.busy || !this.on() || !Inbox.configured()) return 'off';
    const c = this.cfg(), snap = this.snapshot();
    // отпечаток без служебных полей копии (время, счётчики), иначе каждая копия «отличается» от прошлой
    const hash = cyrb53(JSON.stringify({ ...snap, settings: { ...snap.settings, backup: { enabled: c.enabled, code: c.code } } }));
    const count = this.count(snap);
    if (!manual) {
      if (hash === c.lastHash) return 'same';
      if (!count) return 'empty';
      if (c.lastCount >= 10 && count < c.lastCount * 0.5) { c.paused = true; Store.save(); return 'paused'; }
    }
    this.busy = true;
    try {
      const { id, envelope } = await this.encrypt(c.code, JSON.stringify({ app: 'traty', version: APP_VERSION, at: new Date().toISOString(), data: snap }));
      await Inbox.req(`/backup?id=${id}`, { method: 'POST', body: envelope });
      Object.assign(c, { lastAt: Date.now(), lastHash: hash, lastCount: count, paused: false });
      S().meta.lastBackupAt = Date.now();
      Store.save();
      App.dirty.add('settings');
      return 'ok';
    } finally { this.busy = false; }
  },
  maybeAuto() {
    const c = this.cfg();
    if (!this.on() || navigator.onLine === false || Date.now() - (c.lastAt || 0) < 20 * 36e5) return;
    this.upload().catch(() => { /* попробуем при следующем открытии */ });
  },
  async versions(code) {
    const { id } = await this.keys(code);
    const j = await Inbox.req(`/backup?id=${id}`, { cfg: { url: S().settings.inbox.url || DEFAULT_INBOX_URL, token: S().settings.inbox.token || '' } });
    return { id, list: Array.isArray(j.versions) ? j.versions : [] };
  },
  async fetchData(code, id, v) {
    const envl = await Inbox.req(`/backup?id=${id}&v=${v}`, { cfg: { url: S().settings.inbox.url || DEFAULT_INBOX_URL, token: S().settings.inbox.token || '' } });
    const parsed = JSON.parse(await this.decrypt(code, envl));
    if (!parsed || !parsed.data || !Array.isArray(parsed.data.expenses)) throw new Error('bad_backup');
    return parsed;
  },
  /** Заменить данные на устройстве копией из облака. */
  restore(code, parsed) {
    const d = parsed.data, old = S();
    const fresh = migrate({ ...d, meta: { ...old.meta, installHintShown: true } });
    fresh.settings.backup = { ...fresh.settings.backup, enabled: true, code: this.formatCode(code), paused: false };
    if (!(fresh.settings.inbox && fresh.settings.inbox.token) && old.settings.inbox.token) fresh.settings.inbox = { ...old.settings.inbox };
    Store.state = fresh;
    clearFilters();
    Store.commit();
    applyTheme();
  },
  formatCode(code) { return String(code).toUpperCase().replace(/[^A-Z0-9]/g, '').match(/.{1,4}/g).join('-'); },
};
/** Код по группам: переносится только между группами. */
const codeHtml = (code) => String(code).split('-').map((g, i, a) => `<span class="cg">${esc(g)}${i < a.length - 1 ? '-' : ''}</span>`).join('<wbr>');
const fmtWhen = (ms) => { const d = toISO(new Date(ms)); return `${d === todayISO() ? 'сегодня' : d === addDays(todayISO(), -1) ? 'вчера' : fmtDay(d)}, ${timeOf(ms)}`; };
/** Подключение к серверу «Входящие», если его ещё нет (нужно для копий и уведомлений). */
async function ensureConnected() {
  if (Inbox.configured()) return true;
  const j = await Inbox.req('/register', { method: 'POST', cfg: { url: DEFAULT_INBOX_URL, token: '' } });
  if (!j.key) throw new Error('no_key');
  S().settings.inbox = { ...S().settings.inbox, url: DEFAULT_INBOX_URL, token: j.key };
  Store.save();
  return true;
}

/* =====================================================================
   9i. Уведомления: напоминание вечером, бюджет 80 % и 100 %, итоги месяца
   Отправляет сервер «Входящие» (Web Push). Приложение передаёт ему только
   лимиты и потраченные суммы текущего месяца — без списка покупок.
   ===================================================================== */
const Notify = {
  timer: null,
  cfg() { return S().settings.notify; },
  supported() { return 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window; },
  needsInstall() { return isIOS() && !isStandalone(); },
  async subscription() {
    const reg = await navigator.serviceWorker.ready;
    return reg.pushManager.getSubscription();
  },
  /** Включение: разрешение → подписка → сервер. Вызывать прямо из нажатия (иначе iOS не спросит разрешение). */
  async enable() {
    const perm = await Notification.requestPermission();
    if (perm !== 'granted') { const e = new Error('denied'); e.code = 'denied'; throw e; }
    await ensureConnected();
    const j = await Inbox.req('/push/key');
    const reg = await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64uToBytes(j.key) });
    await this.sendPrefs(sub);
    this.cfg().enabled = true;
    Store.save();
    await this.sendState().catch(() => {});
  },
  async sendPrefs(sub) {
    sub = sub || await this.subscription();
    if (!sub) throw new Error('no_subscription');
    const n = this.cfg();
    let tz = 'UTC';
    try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || 'UTC'; } catch (e) { /* UTC */ }
    await Inbox.req('/push/subscribe', { method: 'POST', body: { sub: sub.toJSON(), tz, remind: n.remind || null, budget: n.budget !== false, summary: n.summary !== false } });
  },
  async disable() {
    try { await Inbox.req('/push/unsubscribe', { method: 'POST', body: {} }); } catch (e) { /* уже нет */ }
    try { const sub = await this.subscription(); if (sub) await sub.unsubscribe(); } catch (e) { /* не важно */ }
    this.cfg().enabled = false;
    Store.save();
  },
  scheduleState() {
    if (!this.cfg().enabled || !Inbox.configured()) return;
    clearTimeout(this.timer);
    this.timer = setTimeout(() => this.sendState().catch(() => {}), 2500);
  },
  /** Сводка бюджета месяца для сервера (чтобы он мог предупредить, когда траты приходят из Apple Pay). */
  async sendState() {
    if (!this.cfg().enabled || !Inbox.configured() || navigator.onLine === false) return;
    const st = S(), t = todayISO(), from = monthStart(t), ym = from.slice(0, 7);
    const list = inRange(st.expenses.filter((e) => !e.demo), from, monthEnd(t));
    const by = {};
    list.forEach((e) => { by[e.categoryId] = (by[e.categoryId] || 0) + (e.baseAmount || 0); });
    const cats = {};
    st.categories.forEach((c) => { if (c.budget > 0) cats[c.id] = { name: c.name, limit: c.budget, spent: round2(by[c.id] || 0) }; });
    const last = [...st.expenses, ...st.incomes].reduce((m, e) => Math.max(m, e.createdAt || 0), 0);
    const alerted = (st.meta.budgetAlerts && st.meta.budgetAlerts[ym]) || {};
    const j = await Inbox.req('/push/state', { method: 'POST', body: { state: { month: ym, base: base(), total: st.settings.totalBudget > 0 ? { limit: st.settings.totalBudget, spent: sumBase(list) } : null, cats }, alerted, lastActivity: last ? toISO(new Date(last)) : '' } });
    if (j && j.alerted) {
      const cur = (st.meta.budgetAlerts && st.meta.budgetAlerts[ym]) || {};
      Object.entries(j.alerted).forEach(([k, v]) => { cur[k] = Math.max(cur[k] || 0, Number(v) || 0); });
      st.meta.budgetAlerts = { [ym]: cur };
      Store.save();
    }
  },
};

function backupDue() {

function registerServiceWorker() {
  if (!('serviceWorker' in navigator) || !/^https?:$/.test(location.protocol)) return;
  const hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('./sw.js').then((reg) => {
    reg.addEventListener('updatefound', () => {
      const nw = reg.installing;
      if (!nw) return;
      nw.addEventListener('statechange', () => {
        if (nw.state === 'installed' && navigator.serviceWorker.controller) {
          toast('Доступна новая версия', { action: 'Обновить', duration: 15000, onAction: () => nw.postMessage('SKIP_WAITING') });
        }
      });
    });
  }).catch((e) => console.warn('Service worker не зарегистрирован:', e));
  let reloading = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!hadController || reloading) return; // первая установка — перезагрузка не нужна
    reloading = true;
    location.reload();
  });
}
/** Загрузка Chart.js с CDN без блокировки интерфейса. */
function loadChartJs() {
  return new Promise((resolve) => {
    if (window.Chart) { resolve(true); return; }
    const sc = document.createElement('script');
    sc.src = CHART_URL;
    sc.crossOrigin = 'anonymous';
    sc.async = true;
    sc.onload = () => resolve(!!window.Chart);
    sc.onerror = () => { sc.remove(); resolve(false); };
    document.head.append(sc);
  });
}
/** Клавиатура iOS: поднимаем нижний лист над клавиатурой через visualViewport. */
function setupViewport() {
  const vv = window.visualViewport;
  if (!vv) return;
  const root = document.documentElement;
  const update = () => {
    const kb = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
    root.style.setProperty('--kb', kb > 80 ? kb + 'px' : '0px');
    root.style.setProperty('--vvh', vv.height + 'px');
    root.classList.toggle('kb-open', kb > 80);
  };
  vv.addEventListener('resize', update);
  vv.addEventListener('scroll', update);
  update();
}

  'period-prev': () => shiftPeriod(-1),
  'period-next': () => shiftPeriod(1),
  'open-cat': (el) => openCategorySheet(el.dataset.id, analyticsRange),
  'budget-prev': () => { BudgetView.anchor = addMonths(BudgetView.anchor, -1); App.render('budgets'); slideIn($('#bu-content'), -1); },
  'budget-next': () => { BudgetView.anchor = addMonths(BudgetView.anchor, 1); App.render('budgets'); slideIn($('#bu-content'), 1); },
  'budget-edit': (el) => openBudgetEditor(el.dataset.id),
  'backup-now': () => exportJSON(),
  'backup-later': async (el) => { await collapseOut(el.closest('.banner')); S().meta.backupSnoozeAt = Date.now(); Store.commit(); toast('Напомню через неделю'); },
  'demo-clear': async () => {
    const ok = await confirmSheet({ title: 'Очистить демо-данные?', text: 'Будут удалены только демонстрационные покупки. Ваши записи, категории и настройки останутся.', ok: 'Очистить', danger: true });
    if (!ok) return;
    const st = S(), before = st.expenses;
    st.expenses = st.expenses.filter((e) => !e.demo);
    Store.commit();
    toast('Демо-данные удалены', { action: 'Отменить', onAction: () => { st.expenses = before; Store.commit(); } });
  },
  'base-currency': () => openBaseCurrencySheet(),
  currencies: () => openCurrenciesSheet(),
  categories: () => openCategoriesSheet(),
  payments: () => openPaymentsSheet(),
  theme: (el) => {
    const run = () => { S().settings.theme = el.dataset.v; Store.save(); applyTheme(); renderSettings(); };
    if (document.startViewTransition && !reduceMotion()) document.startViewTransition(run); else run();
  },
  'export-json': () => exportJSON(),
  'export-csv': () => exportCSV(),
  import: () => $('#import-file').click(),
  'clear-rates': async () => {
    const ok = await confirmSheet({ title: 'Очистить кэш курсов?', text: 'Сохранённые курсы будут загружены заново при необходимости. Курсы в уже сохранённых покупках не изменятся.', ok: 'Очистить' });
    if (ok) { Rates.clear(); renderSettings(); toast('Кэш курсов очищен'); }
  },
  'install-hint': () => openInstallSheet(),
  backup: () => openBackupSheet(),
  notify: () => openNotifySheet(),
  'goal-new': () => openGoalEditor(null),
  'goal-open': (el, e) => { if (e && e.target.closest('[data-action="goal-topup"]')) return; openGoalEditor(el.dataset.id); },
  'goal-topup': (el, e) => { if (e) e.stopPropagation(); openGoalTopUp(el.dataset.id); },
  'debt-new': () => openDebtEditor(null),
  'debt-open': (el) => openDebtSheet(el.dataset.id),
  'month-summary': (el) => openMonthSummary(el.dataset.m),
  'summary-hide': async (el) => { await collapseOut(el.closest('.banner')); S().meta.summarySeen = el.dataset.m; Store.save(); renderBanners(); },
  'phrase-form': () => openPhraseForm(),
  'share-app': () => shareApp(),
  inbox: () => openInboxSheet(),
  'inbox-setup': () => openInboxSetupSheet(),
  'merchant-rules': () => openMerchantRulesSheet(),
  'install-android': async () => { if (!deferredInstall) return; deferredInstall.prompt(); await deferredInstall.userChoice.catch(() => null); deferredInstall = null; renderSettings(); },
  wipe: async () => {
    const keepInbox = Inbox.configured();
    const ok = await confirmSheet({ title: 'Удалить все данные?', text: `Покупки, категории, шаблоны и настройки будут удалены с этого устройства. Сначала сделайте экспорт JSON, если данные нужны.${keepInbox ? ' Подключение к серверу «Входящие» сохранится — команды на iPhone продолжат работать.' : ''}${Backup.on() ? ' Облачные копии останутся — данные можно будет вернуть кодом восстановления.' : ''}`, ok: 'Удалить всё', danger: true });
    if (!ok) return;
    const old = S();
    const fresh = defaultState();
    fresh.meta.installHintShown = true;
    // ключ сервера не удаляем: иначе команды на iPhone будут слать траты в ящик, который приложение больше не читает
    if (keepInbox) {
      fresh.settings.inbox = { ...old.settings.inbox };
      fresh.meta.inboxSeen = old.meta.inboxSeen;
    }
    // код облачной копии и уведомления сохраняем — по коду можно вернуть данные
    fresh.settings.backup = { ...old.settings.backup };
    fresh.settings.notify = { ...old.settings.notify };
    Store.state = fresh;
    clearFilters();
    Store.commit();
    applyTheme();
    toast('Все данные удалены');
  },
};

/** Долгое нажатие (для шаблонов: открыть редактор вместо добавления). */
function bindLongPress(container, selector, handler) {
  let timer = null, fired = false, start = null;
  container.addEventListener('pointerdown', (e) => {
    const t = e.target.closest(selector);
    if (!t) return;
    fired = false; start = [e.clientX, e.clientY];
    timer = setTimeout(() => { fired = true; if (navigator.vibrate) navigator.vibrate(12); handler(t); }, 550);
  });
  const cancel = () => clearTimeout(timer);
  container.addEventListener('pointerup', cancel);
  container.addEventListener('pointercancel', cancel);
  container.addEventListener('pointerleave', cancel);
  container.addEventListener('pointermove', (e) => { if (start && Math.hypot(e.clientX - start[0], e.clientY - start[1]) > 10) cancel(); });
  container.addEventListener('click', (e) => { if (fired) { e.stopPropagation(); e.preventDefault(); fired = false; } }, true);
  container.addEventListener('contextmenu', (e) => { if (e.target.closest(selector)) e.preventDefault(); });
}

function bindStatic() {
  document.addEventListener('click', (e) => {
    const el = e.target.closest('[data-action]');
    if (!el || el.disabled) return;
    const fn = Actions[el.dataset.action];
    if (fn) fn(el, e);
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && Sheet.stack.length) Sheet.close(); });
  $('#home-search').addEventListener('input', debounce((e) => { Filters.q = e.target.value; homeLimit = 60; onFiltersChanged(); }, 150));
  $('#pl-seg').addEventListener('click', (e) => { const x = e.target.closest('[data-pl]'); if (x) setPlanTab(x.dataset.pl); });
  const phIn = $('#phrase-in');
  phIn.addEventListener('input', renderPhrasePreview);
  phIn.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); submitPhrase(); } });
  $('#phrase-go').addEventListener('click', () => submitPhrase());
  $('#an-seg').addEventListener('click', (e) => {
    const x = e.target.closest('[data-period]');
    if (!x) return;
    Period.type = x.dataset.period;
    if (Period.type === 'custom' && !Period.from) { Period.from = monthStart(todayISO()); Period.to = todayISO(); }
    App.render('analytics');
    slideIn($('#an-content'));
  });
  const onRange = () => {
    const a = $('#an-from').value, b = $('#an-to').value;
    if (!a || !b) return;
    Period.from = minISO(a, b); Period.to = maxISO(a, b);
    App.render('analytics');
  };
  $('#an-from').addEventListener('change', onRange);
  $('#an-to').addEventListener('change', onRange);
  $('#import-file').addEventListener('change', (e) => { const file = e.target.files[0]; e.target.value = ''; if (file) handleImportFile(file); });
  bindLongPress($('#home-templates'), '[data-action="tpl"]', (el) => openTemplateEditor(el.dataset.id));
  darkMQ.addEventListener('change', () => { if (S().settings.theme === 'system') applyTheme(); });
  window.addEventListener('online', () => { resolvePending(); App.refresh(); Inbox.sync(); });
  window.addEventListener('offline', () => toast('Нет интернета — курсы можно ввести вручную'));
  window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferredInstall = e; App.dirty.add('settings'); Sheet.refreshAll(); });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) return;
    if (App.day !== todayISO()) { App.day = todayISO(); Period.anchor = todayISO(); App.refresh(); } // наступил новый день
    else if (App.tab === 'home') renderBanners();
    Inbox.sync();
    Backup.maybeAuto();
  });
}

function init() {
  Rates.load();
  Store.load();
  applyTheme();
  setupViewport();
  bindStatic();
  App.go('home');
  slideIn($('#view-home'));
  SegThumb.init();
  PhraseHints.start();
  chartReady = loadChartJs();
  registerServiceWorker();
  maybeShowInstallHint();
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  setTimeout(resolvePending, 600);
  BudgetAlerts.check({ silent: true }); // запоминаем текущее состояние, чтобы не предупреждать о старом
  handleLaunchUrl(location.href);
  if (/[?&](tab|summary)=/.test(location.search)) history.replaceState(null, '', location.pathname + location.hash);
  if ('serviceWorker' in navigator) navigator.serviceWorker.addEventListener('message', (e) => { if (e.data && e.data.type === 'open') handleLaunchUrl(e.data.url); });
  setTimeout(() => Backup.maybeAuto(), 4000);
  setTimeout(() => Notify.scheduleState(), 5000);
  setTimeout(() => Inbox.sync(), 900);
}
document.addEventListener('DOMContentLoaded', init);
</script>
</body>
