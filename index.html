<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Траты — учёт расходов</title>
<meta name="description" content="Личный учёт расходов в разных валютах: быстрый ввод, аналитика, бюджеты. Работает без интернета.">
<meta name="theme-color" id="meta-theme" content="#F3F4F8">
<!-- iOS: запуск во весь экран с экрана «Домой» -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Траты">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<script>
  /* Ранний скрипт: тема до первой отрисовки (без «вспышки») и манифест только при работе по http(s). */
  (function () {
    try {
      var p = localStorage.getItem('traty.theme') || 'system';
      var dark = p === 'dark' || (p === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    } catch (e) { /* localStorage может быть недоступен — останется светлая тема */ }
    if (/^https?:$/.test(location.protocol)) {
      var l = document.createElement('link');
      l.rel = 'manifest'; l.href = 'manifest.json';
      document.head.appendChild(l);
    }
  })();
</script>
<style>
/* =====================================================================
   1. Дизайн-токены: светлая и тёмная тема
   ===================================================================== */
:root {
  --bg: #F3F4F8;
  --surface: #FFFFFF;
  --surface-2: #F1F2F7;
  --surface-3: #E4E6EE;
  --text: #0C0E16;
  --text-2: #646A7B;
  --text-3: #9BA1AF;
  --border: rgba(12, 16, 32, .08);
  --card-border: transparent;
  --accent: #5B4DFF;
  --accent-2: #8F62FF;
  --accent-soft: rgba(91, 77, 255, .12);
  --accent-text: #4A3CF0;
  --ok: #12B886;
  --warn: #F2A516;
  --bad: #F0445A;
  --seg-track: #E6E8EF;
  --seg-on: #FFFFFF;
  --tabbar-bg: rgba(255, 255, 255, .82);
  --shadow-sm: 0 1px 2px rgba(16, 20, 40, .04), 0 2px 8px rgba(16, 20, 40, .04);
  --shadow: 0 1px 2px rgba(16, 20, 40, .03), 0 8px 24px rgba(16, 20, 40, .06);
  --shadow-lg: 0 -12px 40px rgba(16, 20, 40, .16);
  --radius: 20px;
  --radius-sm: 14px;
  --sat: env(safe-area-inset-top, 0px);
  --sab: env(safe-area-inset-bottom, 0px);
  --sal: env(safe-area-inset-left, 0px);
  --sar: env(safe-area-inset-right, 0px);
  --tabbar-h: 62px;
  --kb: 0px;
  --ease: cubic-bezier(.2, .8, .2, 1);
  color-scheme: light;
}
[data-theme="dark"] {
  --bg: #0A0B0F;
  --surface: #15171E;
  --surface-2: #1D2029;
  --surface-3: #2A2E3A;
  --text: #F2F3F7;
  --text-2: #A2A8B6;
  --text-3: #6C7282;
  --border: rgba(255, 255, 255, .07);
  --card-border: rgba(255, 255, 255, .05);
  --accent: #7C6EFF;
  --accent-2: #A47EFF;
  --accent-soft: rgba(124, 110, 255, .18);
  --accent-text: #A99CFF;
  --seg-track: #1D2029;
  --seg-on: #2E3240;
  --tabbar-bg: rgba(18, 20, 26, .82);
  --shadow-sm: none;
  --shadow: none;
  --shadow-lg: 0 -12px 40px rgba(0, 0, 0, .55);
  color-scheme: dark;
}

/* =====================================================================
   2. База
   ===================================================================== */
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
html, body { margin: 0; background: var(--bg); color: var(--text); }
body {
  font: 16px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
  min-height: 100dvh;
  overscroll-behavior-y: none;
  transition: background-color .3s;
}
.sheet-open body { overflow: hidden; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; cursor: pointer; touch-action: manipulation; text-align: inherit; }
button:disabled { opacity: .35; cursor: default; }
input, select, textarea { font: inherit; color: inherit; font-size: 16px; } /* 16px — чтобы iOS не зумил поле */
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.muted { color: var(--text-2); }
.num { font-variant-numeric: tabular-nums; }
b, strong { font-weight: 700; }
svg.i { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* =====================================================================
   3. Каркас, верхняя панель, нижняя навигация
   ===================================================================== */
.app {
  max-width: 560px;
  margin: 0 auto;
  padding: calc(var(--sat) + 10px) calc(16px + var(--sar)) calc(var(--tabbar-h) + var(--sab) + 36px) calc(16px + var(--sal));
}
.view { display: none; }
.view.active { display: block; }
.topbar { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; padding: 6px 2px 14px; }
.topbar h1 { font-size: 32px; line-height: 1.1; font-weight: 800; letter-spacing: -.035em; margin: 0; }
.eyebrow { font-size: 13px; font-weight: 600; color: var(--text-2); margin-bottom: 2px; }
.icon-btn {
  position: relative; width: 42px; height: 42px; border-radius: 50%; flex: none;
  display: grid; place-items: center; background: var(--surface); box-shadow: var(--shadow-sm);
  border: 1px solid var(--card-border); transition: transform .15s var(--ease);
}
.icon-btn:active { transform: scale(.92); }
.icon-btn.sm { width: 36px; height: 36px; }
.icon-btn .badge {
  position: absolute; top: -3px; right: -3px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px;
  background: var(--accent); color: #fff; font-size: 11px; font-weight: 700; display: grid; place-items: center;
}

.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
  padding: 4px calc(8px + var(--sar)) calc(4px + var(--sab)) calc(8px + var(--sal));
  background: var(--tabbar-bg);
  -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px);
  border-top: 1px solid var(--border);
  user-select: none; -webkit-user-select: none;
}
.tabbar-inner { max-width: 560px; margin: 0 auto; height: var(--tabbar-h); display: grid; grid-template-columns: repeat(5, 1fr); align-items: center; }
.tab { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; font-weight: 600; color: var(--text-3); padding: 6px 0; transition: color .2s; }
.tab svg.i { width: 25px; height: 25px; }
.tab.active { color: var(--accent); }
.fab {
  justify-self: center; width: 60px; height: 60px; margin-top: -30px; border-radius: 50%;
  display: grid; place-items: center; color: #fff;
  background: linear-gradient(140deg, var(--accent-2), var(--accent));
  box-shadow: 0 10px 24px rgba(91, 77, 255, .42), 0 0 0 5px var(--bg);
  transition: transform .2s var(--ease);
}
.fab svg.i { width: 30px; height: 30px; stroke-width: 2.6; }
.fab:active { transform: scale(.9); }

/* =====================================================================
   4. Карточки, секции, кнопки, поля
   ===================================================================== */
.card { background: var(--surface); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); border: 1px solid var(--card-border); margin-bottom: 12px; }
.card h3 { font-size: 17px; font-weight: 750; letter-spacing: -.015em; margin: 0 0 4px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.card .card-sub { font-size: 13px; color: var(--text-2); margin: 0 0 8px; }
.section-head { display: flex; align-items: center; justify-content: space-between; margin: 24px 4px 10px; gap: 8px; }
.section-head h2 { font-size: 20px; font-weight: 780; letter-spacing: -.025em; margin: 0; }
.link-btn { color: var(--accent-text); font-weight: 600; font-size: 15px; padding: 4px 2px; }
.link-btn.sm { font-size: 14px; }

.btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; height: 54px; border-radius: 16px; font-weight: 700; font-size: 17px; transition: transform .15s var(--ease), opacity .15s; }
.btn:active { transform: scale(.98); }
.btn-primary { background: linear-gradient(140deg, var(--accent-2), var(--accent)); color: #fff; box-shadow: 0 8px 20px rgba(91, 77, 255, .28); }
.btn-secondary { background: var(--surface-2); color: var(--text); }
.btn-danger { background: rgba(240, 68, 90, .1); color: var(--bad); }
.btn-row { display: flex; gap: 8px; margin-top: 8px; }
.btn-row .btn { height: 44px; font-size: 14.5px; border-radius: 13px; }
.stack { display: grid; gap: 10px; }

.input {
  width: 100%; height: 50px; border-radius: 14px; padding: 0 14px;
  border: 1.5px solid transparent; background: var(--surface-2); outline: none;
  transition: border-color .15s, background .15s;
  -webkit-appearance: none; appearance: none;
}
.input:focus { border-color: var(--accent); background: var(--surface); }
.input::placeholder { color: var(--text-3); }
.field { margin-top: 18px; }
.field-label { font-size: 13px; font-weight: 650; color: var(--text-2); margin: 0 2px 8px; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips.scroll { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 2px 16px 6px; }
.chips.scroll::-webkit-scrollbar { display: none; }
.chip {
  flex: none; display: inline-flex; align-items: center; gap: 6px; height: 38px; padding: 0 14px;
  border-radius: 19px; background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow-sm);
  font-size: 15px; font-weight: 600; white-space: nowrap;
  transition: transform .15s var(--ease), background .15s, color .15s, border-color .15s;
  user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
}
.sheet .chip { background: var(--surface-2); border-color: transparent; box-shadow: none; }
.chip:active { transform: scale(.95); }
.chip.on, .sheet .chip.on { background: var(--accent); color: #fff; border-color: transparent; }
.chip.sm { height: 32px; padding: 0 12px; font-size: 14px; border-radius: 16px; }
.chip.ghost { background: transparent; box-shadow: none; border: 1.5px dashed var(--surface-3); color: var(--text-2); }
.chip .x { opacity: .75; font-size: 16px; line-height: 1; }
.chip .chip-sub { color: var(--text-2); font-weight: 500; }
.chip.on .chip-sub { color: rgba(255, 255, 255, .8); }
.filterbar { margin: 2px 0 10px; }
.filterbar:empty { display: none; }

.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 2px; padding: 3px; border-radius: 13px; background: var(--seg-track); }
.seg button { height: 34px; border-radius: 10px; font-size: 14px; font-weight: 600; color: var(--text-2); text-align: center; transition: background .2s, color .2s; }
.seg button.on { background: var(--seg-on); color: var(--text); box-shadow: 0 1px 3px rgba(0, 0, 0, .08); }

.progress { height: 8px; border-radius: 4px; background: var(--surface-2); overflow: hidden; }
.progress > i { display: block; height: 100%; border-radius: 4px; background: var(--ok); transition: width .6s var(--ease), background-color .3s; }
.progress.warn > i { background: var(--warn); }
.progress.over > i { background: var(--bad); }
.warn-text { color: var(--warn); }
.bad-text { color: var(--bad); }
.ok-text { color: var(--ok); }

.spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .7s linear infinite; vertical-align: -2px; }

/* =====================================================================
   5. Главная: карточка месяца, баннеры, список покупок
   ===================================================================== */
.hero {
  position: relative; overflow: hidden; border-radius: 26px; padding: 20px 20px 18px; color: #fff;
  background: radial-gradient(120% 140% at 100% 0%, #9A6BFF 0%, #5B4DFF 48%, #3A2ED6 100%);
  box-shadow: 0 16px 34px rgba(76, 61, 240, .32);
  cursor: pointer;
}
[data-theme="dark"] .hero { background: radial-gradient(120% 140% at 100% 0%, #7E58F0 0%, #4C3EE6 50%, #2A1FA8 100%); box-shadow: none; }
.hero::before, .hero::after { content: ""; position: absolute; border-radius: 50%; pointer-events: none; }
.hero::before { width: 220px; height: 220px; right: -70px; bottom: -120px; background: rgba(255, 255, 255, .09); }
.hero::after { width: 120px; height: 120px; right: 40px; top: -60px; background: rgba(255, 255, 255, .07); }
.hero > * { position: relative; z-index: 1; }
.hero-label { font-size: 14px; font-weight: 600; opacity: .85; }
.hero-amount { font-size: clamp(32px, 10vw, 44px); font-weight: 800; letter-spacing: -.035em; margin: 4px 0 6px; font-variant-numeric: tabular-nums; line-height: 1.05; }
.hero-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 14px; }
.hero-pill { display: inline-flex; align-items: center; gap: 4px; padding: 4px 9px; border-radius: 9px; background: rgba(255, 255, 255, .17); font-weight: 650; font-size: 13px; }
.hero-budget { margin-top: 16px; }
.hero-budget .progress { background: rgba(255, 255, 255, .22); height: 7px; }
.hero-budget .progress > i { background: #fff; }
.hero-budget .progress.warn > i { background: #FFD166; }
.hero-budget .progress.over > i { background: #FF7A8A; }
.hero-budget-text { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; opacity: .9; margin-top: 7px; }
.hero-link { margin-top: 14px; font-size: 14px; font-weight: 650; opacity: .9; display: inline-flex; align-items: center; gap: 4px; }

.banner { display: flex; gap: 12px; align-items: flex-start; padding: 14px; border-radius: 18px; background: var(--surface); box-shadow: var(--shadow); border: 1px solid var(--card-border); margin-top: 12px; animation: viewIn .3s var(--ease); }
.banner .ico { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; font-size: 20px; flex: none; background: var(--accent-soft); }
.banner .txt { flex: 1; min-width: 0; font-size: 14px; color: var(--text-2); }
.banner .txt b { display: block; color: var(--text); font-size: 15px; margin-bottom: 2px; }
.banner .acts { display: flex; gap: 14px; margin-top: 8px; }

.search-row { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
.search { position: relative; flex: 1; display: block; }
.search svg.i { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); width: 19px; height: 19px; color: var(--text-3); pointer-events: none; }
.search input {
  width: 100%; height: 44px; border-radius: 14px; border: 1px solid var(--card-border); outline: none;
  background: var(--surface); box-shadow: var(--shadow-sm); padding: 0 12px 0 40px; -webkit-appearance: none; appearance: none;
}
.search input:focus { box-shadow: 0 0 0 2px var(--accent); }
.sheet .search input { background: var(--surface-2); box-shadow: none; }

.day-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 13px; font-weight: 650; color: var(--text-2); padding: 14px 6px 7px; }
.day-head:first-child { padding-top: 2px; }
.tx-list { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); border: 1px solid var(--card-border); overflow: hidden; }
.sheet .tx-list { box-shadow: none; border: 0; background: var(--surface-2); }
.tx { position: relative; display: flex; align-items: center; gap: 12px; width: 100%; padding: 11px 14px; text-align: left; transition: background .15s; }
.tx + .tx::before { content: ""; position: absolute; left: 68px; right: 0; top: 0; height: 1px; background: var(--border); }
.tx:active { background: var(--surface-2); }
.sheet .tx:active { background: var(--surface-3); }
.tx.flash { animation: flash 1.4s var(--ease); }
.tx-icon { width: 42px; height: 42px; flex: none; border-radius: 14px; display: grid; place-items: center; font-size: 21px; line-height: 1; }
.tx-icon.sm { width: 34px; height: 34px; border-radius: 11px; font-size: 17px; }
.tx-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.tx-title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tx-sub { font-size: 13px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tx-amt { display: flex; flex-direction: column; align-items: flex-end; gap: 1px; font-variant-numeric: tabular-nums; flex: none; max-width: 46%; }
.tx-base { font-weight: 680; white-space: nowrap; }
.tx-orig { font-size: 12.5px; color: var(--text-2); white-space: nowrap; }
.tag { color: var(--accent-text); }
.more-btn { margin: 12px auto 0; display: block; }
.list-summary { font-size: 13px; color: var(--text-2); margin: -2px 6px 8px; }

.empty { text-align: center; padding: 36px 20px; color: var(--text-2); }
.empty .em { font-size: 46px; margin-bottom: 10px; }
.empty b { display: block; color: var(--text); font-size: 17px; margin-bottom: 4px; }

/* =====================================================================
   6. Аналитика
   ===================================================================== */
.period-nav { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 12px 0; }
.period-nav .label { font-size: 17px; font-weight: 750; letter-spacing: -.015em; text-align: center; flex: 1; }
.custom-range { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center; margin-bottom: 12px; }
.custom-range .input { height: 44px; background: var(--surface); box-shadow: var(--shadow-sm); }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
.stat { background: var(--surface); border-radius: 18px; padding: 14px 15px; box-shadow: var(--shadow); border: 1px solid var(--card-border); min-width: 0; }
.stat.wide { grid-column: 1 / -1; }
.stat-label { font-size: 13px; font-weight: 600; color: var(--text-2); }
.stat-value { font-size: 22px; font-weight: 800; letter-spacing: -.025em; margin-top: 4px; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stat.wide .stat-value { font-size: 34px; }
.stat-foot { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 6px; font-size: 13px; color: var(--text-2); }
.delta { display: inline-flex; align-items: center; gap: 3px; padding: 3px 8px; border-radius: 8px; font-size: 13px; font-weight: 700; }
.delta.up { color: var(--bad); background: rgba(240, 68, 90, .12); }
.delta.down { color: var(--ok); background: rgba(18, 184, 134, .12); }
.delta.flat { color: var(--text-2); background: var(--surface-2); }
.donut-wrap { position: relative; height: 230px; margin: 8px 0 6px; }
.donut-center { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; pointer-events: none; }
.donut-center b { font-size: 22px; font-weight: 800; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.donut-center span { font-size: 13px; color: var(--text-2); }
.chart-box { position: relative; height: 210px; margin-top: 8px; }
.chart-off { display: grid; place-items: center; height: 100%; color: var(--text-2); font-size: 14px; text-align: center; padding: 0 20px; background: var(--surface-2); border-radius: 14px; }
.legend-row { display: flex; align-items: center; gap: 12px; width: 100%; padding: 10px 2px; text-align: left; }
.legend-row + .legend-row { border-top: 1px solid var(--border); }
.lg-main { flex: 1; min-width: 0; }
.lg-name { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mini-bar { display: block; height: 4px; border-radius: 2px; background: var(--surface-2); margin-top: 6px; overflow: hidden; }
.mini-bar i { display: block; height: 100%; border-radius: 2px; }
.lg-amt { text-align: right; font-variant-numeric: tabular-nums; flex: none; min-width: 92px; }
.lg-amt b { display: block; font-weight: 700; }
.lg-amt small { color: var(--text-2); font-size: 12.5px; }
.cur-row { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 12px; align-items: center; padding: 10px 2px; }
.cur-row + .cur-row { border-top: 1px solid var(--border); }
.cur-flag { font-size: 24px; width: 34px; text-align: center; }
.cur-row .r { text-align: right; font-variant-numeric: tabular-nums; }
.cur-row small { color: var(--text-2); font-size: 12.5px; display: block; }
.rate-row { padding: 12px 0; }
.rate-row + .rate-row { border-top: 1px solid var(--border); }
.rr-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.rr-head .muted { margin-left: auto; font-size: 13px; }
.rr-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.rr-grid > div { background: var(--surface-2); border-radius: 12px; padding: 9px 11px; font-variant-numeric: tabular-nums; }
.rr-grid small { display: block; font-size: 12px; color: var(--text-2); margin-bottom: 2px; }
.rr-note { font-size: 13.5px; color: var(--text-2); margin-top: 8px; }

/* =====================================================================
   7. Бюджеты и настройки
   ===================================================================== */
.budget-row { display: flex; gap: 12px; align-items: center; width: 100%; padding: 12px 14px; text-align: left; position: relative; }
.budget-row + .budget-row::before { content: ""; position: absolute; left: 68px; right: 0; top: 0; height: 1px; background: var(--border); }
.budget-row:active { background: var(--surface-2); }
.br-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.br-top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.br-name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.br-val { font-variant-numeric: tabular-nums; font-weight: 650; white-space: nowrap; font-size: 15px; }
.br-sub { font-size: 12.5px; color: var(--text-2); }
.br-sub.warn { color: var(--warn); } .br-sub.over { color: var(--bad); }
.budget-total .big { font-size: 30px; font-weight: 800; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.budget-total .progress { height: 10px; border-radius: 5px; margin: 12px 0 8px; }
.budget-total .meta { display: flex; justify-content: space-between; gap: 10px; font-size: 13.5px; color: var(--text-2); flex-wrap: wrap; }
.hint { font-size: 13px; color: var(--text-2); margin: 10px 6px; }

.group-title { font-size: 13px; font-weight: 650; color: var(--text-2); margin: 24px 8px 8px; text-transform: uppercase; letter-spacing: .05em; }
.list { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); border: 1px solid var(--card-border); overflow: hidden; }
.sheet .list { background: var(--surface-2); box-shadow: none; border: 0; }
.row { position: relative; display: flex; align-items: center; gap: 12px; width: 100%; min-height: 54px; padding: 10px 14px; text-align: left; }
.row + .row::before { content: ""; position: absolute; left: 56px; right: 0; top: 0; height: 1px; background: var(--border); }
button.row:active { background: var(--surface-2); }
.sheet button.row:active { background: var(--surface-3); }
.row .ri { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; font-size: 16px; flex: none; background: var(--surface-2); }
.sheet .row .ri { background: var(--surface); }
.row .rl { flex: 1; min-width: 0; font-weight: 550; }
.row .rl small { display: block; font-weight: 400; color: var(--text-2); font-size: 13px; }
.row .rv { color: var(--text-2); font-size: 15px; text-align: right; max-width: 55%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .chev { color: var(--text-3); width: 18px; height: 18px; }
.row.danger .rl { color: var(--bad); }
.row .seg { min-width: 210px; }
.about { text-align: center; color: var(--text-3); font-size: 13px; margin: 26px 0 6px; }

/* =====================================================================
   8. Нижние листы (bottom sheets), форма покупки, тосты
   ===================================================================== */
.overlay { position: fixed; inset: 0; background: rgba(8, 10, 22, .45); opacity: 0; transition: opacity .3s; z-index: 50; }
.overlay.show { opacity: 1; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: var(--kb); margin: 0 auto; max-width: 560px; z-index: 51;
  max-height: calc(var(--vvh, 100vh) - var(--sat) - 14px);
  display: flex; flex-direction: column;
  background: var(--surface); border-radius: 26px 26px 0 0; box-shadow: var(--shadow-lg);
  transform: translateY(105%); transition: transform .34s var(--ease), bottom .2s;
  padding-left: var(--sal); padding-right: var(--sar);
}
.sheet.show { transform: none; }
.sheet-handle { width: 38px; height: 5px; border-radius: 3px; background: var(--surface-3); margin: 8px auto 0; flex: none; }
.sheet-head { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; padding: 6px 16px 8px; flex: none; touch-action: none; }
.sheet-head h2 { font-size: 17px; font-weight: 700; margin: 0; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 62vw; }
.sheet-head > :first-child { justify-self: start; }
.sheet-head > :last-child { justify-self: end; }
.sheet-body { flex: 1 1 auto; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; padding: 4px 16px calc(18px + var(--sab)); }
.sheet.has-foot .sheet-body { padding-bottom: 10px; }
.sheet-foot { flex: none; padding: 10px 16px calc(12px + var(--sab)); border-top: 1px solid var(--border); background: var(--surface); }
.kb-open .sheet-foot { padding-bottom: 10px; }
.sheet-text { color: var(--text-2); margin: 4px 2px 16px; font-size: 15px; }

.amount-wrap { display: flex; align-items: center; gap: 10px; padding: 2px 0; }
.amount-input { flex: 1; min-width: 0; border: 0; outline: none; background: transparent; padding: 0; font-size: 46px; font-weight: 800; letter-spacing: -.035em; font-variant-numeric: tabular-nums; caret-color: var(--accent); }
.amount-input::placeholder { color: var(--text-3); }
.amount-cur { font-size: 30px; font-weight: 750; color: var(--text-2); }
.amount-wrap.shake, .cat-grid.shake, .rate-edit.shake { animation: shake .4s; }
.cur-chips { margin-top: 4px; }
.rate-line { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; font-size: 14px; color: var(--text-2); margin-top: 8px; min-height: 22px; font-variant-numeric: tabular-nums; }
.rate-line b { color: var(--text); }
.badge-src { display: inline-flex; padding: 2px 7px; border-radius: 7px; background: var(--surface-2); font-size: 12px; font-weight: 600; color: var(--text-2); }
.badge-src.manual { background: var(--accent-soft); color: var(--accent-text); }
.badge-src.pending { background: rgba(242, 165, 22, .14); color: var(--warn); }
.rate-edit { display: flex; align-items: center; gap: 8px; margin-top: 10px; padding: 10px; border-radius: 16px; background: var(--surface-2); }
.rate-edit .input { height: 42px; background: var(--surface); flex: 1; min-width: 0; }
.rate-edit span { font-weight: 650; white-space: nowrap; }
.cat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.cat-tile { display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 9px 3px 8px; border-radius: 18px; background: var(--surface-2); border: 2px solid transparent; text-align: center; transition: transform .15s var(--ease), border-color .15s, background .15s; }
.cat-tile:active { transform: scale(.95); }
.cat-tile .em { width: 42px; height: 42px; border-radius: 14px; display: grid; place-items: center; font-size: 23px; line-height: 1; }
.cat-tile .nm { font-size: 11.5px; font-weight: 600; line-height: 1.15; max-width: 100%; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; -webkit-hyphens: auto; hyphens: auto; overflow-wrap: break-word; }
.cat-tile.on { border-color: var(--c); background: var(--cs); }
/* Чип даты: видимая подпись + прозрачный нативный input поверх (на iPhone открывает системный выбор даты) */
.date-chip { position: relative; overflow: hidden; gap: 6px; cursor: pointer; }
.date-chip input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; padding: 0; border: 0; opacity: 0; font-size: 16px; cursor: pointer; -webkit-appearance: none; appearance: none; }
.date-chip input::-webkit-calendar-picker-indicator { position: absolute; inset: 0; width: auto; height: auto; cursor: pointer; }
.date-chip svg.i { width: 17px; height: 17px; }
.tag-sugg { margin-top: 8px; }
.tag-sugg:empty { display: none; }

.cat-preview { display: flex; justify-content: center; margin: 4px 0 2px; }
.cat-preview .em { width: 76px; height: 76px; border-radius: 24px; display: grid; place-items: center; font-size: 40px; transition: background .2s; }
.emoji-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin-top: 10px; }
.emoji-grid button { height: 44px; border-radius: 12px; background: var(--surface-2); font-size: 22px; text-align: center; }
.emoji-grid button.on { box-shadow: 0 0 0 2px var(--accent) inset; }
.swatches { display: flex; flex-wrap: wrap; gap: 10px; }
.swatch { width: 34px; height: 34px; border-radius: 50%; position: relative; box-shadow: 0 0 0 1px var(--border) inset; }
.swatch.on::after { content: ""; position: absolute; inset: -4px; border-radius: 50%; border: 2.5px solid var(--text); }
.swatch.custom { background: conic-gradient(#ef4444, #eab308, #22c55e, #06b6d4, #3b82f6, #a855f7, #ef4444); overflow: hidden; }
.swatch.custom input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; border: 0; padding: 0; }

.steps { list-style: none; padding: 0; margin: 4px 0 16px; display: grid; gap: 12px; }
.steps li { display: flex; gap: 12px; align-items: flex-start; font-size: 15px; }
.steps .n { width: 28px; height: 28px; border-radius: 50%; background: var(--accent-soft); color: var(--accent-text); display: grid; place-items: center; font-weight: 750; font-size: 14px; flex: none; }
.ios-ico { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 7px; background: var(--surface-2); vertical-align: -7px; color: #0A84FF; }
.ios-ico svg.i { width: 17px; height: 17px; }
.note { padding: 12px 14px; border-radius: 14px; background: rgba(242, 165, 22, .12); font-size: 14px; color: var(--text); margin-bottom: 14px; }
.install-hero { display: flex; justify-content: center; margin: 4px 0 10px; }
.ins-title { text-align: center; font-size: 22px; font-weight: 750; margin: 0 0 10px; }
.ins-feats { list-style: none; padding: 0; margin: 0 0 18px; display: grid; gap: 8px; font-size: 15px; color: var(--text-2); }
.install-hero img { width: 72px; height: 72px; border-radius: 18px; box-shadow: var(--shadow); }

.toast-root { position: fixed; left: 0; right: 0; bottom: calc(var(--tabbar-h) + var(--sab) + 22px); z-index: 200; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 0 16px; pointer-events: none; }
.sheet-open .toast-root { bottom: calc(var(--kb) + 96px + var(--sab)); }
.toast { pointer-events: auto; width: 100%; max-width: 528px; display: flex; align-items: center; gap: 10px; padding: 12px 10px 12px 16px; border-radius: 16px; background: #1B1D27; color: #fff; font-size: 15px; box-shadow: 0 12px 30px rgba(0, 0, 0, .28); opacity: 0; transform: translateY(16px) scale(.98); transition: opacity .25s, transform .3s var(--ease); }
[data-theme="dark"] .toast { background: #2B2F3C; }
.toast.show { opacity: 1; transform: none; }
.toast span { flex: 1; }
.toast button { color: #B5A9FF; font-weight: 700; padding: 6px 8px; white-space: nowrap; }
.busy { position: fixed; inset: 0; z-index: 300; display: grid; place-items: center; background: rgba(8, 10, 22, .35); }
.busy > div { display: flex; gap: 10px; align-items: center; padding: 14px 18px; border-radius: 16px; background: var(--surface); box-shadow: var(--shadow); font-weight: 600; }

/* Входящие: траты из Apple Pay и SMS */
.ib-item { padding: 14px; border-radius: 18px; background: var(--surface-2); margin-bottom: 12px; }
.ib-meta { font-size: 13px; color: var(--text-2); }
.ib-main { display: flex; align-items: baseline; gap: 12px; margin-top: 4px; }
.ib-title { flex: 1; min-width: 0; font-weight: 650; font-size: 17px; overflow-wrap: anywhere; }
.ib-amt { font-weight: 750; font-size: 18px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.ib-text { margin-top: 6px; font-size: 13px; color: var(--text-2); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
.ib-dup { margin-top: 8px; font-size: 13.5px; color: var(--warn); }
.ib-item .chips.scroll { margin: 10px -14px 0; padding: 2px 14px 6px; }
.ib-item .btn-row { margin-top: 10px; }
.is-status { min-height: 22px; margin: 10px 2px 0; font-size: 14.5px; color: var(--text-2); }
.row.is-auto-row .seg { flex: 0 0 116px; min-width: 0; }
details.adv { margin-top: 24px; padding: 12px 14px; border-radius: 16px; background: var(--surface-2); }
details.adv summary { font-weight: 650; cursor: pointer; color: var(--text-2); }
details.adv[open] summary { margin-bottom: 10px; }
.steps code { font-size: 13px; padding: 1px 6px; border-radius: 6px; background: var(--surface-2); }


/* =====================================================================
   Доходы, планы (цели и долги), ввод фразой, итоги месяца
   ===================================================================== */
.kind-seg { margin: 0 0 14px; }
.sheet-form.income .amount-input, .sheet-form.income .amount-cur { color: var(--ok); }
.sheet-form .amount-input { transition: color .25s; }
.receipt-chip { gap: 6px; }
.receipt-field { margin-top: 12px; }
.ai-note { display: block; margin-top: 8px; font-size: 13px; color: var(--accent-text); animation: rowIn2 .3s var(--ease); }
.phrase.thinking .ph-ico { animation: spin 1s linear infinite; display: inline-block; }
@keyframes rowIn2 { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
.receipt-chip .soon { font-size: 11px; font-weight: 700; padding: 2px 6px; border-radius: 6px; background: var(--accent-soft); color: var(--accent-text); }
.hero-inc { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-top: 12px; padding-top: 11px; border-top: 1px solid rgba(255, 255, 255, .18); font-size: 13.5px; }
.hero-inc span { opacity: .9; } .hero-inc b { font-weight: 750; opacity: 1; }

/* строка «ввод фразой» */
.phrase { position: relative; display: flex; align-items: center; gap: 8px; margin-top: 14px; padding: 5px 5px 5px 14px; border-radius: 18px; background: var(--surface); box-shadow: var(--shadow-sm); border: 1px solid var(--card-border); transition: box-shadow .2s; }
.phrase:focus-within { box-shadow: 0 0 0 2px var(--accent), var(--shadow); }
.phrase.shake { animation: shake .4s; }
.ph-ico { font-size: 17px; flex: none; }
.phrase input { flex: 1; min-width: 0; height: 40px; border: 0; outline: none; background: transparent; }
.phrase input::placeholder { color: var(--text-3); }
.ph-go { width: 38px; height: 38px; border-radius: 13px; flex: none; display: grid; place-items: center; color: #fff; background: linear-gradient(140deg, var(--accent-2), var(--accent)); animation: popIn .22s var(--ease); }
.ph-go svg.i { width: 20px; height: 20px; stroke-width: 2.4; }
.ph-go:active { transform: scale(.9); }
.ph-preview { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .25s var(--ease); }
.ph-preview.show { grid-template-rows: 1fr; }
.ph-preview > * { overflow: hidden; }
.ph-card { display: flex; align-items: center; gap: 12px; width: 100%; margin-top: 8px; padding: 10px 12px; border-radius: 16px; background: var(--accent-soft); text-align: left; animation: viewIn .22s var(--ease); }
.ph-card.income { background: rgba(18, 184, 134, .12); }
.ph-card:active { transform: scale(.99); }

/* вкладка «Планы» */
.pl-seg { margin-bottom: 14px; }
.swap-in { animation: viewIn .28s var(--ease); }
.plan-summary .big { font-size: 30px; font-weight: 800; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.plan-summary .progress { height: 10px; border-radius: 5px; margin: 12px 0 8px; }
.plan-summary .meta { display: flex; justify-content: space-between; gap: 10px; font-size: 13.5px; color: var(--text-2); flex-wrap: wrap; }
.plan-empty { padding: 32px 22px 24px; }
.plan-empty .btn { width: auto; padding: 0 26px; margin-left: auto; margin-right: auto; }
.em.float { display: inline-block; animation: floaty 3s ease-in-out infinite; }
.add-dashed { margin-top: 12px; background: transparent; border: 1.5px dashed var(--surface-3); color: var(--text-2); height: 50px; }
.stagger > * { animation: viewIn .38s var(--ease) both; animation-delay: calc(var(--i, 0) * 45ms); }
.goal-card { position: relative; background: var(--surface); border-radius: var(--radius); padding: 14px 16px; box-shadow: var(--shadow); border: 1px solid var(--card-border); margin-bottom: 10px; cursor: pointer; transition: transform .15s var(--ease); }
.goal-card:active { transform: scale(.985); }
.goal-card.done { background: linear-gradient(135deg, rgba(18, 184, 134, .10), var(--surface) 60%); }
.goal-top { display: flex; align-items: center; gap: 12px; }
.goal-em { width: 46px; height: 46px; border-radius: 15px; display: grid; place-items: center; font-size: 24px; flex: none; }
.goal-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.goal-main b { font-size: 16.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.goal-main small { font-size: 13px; color: var(--text-2); }
.ring-wrap { position: relative; width: 56px; height: 56px; flex: none; }
.ring { transform: rotate(-90deg); display: block; }
.ring circle { fill: none; stroke-width: 6; }
.ring-bg { stroke: var(--surface-2); }
.ring-fg { stroke-linecap: round; animation: ringIn 1s var(--ease) both; transition: stroke-dashoffset .6s var(--ease); }
.ring-pct { position: absolute; inset: 0; display: grid; place-items: center; font-size: 13px; font-weight: 750; font-variant-numeric: tabular-nums; }
.goal-bottom { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 12px; }
.goal-amt { font-variant-numeric: tabular-nums; } .goal-amt b { font-size: 17px; font-weight: 750; }
.goal-add { background: var(--accent-soft); color: var(--accent-text); border-color: transparent; box-shadow: none; }
.debt-sum { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
.ds { border-radius: 18px; padding: 14px 15px; background: var(--surface); box-shadow: var(--shadow); border: 1px solid var(--card-border); }
.ds span { font-size: 13px; font-weight: 600; color: var(--text-2); }
.ds b { display: block; margin-top: 4px; font-size: 21px; font-weight: 800; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.ds.in b { color: var(--ok); } .ds.out b { color: var(--bad); }
.debt-row { position: relative; display: flex; align-items: center; gap: 12px; width: 100%; padding: 11px 14px; text-align: left; transition: background .15s; }
.debt-row + .debt-row::before { content: ""; position: absolute; left: 68px; right: 0; top: 0; height: 1px; background: var(--border); }
.debt-row:active { background: var(--surface-2); }
.debt-row.closed { opacity: .6; }
.avatar { width: 42px; height: 42px; border-radius: 50%; flex: none; display: grid; place-items: center; font-size: 17px; font-weight: 750; }
.closed-debts { margin-top: 16px; }
.closed-debts summary { font-size: 14px; font-weight: 650; color: var(--text-2); padding: 8px 6px; cursor: pointer; }
.closed-debts .tx-list { margin-top: 6px; }
.debt-hero { text-align: center; padding: 8px 6px 18px; }
.debt-hero .avatar { width: 64px; height: 64px; font-size: 26px; margin: 0 auto 10px; }
.dh-label { font-size: 15px; color: var(--text-2); font-weight: 600; }
.dh-amt { font-size: 40px; font-weight: 800; letter-spacing: -.035em; margin: 2px 0; font-variant-numeric: tabular-nums; }
.debt-hero.in .dh-amt { color: var(--ok); } .debt-hero.out .dh-amt { color: var(--bad); }
.dh-sub { font-size: 13.5px; color: var(--text-2); }
.partial { display: flex; gap: 8px; margin-top: 10px; }
.partial .btn { width: auto; padding: 0 16px; height: 50px; flex: none; }
.partial.shake { animation: shake .4s; }

/* аналитика: доходы и итоги */
.inc-bars { display: grid; gap: 12px; margin-top: 10px; }
.inc-bars > div { display: grid; grid-template-columns: 1fr auto; gap: 6px 10px; align-items: baseline; font-size: 14px; color: var(--text-2); }
.inc-bars b { font-variant-numeric: tabular-nums; color: var(--text); }
.inc-bars i { grid-column: 1 / -1; display: block; height: 8px; border-radius: 4px; transform-origin: left; animation: growX .8s var(--ease) both; }
.inc-foot { margin-top: 12px; font-size: 14px; color: var(--text-2); }
.sum-cta { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; background: linear-gradient(135deg, var(--accent-soft), var(--surface) 70%); }
.sum-cta .tx-main b { font-size: 16px; }
.sum-cta svg.i { color: var(--text-3); width: 18px; height: 18px; }
.sum-cta-ico { font-size: 26px; width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; background: var(--surface); flex: none; }
.sum-hero { border-radius: 24px; padding: 20px; color: #fff; text-align: center; background: radial-gradient(120% 140% at 100% 0%, #9A6BFF 0%, #5B4DFF 48%, #3A2ED6 100%); animation: popIn .35s var(--ease); }
.sum-label { font-size: 14px; font-weight: 600; opacity: .85; }
.sum-amount { font-size: 42px; font-weight: 800; letter-spacing: -.035em; font-variant-numeric: tabular-nums; margin: 2px 0 6px; }
.sum-pill { display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: 9px; background: rgba(255, 255, 255, .17); font-size: 13px; font-weight: 650; }
.sum-inc { display: flex; justify-content: center; gap: 18px; flex-wrap: wrap; margin-top: 12px; font-size: 13.5px; opacity: .95; }
.sum-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
.sum-tile { border-radius: 16px; padding: 12px 14px; background: var(--surface-2); }
.sum-tile span { display: block; font-size: 20px; font-weight: 800; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.sum-tile small { font-size: 12.5px; color: var(--text-2); }
.sum-cat { display: flex; align-items: center; gap: 12px; padding: 8px 2px; }
.sum-cat .mini-bar i { transform-origin: left; animation: growX .8s var(--ease) both; animation-delay: calc(var(--i, 0) * 60ms + 120ms); }

/* фото чека (заготовка) */
.receipt-prev { position: relative; border-radius: 18px; overflow: hidden; max-height: 46vh; background: var(--surface-2); display: grid; place-items: center; }
.receipt-prev img { max-width: 100%; max-height: 46vh; display: block; }
.scan-line { position: absolute; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, transparent, var(--accent), transparent); box-shadow: 0 0 18px var(--accent); animation: scan 2.2s ease-in-out infinite; }

/* общие анимации прогресса и салют */
.progress > i { transform-origin: left; animation: growX .9s var(--ease) both; }
.confetti { position: fixed; inset: 0; pointer-events: none; z-index: 500; overflow: hidden; }
.confetti i { position: absolute; display: block; }


/* облачная копия и уведомления */
.cloud-hero { position: relative; width: 92px; height: 92px; margin: 6px auto 12px; border-radius: 30px; display: grid; place-items: center; background: var(--accent-soft); animation: popIn .35s var(--ease); }
.cloud-ico { font-size: 46px; }
.cloud-ico.bell { animation: ring 2.4s ease-in-out 1; transform-origin: 50% 10%; }
.cloud-hero.ok { background: rgba(18, 184, 134, .14); }
.cloud-check { position: absolute; right: -4px; bottom: -4px; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--ok); color: #fff; font-weight: 800; font-size: 16px; box-shadow: 0 0 0 4px var(--surface); animation: popIn .4s var(--ease) .15s both; }
.bk-code { font: 600 15px/1.5 ui-monospace, "SF Mono", Menlo, monospace; letter-spacing: .04em; word-break: break-all; }
.bk-code.big { display: block; padding: 16px; border-radius: 16px; background: var(--surface-2); font-size: 19px; text-align: center; user-select: all; -webkit-user-select: all; }
.bk-code .cg { white-space: nowrap; }
.code-row { gap: 10px; }
.code-row .bk-code { flex: 1; min-width: 0; }
.code-input { font-family: ui-monospace, "SF Mono", Menlo, monospace; letter-spacing: .03em; text-transform: uppercase; }
.check-row { display: flex; align-items: center; gap: 10px; margin-top: 16px; font-size: 15px; cursor: pointer; }
.check-row input { width: 22px; height: 22px; accent-color: var(--accent); flex: none; }
.nt-row .seg { flex: 0 0 116px; min-width: 0; }
.nt-opt { padding: 0 14px 12px 56px; }
.nt-opt .seg button { font-size: 13.5px; }
@keyframes ring { 0%, 100% { transform: rotate(0); } 10%, 30% { transform: rotate(14deg); } 20%, 40% { transform: rotate(-12deg); } 50% { transform: rotate(0); } }


/* =====================================================================
   Анимации 1.7: переходы, «бегунки», галочка «+», схлопывание, детали
   ===================================================================== */
/* нижняя панель: значок подпрыгивает, под активной вкладкой — точка */
.tab { position: relative; }
.tab.active svg.i { animation: tabPop .42s var(--ease); }
.tab::after { content: ""; position: absolute; bottom: 0; left: 50%; width: 4px; height: 4px; margin-left: -2px; border-radius: 2px; background: var(--accent); transform: scale(0); transition: transform .3s var(--ease); }
.tab.active::after { transform: scale(1); }

/* «+»: поворот, пока открыта форма; зелёная галочка после добавления */
.fab { position: relative; overflow: hidden; transition: transform .2s var(--ease), background .3s, box-shadow .3s; }
.fab svg.i { transition: transform .35s var(--ease), opacity .2s; }
.sheet-open .fab .fab-plus { transform: rotate(45deg); }
.fab .fab-check { position: absolute; inset: 0; margin: auto; opacity: 0; stroke-width: 3; }
.fab .fab-check path { stroke-dasharray: 24; stroke-dashoffset: 24; }
.fab.done { background: linear-gradient(140deg, #3DDC97, var(--ok)); box-shadow: 0 10px 24px rgba(18, 184, 134, .45), 0 0 0 5px var(--bg); animation: fabPulse .5s var(--ease); }
.fab.done .fab-plus { opacity: 0; transform: rotate(90deg) scale(.4); }
.fab.done .fab-check { opacity: 1; }
.fab.done .fab-check path { animation: draw .4s ease .08s forwards; }

/* скользящий бегунок переключателей */
.seg.has-thumb { position: relative; }
.seg.has-thumb > button { position: relative; z-index: 1; }
.seg.has-thumb > button.on { background: transparent; box-shadow: none; }
.seg-thumb { position: absolute; left: 0; top: 0; border-radius: 10px; background: var(--seg-on); box-shadow: 0 1px 3px rgba(0, 0, 0, .1); transition: transform .32s var(--ease), width .32s var(--ease); pointer-events: none; }

/* тосты: пружинка и полоска оставшегося времени у «Отменить» */
.toast { position: relative; overflow: hidden; transition: opacity .25s, transform .45s cubic-bezier(.2, 1.35, .4, 1); }
.toast.timed::after { content: ""; position: absolute; left: 16px; right: 16px; bottom: 5px; height: 2px; border-radius: 1px; background: rgba(255, 255, 255, .3); transform-origin: left; animation: drain var(--dur, 5s) linear forwards; }

/* новая запись: въезжает и подсвечивается */
.tx.flash { animation: txNew .5s var(--ease), flash 1.4s var(--ease); }

/* главная карточка: круги медленно плавают, нажатие — лёгкое «вдавливание» */
.hero { transition: transform .2s var(--ease); }
.hero:active { transform: scale(.985); }
.hero::before { animation: driftA 14s ease-in-out infinite alternate; }
.hero::after { animation: driftB 11s ease-in-out infinite alternate; }

/* выбор категории: значок подпрыгивает */
.cat-tile.on .em { animation: pop .4s var(--ease); }
.chip.on .x { display: inline-block; animation: pop .3s var(--ease); }

/* листы стопкой: нижний слегка отъезжает назад */
.sheet.show.behind { transform: translateY(-8px) scale(.95); transform-origin: 50% 0; }

/* подсказка в строке ввода фразой: примеры сменяют друг друга */
.ph-field { position: relative; flex: 1; min-width: 0; display: flex; }
.ph-hint { position: absolute; inset: 0; display: flex; align-items: center; gap: 5px; color: var(--text-3); pointer-events: none; white-space: nowrap; overflow: hidden; transition: opacity .15s; }
.ph-hint b { font-weight: 500; color: var(--text-2); display: inline-block; }
.phrase input:not(:placeholder-shown) ~ .ph-hint { opacity: 0; }
.phrase:focus-within .ph-ico { animation: pop .45s var(--ease); }

/* нижняя панель выезжает при запуске */
.tabbar { animation: barUp .55s var(--ease) both; }

/* пустые экраны: значок «дышит» */
.empty .em { display: inline-block; animation: floaty 3.2s ease-in-out infinite; }

/* смена темы — плавное перетекание (View Transitions) */
::view-transition-old(root), ::view-transition-new(root) { animation-duration: .35s; }

@keyframes barUp { from { transform: translateY(100%); } to { transform: none; } }
@keyframes tabPop { 0% { transform: scale(1); } 40% { transform: scale(1.18) translateY(-2px); } 100% { transform: scale(1); } }
@keyframes fabPulse { 0% { transform: scale(1); } 35% { transform: scale(1.12); } 100% { transform: scale(1); } }
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes drain { from { transform: scaleX(1); } to { transform: scaleX(0); } }
@keyframes txNew { from { opacity: 0; transform: translateY(-10px) scale(.98); } to { opacity: 1; transform: none; } }
@keyframes driftA { from { transform: translate(0, 0); } to { transform: translate(-26px, -18px); } }
@keyframes driftB { from { transform: translate(0, 0); } to { transform: translate(-30px, 14px); } }
@keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.2); } 100% { transform: scale(1); } }

/* =====================================================================
   9. Анимации и адаптив
   ===================================================================== */
@keyframes viewIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes flash { 0% { background: var(--accent-soft); } 100% { background: transparent; } }
@keyframes growX { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@keyframes ringIn { from { stroke-dashoffset: var(--c0); } }
@keyframes popIn { from { opacity: 0; transform: scale(.92); } to { opacity: 1; transform: none; } }
@keyframes floaty { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
@keyframes scan { 0% { top: 4%; } 50% { top: 92%; } 100% { top: 4%; } }
@keyframes shake { 10%, 90% { transform: translateX(-1px); } 20%, 80% { transform: translateX(2px); } 30%, 50%, 70% { transform: translateX(-5px); } 40%, 60% { transform: translateX(5px); } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}
@media (max-width: 400px) {

  .sheet { bottom: max(var(--kb), 24px); border-radius: 26px; }
}

/* --- Даты (всегда локальные строки YYYY-MM-DD, без UTC-сдвигов) --- */
const pad = (n) => String(n).padStart(2, '0');
const toISO = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const todayISO = () => toISO(new Date());
const parseISO = (s) => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (iso, n) => { const d = parseISO(iso); d.setDate(d.getDate() + n); return toISO(d); };
const addMonths = (iso, n) => { const d = parseISO(iso); return toISO(new Date(d.getFullYear(), d.getMonth() + n, 1)); };
const monthStart = (iso) => iso.slice(0, 8) + '01';
const monthEnd = (iso) => { const d = parseISO(iso); return toISO(new Date(d.getFullYear(), d.getMonth() + 1, 0)); };
const daysBetween = (a, b) => Math.round((parseISO(b) - parseISO(a)) / DAY_MS);
const minISO = (a, b) => (a < b ? a : b);
const maxISO = (a, b) => (a > b ? a : b);

function fmtDay(iso, withYear = false) {
  const d = parseISO(iso);
  const y = withYear || d.getFullYear() !== new Date().getFullYear() ? ` ${d.getFullYear()}` : '';
  return `${d.getDate()} ${MONTHS_GEN[d.getMonth()]}${y}`;
}
function fmtDayHeader(iso) {
  const t = todayISO();
  if (iso === t) return 'Сегодня';
  if (iso === addDays(t, -1)) return 'Вчера';
  return `${WEEKDAYS[parseISO(iso).getDay()]}, ${fmtDay(iso)}`;
}
function fmtShortDate(iso) {
  if (!iso) return '';
  const d = parseISO(iso);
  const y = d.getFullYear() !== new Date().getFullYear() ? '.' + String(d.getFullYear()).slice(2) : '';
  return `${pad(d.getDate())}.${pad(d.getMonth() + 1)}${y}`;
}
/** Короткая подпись диапазона дат: «1–11 октября», «29 сен – 5 окт», «Октябрь 2026». */
function rangeLabel(from, to) {
  const a = parseISO(from), b = parseISO(to);
  const thisYear = new Date().getFullYear();
  if (from === monthStart(from) && to === monthEnd(from)) return `${MONTHS[a.getMonth()]} ${a.getFullYear()}`;
  if (from.slice(5) === '01-01' && to.slice(5) === '12-31' && from.slice(0, 4) === to.slice(0, 4)) return from.slice(0, 4);
  const yb = b.getFullYear() !== thisYear || a.getFullYear() !== b.getFullYear() ? ` ${b.getFullYear()}` : '';
  if (from === to) return fmtDay(from);
  if (a.getMonth() === b.getMonth() && a.getFullYear() === b.getFullYear()) return `${a.getDate()}–${b.getDate()} ${MONTHS_GEN[b.getMonth()]}${yb}`;
  const ya = a.getFullYear() !== b.getFullYear() ? ` ${a.getFullYear()}` : '';
  return `${a.getDate()} ${MONTHS_SHORT[a.getMonth()]}${ya} – ${b.getDate()} ${MONTHS_SHORT[b.getMonth()]}${yb}`;
}

const nfCache = new Map();
function nf(opts) {
  const key = JSON.stringify(opts);

}
/** Сумма с разделителями разрядов и символом валюты: «1 234,56 ₺». short — без копеек для сумм от 100 (итоги, сводки). */
const SYMBOL_FIX = { GEL: '₾' }; // где символ из Intl неудачный
function fmtMoney(value, cur, { short = false } = {}) {
  const v = Number(value) || 0;
  const whole = Number.isInteger(round2(v)) || (short && Math.abs(v) >= 100);
  const d = whole ? 0 : 2;
  try {
    const f = nf({ style: 'currency', currency: cur, currencyDisplay: 'narrowSymbol', minimumFractionDigits: d, maximumFractionDigits: d });
    return SYMBOL_FIX[cur] ? f.formatToParts(v).map((p) => (p.type === 'currency' ? SYMBOL_FIX[cur] : p.value)).join('') : f.format(v);
  } catch (e) {
    return nf({ minimumFractionDigits: d, maximumFractionDigits: d }).format(v) + ' ' + cur;
  }
}
const symCache = {};
/** Символ валюты: TRY → ₺, RUB → ₽. Для неизвестных — сам код. */
function sym(cur) {
  if (symCache[cur]) return symCache[cur];
  let s = SYMBOL_FIX[cur] || cur;
  if (SYMBOL_FIX[cur]) return (symCache[cur] = s);
  try {
    const part = nf({ style: 'currency', currency: cur, currencyDisplay: 'narrowSymbol' }).formatToParts(1).find((p) => p.type === 'currency');
    if (part) s = part.value;
  } catch (e) { /* оставляем код валюты */ }
  return (symCache[cur] = s);
}

/**
 * Запрос к ИИ-помощнику. Ключ — тот же, что у «Входящих» (если его нет — приложение получит его само).
 * Ошибки — короткими понятными фразами; null-ответов нет: либо результат, либо исключение.
 */
async function aiRequest(path, payload, { timeout = 25000 } = {}) {
  if (navigator.onLine === false) throw new Error('Нет интернета');
  await ensureConnected();
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), timeout);
  let res, data = {};
  try {
    res = await fetch(AI_URL + path, {
      method: payload ? 'POST' : 'GET', signal: ctrl.signal, cache: 'no-store',
      headers: { Authorization: 'Bearer ' + S().settings.inbox.token, ...(payload ? { 'Content-Type': 'application/json' } : {}) },
      body: payload ? JSON.stringify(payload) : undefined,
    });
    try { data = await res.json(); } catch (e) { data = {}; }
  } catch (e) {
    throw new Error(e.name === 'AbortError' ? 'ИИ долго не отвечает — попробуйте ещё раз' : 'Не удалось связаться с ИИ');
  } finally { clearTimeout(timer); }
  if (!res.ok || data.ok === false) {
    const msg = { limit: 'Лимит ИИ на сегодня исчерпан — завтра снова заработает', busy: 'ИИ сейчас перегружен — попробуйте через минуту', too_large: 'Фото слишком большое', bad_image: 'Не получилось прочитать фото' }[data.error];
    throw new Error(msg || 'ИИ временно недоступен');
  }
  return data.result || {};
}
function aiCategoryList() { return S().categories.map((c) => ({ id: c.id, name: c.name })); }
function fileDataURL(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(String(reader.result || ''));
    reader.onerror = () => reject(new Error('Не удалось прочитать фото.'));
    reader.readAsDataURL(file);
  });
}
async function compressReceipt(file) {
  if (!file || !file.type.startsWith('image/')) throw new Error('Выберите фото чека.');
  if (file.size > 20 * 1024 * 1024) throw new Error('Исходное фото больше 20 МБ. Выберите другое фото.');
  let bitmap;
  try { bitmap = await createImageBitmap(file); }
  catch (e) { throw new Error('Не удалось открыть фото. Выберите JPEG, PNG или WebP.'); }
  const scale = Math.min(1, 1600 / Math.max(bitmap.width, bitmap.height));
  const canvas = document.createElement('canvas');
  canvas.width = Math.max(1, Math.round(bitmap.width * scale));
  canvas.height = Math.max(1, Math.round(bitmap.height * scale));
  const ctx = canvas.getContext('2d');
  ctx.drawImage(bitmap, 0, 0, canvas.width, canvas.height);
  bitmap.close();
  const blob = await new Promise((resolve) => canvas.toBlob(resolve, 'image/jpeg', 0.82));
  if (!blob) throw new Error('Не удалось подготовить фото чека.');
  if (blob.size > 1_800_000) throw new Error('Фото всё ещё слишком большое. Выберите снимок с меньшим разрешением.');
  const dataURL = await fileDataURL(blob);
  return { mimeType: 'image/jpeg', data: dataURL.split(',')[1] || '' };
}

function parseNum(str) {
  let s = String(str ?? '').replace(/[\s  ']/g, '');
  if (!s) return NaN;
  if (s.includes(',') && s.includes('.')) s = s.lastIndexOf(',') > s.lastIndexOf('.') ? s.replace(/\./g, '').replace(',', '.') : s.replace(/,/g, '');
  else s = s.replace(',', '.');
  return Number(s);
}
function rgba(hex, a) {
  const h = hex.replace('#', '');
  const n = parseInt(h.length === 3 ? h.split('').map((c) => c + c).join('') : h, 16);
  return `rgba(${(n >> 16) & 255}, ${(n >> 8) & 255}, ${n & 255}, ${a})`;
}
const cssVar = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const normTag = (t) => String(t).replace(/^#+/, '').trim().toLowerCase().slice(0, 30);
const parseTags = (str) => unique(String(str || '').split(/[\s,;]+/).map(normTag).filter(Boolean));
/** Первый «символ» строки (эмодзи из нескольких кодовых точек тоже). */
function firstGrapheme(s) {
  s = String(s || '').trim();
  if (!s) return '';
  if (window.Intl && Intl.Segmenter) { for (const g of new Intl.Segmenter('ru', { granularity: 'grapheme' }).segment(s)) return g.segment; }
  return Array.from(s).slice(0, 2).join('');
}

/** Приводит загруженное состояние к актуальной схеме (на случай обновлений приложения). */
function migrate(s) {
  if (!s || typeof s !== 'object') return null;
  const d = defaultState();
  s.settings = { ...d.settings, ...(s.settings || {}) };
  const obj = (x) => (x && typeof x === 'object' && !Array.isArray(x) ? x : {});
  s.settings.inbox = { ...d.settings.inbox, ...obj(s.settings.inbox) };
  s.settings.backup = { ...d.settings.backup, ...obj(s.settings.backup) };
  s.settings.notify = { ...d.settings.notify, ...obj(s.settings.notify) };
  if (!Array.isArray(s.settings.currencies) || !s.settings.currencies.length) s.settings.currencies = [s.settings.baseCurrency];
  if (!s.settings.currencies.includes(s.settings.baseCurrency)) s.settings.currencies.unshift(s.settings.baseCurrency);
  s.categories = Array.isArray(s.categories) && s.categories.length ? s.categories : d.categories;
  if (!s.categories.some((c) => c.id === 'other')) s.categories.push({ ...DEFAULT_CATEGORIES[DEFAULT_CATEGORIES.length - 1], budget: null });
  s.expenses = Array.isArray(s.expenses) ? s.expenses : [];
  s.templates = Array.isArray(s.templates) ? s.templates : [];
  s.inbox = Array.isArray(s.inbox) ? s.inbox : [];
  s.incomes = Array.isArray(s.incomes) ? s.incomes : [];
  s.incomes.forEach((x) => { x.kind = 'income'; });
  s.goals = Array.isArray(s.goals) ? s.goals : [];
  s.debts = Array.isArray(s.debts) ? s.debts : [];
  s.merchantRules = s.merchantRules && typeof s.merchantRules === 'object' && !Array.isArray(s.merchantRules) ? s.merchantRules : {};
  s.meta = { ...d.meta, ...(s.meta || {}) };
  if (!Array.isArray(s.meta.inboxSeen)) s.meta.inboxSeen = [];
  s.meta.budgetAlerts = obj(s.meta.budgetAlerts);
  s.v = 1;
  return s;
}

}

      this.state = defaultState();

/* =====================================================================
   3. Курсы валют: загрузка с API и кэш в localStorage
   Ключ кэша: «дата|ИЗ|В» → { r: курс, p: источник, d: фактическая дата курса, t: время загрузки }
   ===================================================================== */
async function fetchJSON(url, ms = 7000) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), ms);
  try {
    const res = await fetch(url, { signal: ctrl.signal });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return await res.json();
  } finally { clearTimeout(timer); }
}

const Rates = {
  cache: {},
  inflight: new Map(),
  load() { try { this.cache = JSON.parse(localStorage.getItem(RATES_KEY)) || {}; } catch (e) { this.cache = {}; } },
  save() { try { localStorage.setItem(RATES_KEY, JSON.stringify(this.cache)); } catch (e) { /* кэш не критичен */ } },
  key: (date, from, to) => `${date}|${from}|${to}`,
  put(date, from, to, rate, provider, actualDate) {
    if (!(rate > 0) || !isFinite(rate)) return;
    this.cache[this.key(date, from, to)] = { r: sig(rate), p: provider, d: actualDate || date, t: Date.now() };
  },
  /** Курс из кэша (сегодняшний считается свежим 6 часов). */
  peek(from, to, date) {
    if (from === to) return { rate: 1, provider: '', date };
    const e = this.cache[this.key(date, from, to)];
    if (!e) return null;
    if (date >= todayISO() && Date.now() - e.t > 6 * 36e5) return null;
    return { rate: e.r, provider: e.p, date: e.d };
  },
  /** Ближайший известный курс (для работы офлайн): из кэша или из прошлых покупок. */
  nearest(from, to, date) {
    let best = null, bestDiff = Infinity;
    const suffix = `|${from}|${to}`;
    for (const k in this.cache) {
      if (!k.endsWith(suffix)) continue;
      const diff = Math.abs(daysBetween(k.slice(0, 10), date));
      if (diff < bestDiff) { bestDiff = diff; best = { rate: this.cache[k].r, provider: this.cache[k].p, date: this.cache[k].d }; }
    }
    if (to === base()) {
      for (const e of S().expenses) {
        if (e.currency !== from || !(e.rate > 0)) continue;
        const diff = Math.abs(daysBetween(e.date, date));
        if (diff < bestDiff) { bestDiff = diff; best = { rate: e.rate, provider: 'прошлая покупка', date: e.date }; }
      }
    }
    return best;
  },
  /** Курс from→to на дату: кэш, затем сеть. Возвращает { rate, provider, date } или null. */
  async get(from, to, date, timeout) {
    if (from === to) return { rate: 1, provider: '', date };
    const d = minISO(date, todayISO());
    const hit = this.peek(from, to, d);
    if (hit) return hit;
    if (navigator.onLine === false) return null;
    await this.fetchDay(d, to, [from], timeout);
    return this.peek(from, to, d);
  },
  /**
   * Загружает курсы всех «моих» валют к валюте base на дату одним запросом.
   * Порядок источников: Frankfurter (ЦБ разных стран) → currency-api (jsDelivr / Cloudflare) → ExchangeRate-API (только текущий курс).
   */
  fetchDay(date, baseCur, wanted, timeout = 7000) {
    const k = date + '|' + baseCur;
    if (this.inflight.has(k)) return this.inflight.get(k);
    const p = (async () => {
      const today = todayISO();
      const isToday = date >= today;
      const list = unique([...wanted, ...S().settings.currencies]).filter((c) => c !== baseCur && /^[A-Z]{3}$/.test(c));
      const missing = () => wanted.filter((c) => !this.peek(c, baseCur, date));
      // 1) Frankfurter v2: ответ — массив { date, base, quote, rate }, где 1 base = rate quote
      try {
        const url = `${FRANKFURTER}/rates?base=${baseCur}&quotes=${list.join(',')}${isToday ? '' : '&date=' + date}`;
        const rows = await fetchJSON(url, timeout);
        if (Array.isArray(rows)) rows.forEach((row) => { if (row && row.rate > 0) this.put(date, row.quote, baseCur, 1 / row.rate, 'Frankfurter', row.date); });
      } catch (e) { /* пробуем следующий источник */ }
      if (!missing().length) return;
      // 2) currency-api (fawazahmed0): основной адрес jsDelivr, запасной — Cloudflare Pages
      const tag = isToday ? 'latest' : date;
      const b = baseCur.toLowerCase();
      for (const url of [
        `https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@${tag}/v1/currencies/${b}.min.json`,
        `https://${tag}.currency-api.pages.dev/v1/currencies/${b}.min.json`,
      ]) {
        try {
          const j = await fetchJSON(url, timeout);
          if (j && j[b]) {
            list.forEach((c) => { const v = j[b][c.toLowerCase()]; if (v > 0 && !this.peek(c, baseCur, date)) this.put(date, c, baseCur, 1 / v, 'currency-api', j.date || date); });
            break;
          }
        } catch (e) { /* следующий адрес */ }
      }
      if (!missing().length) return;
      // 3) ExchangeRate-API: только текущий курс, поэтому используем лишь для свежих дат
      if (daysBetween(date, today) <= 7) {
        try {
          const j = await fetchJSON(`https://open.er-api.com/v6/latest/${baseCur}`, timeout);
          if (j && j.result === 'success' && j.rates) list.forEach((c) => { const v = j.rates[c]; if (v > 0 && !this.peek(c, baseCur, date)) this.put(date, c, baseCur, 1 / v, 'ExchangeRate-API', today); });
        } catch (e) { /* курса нет — пользователь введёт вручную */ }
      }
    })().finally(() => { this.inflight.delete(k); this.save(); });
    this.inflight.set(k, p);
    return p;
  },
  /** Курсы за диапазон дат одним запросом (для пересчёта и уточнения многих покупок). */
  async prefetchRange(baseCur, currencies, start, end) {
    const curs = unique(currencies).filter((c) => c !== baseCur);
    if (!curs.length || navigator.onLine === false) return;
    const rows = await fetchJSON(`${FRANKFURTER}/rates?base=${baseCur}&quotes=${curs.join(',')}&from=${start}&to=${end}`, 15000);
    if (!Array.isArray(rows)) return;
    const by = {};
    rows.forEach((r) => { if (r && r.rate > 0) (by[r.quote] = by[r.quote] || {})[r.date] = r.rate; });
    curs.forEach((c) => {
      const m = by[c];
      if (!m) return;
      const dates = Object.keys(m).sort();
      let last = m[dates[0]], lastD = dates[0];
      // выходные и праздники: берём последний опубликованный курс
      for (let d = start; d <= end; d = addDays(d, 1)) {
        if (m[d]) { last = m[d]; lastD = d; }
        if (!this.peek(c, baseCur, d)) this.put(d, c, baseCur, 1 / last, 'Frankfurter', lastD);
      }
    });
    this.save();
  },
  count() { return Object.keys(this.cache).length; },
  clear() { this.cache = {}; this.save(); },
};

/** Уточняет приблизительные курсы (демо, офлайн-покупки, импорт), когда появился интернет. */
let resolving = false;
async function resolvePending() {
  if (resolving || navigator.onLine === false) return;
  const b = base();
  const pend = [...S().expenses, ...S().incomes].filter((e) => e.ratePending && e.currency !== b);
  if (!pend.length) return;
  resolving = true;
  try {
    const today = todayISO();
    const dates = pend.map((e) => minISO(e.date, today)).sort();
    try { await Rates.prefetchRange(b, pend.map((e) => e.currency), dates[0], dates[dates.length - 1]); } catch (e) { /* дальше — по одной дате */ }
    let changed = 0, fails = 0;
    for (const e of pend) {
      const d = minISO(e.date, today);
      const r = Rates.peek(e.currency, b, d) || (fails < 2 ? await Rates.get(e.currency, b, d).catch(() => null) : null);
      if (!r) { fails++; continue; }
      if (e.rateSource === 'manual') {
        if (e.demoFactor) e.rate = sig(r.rate * e.demoFactor);
      } else {
        e.rate = sig(r.rate); e.rateProvider = r.provider; e.rateDate = r.date;
      }
      e.ratePending = false;
      e.baseAmount = round2(e.amount * e.rate);
      changed++;
    }
    if (changed) Store.commit();
  } finally { resolving = false; }
}

/* =====================================================================
   4. UI-ядро: нижние листы, тосты, диалоги
   ===================================================================== */
const Sheet = {
  stack: [],
  /** Открывает нижний лист. refresh() вызывается при изменении данных, пока лист открыт. */
  open({ title = '', body = '', foot = '', className = '', left = 'Закрыть', right = '', onClose, refresh }) {
    const z = 60 + this.stack.length * 2;
    const overlay = document.createElement('div');
    overlay.className = 'overlay';
    overlay.style.zIndex = z;
    const sheet = document.createElement('div');
    sheet.className = `sheet ${foot ? 'has-foot' : ''} ${className}`;
    sheet.style.zIndex = z + 1;
    sheet.setAttribute('role', 'dialog');
    sheet.setAttribute('aria-modal', 'true');
    sheet.setAttribute('aria-label', title);
    sheet.innerHTML = `<div class="sheet-handle"></div>
      <div class="sheet-head"><button class="link-btn" data-sheet-close>${esc(left)}</button><h2>${esc(title)}</h2><div>${right}</div></div>
      <div class="sheet-body">${body}</div>${foot ? `<div class="sheet-foot">${foot}</div>` : ''}`;
    document.body.append(overlay, sheet);
    const entry = { overlay, sheet, body: sheet.querySelector('.sheet-body'), foot: sheet.querySelector('.sheet-foot'), onClose, refresh, closed: false };
    this.stack.forEach((x) => x.sheet.classList.add('behind'));
    this.stack.push(entry);
    overlay.addEventListener('click', () => this.close(entry));
    sheet.querySelector('[data-sheet-close]').addEventListener('click', () => this.close(entry));
    this.enableDrag(entry);
    void sheet.offsetHeight; // принудительный reflow, чтобы сработала анимация появления
    overlay.classList.add('show');
    sheet.classList.add('show');
    staggerIn(entry.body, ':scope > *', { step: 35, start: 90, max: 7 });
    document.documentElement.classList.add('sheet-open');
    return entry;
  },
  close(entry = this.stack[this.stack.length - 1]) {
    if (!entry || entry.closed) return;
    entry.closed = true;
    if (entry.sheet.contains(document.activeElement)) document.activeElement.blur();
    this.stack = this.stack.filter((x) => x !== entry);
    if (this.stack.length) this.stack[this.stack.length - 1].sheet.classList.remove('behind');
    entry.overlay.classList.remove('show');
    entry.sheet.classList.remove('show');
    setTimeout(() => { entry.overlay.remove(); entry.sheet.remove(); }, 360);
    if (!this.stack.length) document.documentElement.classList.remove('sheet-open');
    if (entry.onClose) entry.onClose();
  },
  closeAll() { [...this.stack].reverse().forEach((e) => this.close(e)); },
  refreshAll() { this.stack.forEach((e) => { if (e.refresh && !e.closed) e.refresh(); }); },
  /** Закрытие свайпом вниз за «ручку» или заголовок. */
  enableDrag(entry) {
    let y0 = null, dy = 0;
    const zones = [entry.sheet.querySelector('.sheet-handle'), entry.sheet.querySelector('.sheet-head')];
    const start = (e) => { if (e.target.closest('button, input')) return; y0 = e.touches[0].clientY; dy = 0; entry.sheet.style.transition = 'none'; };
    const move = (e) => { if (y0 == null) return; dy = Math.max(0, e.touches[0].clientY - y0); entry.sheet.style.transform = `translateY(${dy}px)`; };
    const end = () => {
      if (y0 == null) return;
      entry.sheet.style.transition = '';
      entry.sheet.style.transform = '';
      if (dy > 90) this.close(entry);
      y0 = null;
    };
    zones.forEach((z) => {
      z.addEventListener('touchstart', start, { passive: true });
      z.addEventListener('touchmove', move, { passive: true });
      z.addEventListener('touchend', end);
      z.addEventListener('touchcancel', end);
    });
  },
};

/** Всплывающее уведомление с необязательной кнопкой действия (например, «Отменить»). */
function toast(msg, { action, onAction, duration } = {}) {
  const root = $('#toast-root');
  while (root.children.length >= 2) root.firstElementChild.remove();
  const t = document.createElement('div');
  t.className = 'toast';
  t.innerHTML = `<span>${esc(msg)}</span>${action ? `<button>${esc(action)}</button>` : ''}`;
  root.append(t);
  void t.offsetHeight;
  t.classList.add('show');
  const hide = () => { t.classList.remove('show'); setTimeout(() => t.remove(), 300); };
  const ms = duration || (action ? 5500 : 2800);
  if (action) { t.classList.add('timed'); t.style.setProperty('--dur', ms + 'ms'); }
  const timer = setTimeout(hide, ms);
  if (action) t.querySelector('button').addEventListener('click', () => { clearTimeout(timer); hide(); onAction && onAction(); });
}

/** Лист с вариантами выбора. Возвращает value выбранного варианта или null. */

const filterCount = () => (Filters.q ? 1 : 0) + Filters.cats.size + Filters.curs.size + Filters.tags.size + Filters.pays.size;
function matchFilters(e) {

  if (Filters.curs.size && !Filters.curs.has(e.currency)) return false;
  if (Filters.pays.size && !Filters.pays.has(e.payment)) return false;

    if (!q.split(/\s+/).every((tok) => hay.includes(tok))) return false;

/** Период аналитики: неделя (с понедельника), месяц, год или произвольный. */
const Period = { type: 'month', anchor: todayISO(), from: null, to: null };
function periodRange() {
  const a = Period.anchor, d = parseISO(a);
  switch (Period.type) {
    case 'week': { const from = addDays(a, -((d.getDay() + 6) % 7)); return { from, to: addDays(from, 6) }; }
    case 'year': return { from: `${d.getFullYear()}-01-01`, to: `${d.getFullYear()}-12-31` };
    case 'custom': return { from: Period.from, to: Period.to };
    default: return { from: monthStart(a), to: monthEnd(a) };
  }
}
function prevRange(r) {
  switch (Period.type) {
    case 'week': return { from: addDays(r.from, -7), to: addDays(r.to, -7) };
    case 'year': { const y = +r.from.slice(0, 4) - 1; return { from: `${y}-01-01`, to: `${y}-12-31` }; }
    case 'custom': { const len = daysBetween(r.from, r.to) + 1; return { from: addDays(r.from, -len), to: addDays(r.from, -1) }; }
    default: { const f = addMonths(r.from, -1); return { from: f, to: monthEnd(f) }; }
  }
}
function shiftPeriod(dir) {
  if (Period.type === 'custom') {
    const len = daysBetween(Period.from, Period.to) + 1;
    Period.from = addDays(Period.from, dir * len);
    Period.to = addDays(Period.to, dir * len);
  } else if (Period.type === 'week') Period.anchor = addDays(Period.anchor, 7 * dir);
  else if (Period.type === 'year') { const y = +Period.anchor.slice(0, 4) + dir; Period.anchor = `${y}-01-01`; }
  else Period.anchor = addMonths(Period.anchor, dir);
  App.render('analytics');
  slideIn($('#an-content'), dir);
}
/**
 * Сравнение с прошлым периодом. Если период ещё идёт — сравниваем с тем же числом дней
 * прошлого периода (1–11 ноября против 1–11 октября), иначе сравнение было бы нечестным.
 */
function comparePeriods(r, list) {
  const today = todayISO();
  if (r.from > today) return null;
  const p = prevRange(r);
  let curTo = r.to, prevTo = p.to;
  if (r.to > today) {
    const elapsed = daysBetween(r.from, today);
    curTo = today;
    prevTo = minISO(addDays(p.from, elapsed), p.to);
  }
  const cur = sumBase(inRange(list, r.from, curTo));
  const prev = sumBase(inRange(S().expenses.filter(matchFilters), p.from, prevTo));
  return { cur, prev, pct: prev > 0 ? (cur - prev) / prev : null, label: rangeLabel(p.from, prevTo) };
}
function deltaBadge(pct) {
  if (pct == null) return '';
  if (Math.abs(pct) < 0.005) return '<span class="delta flat">0%</span>';
  const up = pct > 0;
  return `<span class="delta ${up ? 'up' : 'down'}">${icon(up ? 'arrowUp' : 'arrowDown', 13)}${fmtPct(Math.abs(pct))}</span>`;
}

    $$('.view').forEach((v) => {

    if (changed) window.scrollTo(0, 0);

function txRow(e, { showDate = false } = {}) {

  </button>`;
}
const sortByDateDesc = (a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : (b.createdAt || 0) - (a.createdAt || 0));
function groupedList(list, limit = Infinity) {
  const items = list.slice().sort(sortByDateDesc).slice(0, limit);
  const groups = new Map();
  items.forEach((e) => { if (!groups.has(e.date)) groups.set(e.date, []); groups.get(e.date).push(e); });
  let html = '';
  groups.forEach((arr, date) => {
    const out = arr.filter((e) => !isIncome(e)), inc = sumBase(arr.filter(isIncome));
    const sums = [out.length ? fmtMoney(sumBase(out), base()) : '', inc > 0 ? `<span class="ok-text">+${fmtMoney(inc, base())}</span>` : ''].filter(Boolean).join(' · ');
    html += `<div class="day-head"><span>${fmtDayHeader(date)}</span><span class="num">${sums}</span></div>

  });

}

    <div class="inc-foot">${bal >= 0 ? `Отложено <b class="ok-text">${fmtMoney(bal, b, { short: true })}</b> — ${fmtPct(rate)} дохода` : `Расходы больше доходов на <b class="bad-text">${fmtMoney(-bal, b, { short: true })}</b>`}</div></div>`;

/** Средний курс, по которому тратилась валюта, против текущего курса. */
function renderAvgRates(curRows) {
  const box = $('#avg-rates');
  if (!box) return;
  const b = base(), today = todayISO();
  const rows = curRows.filter((x) => x.code !== b && x.origRated > 0);
  const need = [];
  box.innerHTML = rows.map((x) => {
    const avg = x.base / x.origRated;
    const cur = Rates.peek(x.code, b, today);
    if (!cur) need.push(x.code);
    const unit = avg < 0.01 ? 1000 : avg < 1 ? 100 : 1; // «100 ₽ = 52,84 ₺» читается лучше, чем «1 ₽ = 0,528414 ₺»
    const fmtR = (rate) => `${nf({ maximumFractionDigits: 0 }).format(unit)} ${sym(x.code)} = ${nf({ maximumFractionDigits: rate * unit < 1 ? 4 : 2 }).format(rate * unit)} ${sym(b)}`;
    let note = '<span class="muted">Текущий курс недоступен без интернета</span>';
    if (cur) {
      const now = x.origRated * cur.rate, diff = (now - x.base) / x.base;
      note = `По сегодняшнему курсу эти траты стоили бы <b>${fmtMoney(now, b, { short: true })}</b> — ${Math.abs(diff) < 0.001 ? 'столько же'
        : `<span class="${diff > 0 ? 'ok-text' : 'bad-text'}">на ${fmtPct(Math.abs(diff))} ${diff > 0 ? 'дороже' : 'дешевле'}</span>`}.`;
    }
    return `<div class="rate-row"><div class="rr-head"><span style="font-size:20px">${flagOf(x.code)}</span><b>${x.code}</b><span class="muted">${fmtMoney(x.orig, x.code)}</span></div>
      <div class="rr-grid"><div><small>Ваш средний курс</small><b>${fmtR(avg)}</b></div><div><small>Сейчас</small><b>${cur ? fmtR(cur.rate) : '—'}</b></div></div>
      <div class="rr-note">${note}</div></div>`;
  }).join('');
  if (need.length && navigator.onLine !== false) {
    Promise.all(need.map((c) => Rates.get(c, b, today).catch(() => null))).then((res) => {
      if (res.some(Boolean) && App.tab === 'analytics' && $('#avg-rates') === box) renderAvgRates(curRows);
    });
  }
}
