<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Траты — учёт расходов</title>
<meta name="description" content="Личный учёт расходов в разных валютах: быстрый ввод, аналитика, бюджеты. Работает без интернета.">
<meta name="theme-color" id="meta-theme" content="#F3F4F8">
<!-- iOS: запуск во весь экран с экрана «Домой» -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Траты">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<script>
  /* Ранний скрипт: тема до первой отрисовки (без «вспышки») и манифест только при работе по http(s). */
  (function () {
    try {
      var p = localStorage.getItem('traty.theme') || 'system';
      var dark = p === 'dark' || (p === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    } catch (e) { /* localStorage может быть недоступен — останется светлая тема */ }
    if (/^https?:$/.test(location.protocol)) {
      var l = document.createElement('link');
      l.rel = 'manifest'; l.href = 'manifest.json';
      document.head.appendChild(l);
    }
  })();
</script>
<style>
/* =====================================================================
   1. Дизайн-токены: светлая и тёмная тема
   ===================================================================== */
:root {
  --bg: #F3F4F8;
  --surface: #FFFFFF;
  --surface-2: #F1F2F7;
  --surface-3: #E4E6EE;
  --text: #0C0E16;
  --text-2: #646A7B;
  --text-3: #9BA1AF;
  --border: rgba(12, 16, 32, .08);
  --card-border: transparent;
  --accent: #5B4DFF;
  --accent-2: #8F62FF;
  --accent-soft: rgba(91, 77, 255, .12);
  --accent-text: #4A3CF0;
  --ok: #12B886;
  --warn: #F2A516;
  --bad: #F0445A;
  --seg-track: #E6E8EF;
  --seg-on: #FFFFFF;
  --tabbar-bg: rgba(255, 255, 255, .82);
  --shadow-sm: 0 1px 2px rgba(16, 20, 40, .04), 0 2px 8px rgba(16, 20, 40, .04);
  --shadow: 0 1px 2px rgba(16, 20, 40, .03), 0 8px 24px rgba(16, 20, 40, .06);
  --shadow-lg: 0 -12px 40px rgba(16, 20, 40, .16);
  --radius: 20px;
  --radius-sm: 14px;
  --sat: env(safe-area-inset-top, 0px);
  --sab: env(safe-area-inset-bottom, 0px);
  --sal: env(safe-area-inset-left, 0px);
  --sar: env(safe-area-inset-right, 0px);
  --tabbar-h: 62px;
  --kb: 0px;
  --ease: cubic-bezier(.2, .8, .2, 1);
  color-scheme: light;
}
[data-theme="dark"] {
  --bg: #0A0B0F;
  --surface: #15171E;
  --surface-2: #1D2029;
  --surface-3: #2A2E3A;
  --text: #F2F3F7;
  --text-2: #A2A8B6;
  --text-3: #6C7282;
  --border: rgba(255, 255, 255, .07);
  --card-border: rgba(255, 255, 255, .05);
  --accent: #7C6EFF;
  --accent-2: #A47EFF;
  --accent-soft: rgba(124, 110, 255, .18);
  --accent-text: #A99CFF;
  --seg-track: #1D2029;
  --seg-on: #2E3240;
  --tabbar-bg: rgba(18, 20, 26, .82);
  --shadow-sm: none;
  --shadow: none;
  --shadow-lg: 0 -12px 40px rgba(0, 0, 0, .55);
  color-scheme: dark;
}

/* =====================================================================
   2. База
   ===================================================================== */
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
html, body { margin: 0; background: var(--bg); color: var(--text); }
body {
  font: 16px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
  min-height: 100dvh;
  overscroll-behavior-y: none;
  transition: background-color .3s;
}
.sheet-open body { overflow: hidden; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; cursor: pointer; touch-action: manipulation; text-align: inherit; }
button:disabled { opacity: .35; cursor: default; }
input, select, textarea { font: inherit; color: inherit; font-size: 16px; } /* 16px — чтобы iOS не зумил поле */
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.muted { color: var(--text-2); }
.num { font-variant-numeric: tabular-nums; }
b, strong { font-weight: 700; }
svg.i { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* =====================================================================
   3. Каркас, верхняя панель, нижняя навигация
   ===================================================================== */
.app {
  max-width: 560px;
  margin: 0 auto;
  padding: calc(var(--sat) + 10px) calc(16px + var(--sar)) calc(var(--tabbar-h) + var(--sab) + 36px) calc(16px + var(--sal));
}
.view { display: none; }
.view.active { display: block; animation: viewIn .28s var(--ease); }
.topbar { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; padding: 6px 2px 14px; }
.topbar h1 { font-size: 32px; line-height: 1.1; font-weight: 800; letter-spacing: -.035em; margin: 0; }
.eyebrow { font-size: 13px; font-weight: 600; color: var(--text-2); margin-bottom: 2px; }
.icon-btn {
  position: relative; width: 42px; height: 42px; border-radius: 50%; flex: none;
  display: grid; place-items: center; background: var(--surface); box-shadow: var(--shadow-sm);
  border: 1px solid var(--card-border); transition: transform .15s var(--ease);
}
.icon-btn:active { transform: scale(.92); }
.icon-btn.sm { width: 36px; height: 36px; }
.icon-btn .badge {
  position: absolute; top: -3px; right: -3px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px;
  background: var(--accent); color: #fff; font-size: 11px; font-weight: 700; display: grid; place-items: center;
}

.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
  padding: 4px calc(8px + var(--sar)) calc(4px + var(--sab)) calc(8px + var(--sal));
  background: var(--tabbar-bg);
  -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px);
  border-top: 1px solid var(--border);
  user-select: none; -webkit-user-select: none;
}
.tabbar-inner { max-width: 560px; margin: 0 auto; height: var(--tabbar-h); display: grid; grid-template-columns: repeat(5, 1fr); align-items: center; }
.tab { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; font-weight: 600; color: var(--text-3); padding: 6px 0; transition: color .2s; }
.tab svg.i { width: 25px; height: 25px; }
.tab.active { color: var(--accent); }
.fab {
  justify-self: center; width: 60px; height: 60px; margin-top: -30px; border-radius: 50%;
  display: grid; place-items: center; color: #fff;
  background: linear-gradient(140deg, var(--accent-2), var(--accent));
  box-shadow: 0 10px 24px rgba(91, 77, 255, .42), 0 0 0 5px var(--bg);
  transition: transform .2s var(--ease);
}
.fab svg.i { width: 30px; height: 30px; stroke-width: 2.6; }
.fab:active { transform: scale(.9); }

/* =====================================================================
   4. Карточки, секции, кнопки, поля
   ===================================================================== */
.card { background: var(--surface); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); border: 1px solid var(--card-border); margin-bottom: 12px; }
.card h3 { font-size: 17px; font-weight: 750; letter-spacing: -.015em; margin: 0 0 4px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.card .card-sub { font-size: 13px; color: var(--text-2); margin: 0 0 8px; }
.section-head { display: flex; align-items: center; justify-content: space-between; margin: 24px 4px 10px; gap: 8px; }
.section-head h2 { font-size: 20px; font-weight: 780; letter-spacing: -.025em; margin: 0; }
.link-btn { color: var(--accent-text); font-weight: 600; font-size: 15px; padding: 4px 2px; }
.link-btn.sm { font-size: 14px; }

.btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; height: 54px; border-radius: 16px; font-weight: 700; font-size: 17px; transition: transform .15s var(--ease), opacity .15s; }
.btn:active { transform: scale(.98); }
.btn-primary { background: linear-gradient(140deg, var(--accent-2), var(--accent)); color: #fff; box-shadow: 0 8px 20px rgba(91, 77, 255, .28); }
.btn-secondary { background: var(--surface-2); color: var(--text); }
.btn-danger { background: rgba(240, 68, 90, .1); color: var(--bad); }
.btn-row { display: flex; gap: 8px; margin-top: 8px; }
.btn-row .btn { height: 44px; font-size: 14.5px; border-radius: 13px; }
.stack { display: grid; gap: 10px; }

.input {
  width: 100%; height: 50px; border-radius: 14px; padding: 0 14px;
  border: 1.5px solid transparent; background: var(--surface-2); outline: none;
  transition: border-color .15s, background .15s;
  -webkit-appearance: none; appearance: none;
}
.input:focus { border-color: var(--accent); background: var(--surface); }
.input::placeholder { color: var(--text-3); }
.field { margin-top: 18px; }
.field-label { font-size: 13px; font-weight: 650; color: var(--text-2); margin: 0 2px 8px; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips.scroll { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 2px 16px 6px; }
.chips.scroll::-webkit-scrollbar { display: none; }
.chip {
  flex: none; display: inline-flex; align-items: center; gap: 6px; height: 38px; padding: 0 14px;
  border-radius: 19px; background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow-sm);
  font-size: 15px; font-weight: 600; white-space: nowrap;
  transition: transform .15s var(--ease), background .15s, color .15s, border-color .15s;
  user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
}
.sheet .chip { background: var(--surface-2); border-color: transparent; box-shadow: none; }
.chip:active { transform: scale(.95); }
.chip.on, .sheet .chip.on { background: var(--accent); color: #fff; border-color: transparent; }
.chip.sm { height: 32px; padding: 0 12px; font-size: 14px; border-radius: 16px; }
.chip.ghost { background: transparent; box-shadow: none; border: 1.5px dashed var(--surface-3); color: var(--text-2); }
.chip .x { opacity: .75; font-size: 16px; line-height: 1; }
.chip .chip-sub { color: var(--text-2); font-weight: 500; }
.chip.on .chip-sub { color: rgba(255, 255, 255, .8); }
.filterbar { margin: 2px 0 10px; }
.filterbar:empty { display: none; }

.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 2px; padding: 3px; border-radius: 13px; background: var(--seg-track); }
.seg button { height: 34px; border-radius: 10px; font-size: 14px; font-weight: 600; color: var(--text-2); text-align: center; transition: background .2s, color .2s; }
.seg button.on { background: var(--seg-on); color: var(--text); box-shadow: 0 1px 3px rgba(0, 0, 0, .08); }

.progress { height: 8px; border-radius: 4px; background: var(--surface-2); overflow: hidden; }
.progress > i { display: block; height: 100%; border-radius: 4px; background: var(--ok); transition: width .6s var(--ease), background-color .3s; }
.progress.warn > i { background: var(--warn); }
.progress.over > i { background: var(--bad); }
.warn-text { color: var(--warn); }
.bad-text { color: var(--bad); }
.ok-text { color: var(--ok); }

.spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .7s linear infinite; vertical-align: -2px; }

/* =====================================================================
   5. Главная: карточка месяца, баннеры, список покупок
   ===================================================================== */
.hero {
  position: relative; overflow: hidden; border-radius: 26px; padding: 20px 20px 18px; color: #fff;
  background: radial-gradient(120% 140% at 100% 0%, #9A6BFF 0%, #5B4DFF 48%, #3A2ED6 100%);
  box-shadow: 0 16px 34px rgba(76, 61, 240, .32);
  cursor: pointer;
}
[data-theme="dark"] .hero { background: radial-gradient(120% 140% at 100% 0%, #7E58F0 0%, #4C3EE6 50%, #2A1FA8 100%); box-shadow: none; }
.hero::before, .hero::after { content: ""; position: absolute; border-radius: 50%; pointer-events: none; }
.hero::before { width: 220px; height: 220px; right: -70px; bottom: -120px; background: rgba(255, 255, 255, .09); }
.hero::after { width: 120px; height: 120px; right: 40px; top: -60px; background: rgba(255, 255, 255, .07); }
.hero > * { position: relative; z-index: 1; }
.hero-label { font-size: 14px; font-weight: 600; opacity: .85; }
.hero-amount { font-size: clamp(32px, 10vw, 44px); font-weight: 800; letter-spacing: -.035em; margin: 4px 0 6px; font-variant-numeric: tabular-nums; line-height: 1.05; }
.hero-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 14px; }
.hero-pill { display: inline-flex; align-items: center; gap: 4px; padding: 4px 9px; border-radius: 9px; background: rgba(255, 255, 255, .17); font-weight: 650; font-size: 13px; }
.hero-budget { margin-top: 16px; }
.hero-budget .progress { background: rgba(255, 255, 255, .22); height: 7px; }
.hero-budget .progress > i { background: #fff; }
.hero-budget .progress.warn > i { background: #FFD166; }
.hero-budget .progress.over > i { background: #FF7A8A; }
.hero-budget-text { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; opacity: .9; margin-top: 7px; }
.hero-link { margin-top: 14px; font-size: 14px; font-weight: 650; opacity: .9; display: inline-flex; align-items: center; gap: 4px; }

.banner { display: flex; gap: 12px; align-items: flex-start; padding: 14px; border-radius: 18px; background: var(--surface); box-shadow: var(--shadow); border: 1px solid var(--card-border); margin-top: 12px; animation: viewIn .3s var(--ease); }
.banner .ico { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; font-size: 20px; flex: none; background: var(--accent-soft); }
.banner .txt { flex: 1; min-width: 0; font-size: 14px; color: var(--text-2); }
.banner .txt b { display: block; color: var(--text); font-size: 15px; margin-bottom: 2px; }
.banner .acts { display: flex; gap: 14px; margin-top: 8px; }

.search-row { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
.search { position: relative; flex: 1; display: block; }
.search svg.i { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); width: 19px; height: 19px; color: var(--text-3); pointer-events: none; }
.search input {
  width: 100%; height: 44px; border-radius: 14px; border: 1px solid var(--card-border); outline: none;
  background: var(--surface); box-shadow: var(--shadow-sm); padding: 0 12px 0 40px; -webkit-appearance: none; appearance: none;
}
.search input:focus { box-shadow: 0 0 0 2px var(--accent); }
.sheet .search input { background: var(--surface-2); box-shadow: none; }

.day-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 13px; font-weight: 650; color: var(--text-2); padding: 14px 6px 7px; }
.day-head:first-child { padding-top: 2px; }
.tx-list { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); border: 1px solid var(--card-border); overflow: hidden; }
.sheet .tx-list { box-shadow: none; border: 0; background: var(--surface-2); }
.tx { position: relative; display: flex; align-items: center; gap: 12px; width: 100%; padding: 11px 14px; text-align: left; transition: background .15s; }
.tx + .tx::before { content: ""; position: absolute; left: 68px; right: 0; top: 0; height: 1px; background: var(--border); }
.tx:active { background: var(--surface-2); }
.sheet .tx:active { background: var(--surface-3); }
.tx.flash { animation: flash 1.4s var(--ease); }
.tx-icon { width: 42px; height: 42px; flex: none; border-radius: 14px; display: grid; place-items: center; font-size: 21px; line-height: 1; }
.tx-icon.sm { width: 34px; height: 34px; border-radius: 11px; font-size: 17px; }
.tx-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.tx-title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tx-sub { font-size: 13px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tx-amt { display: flex; flex-direction: column; align-items: flex-end; gap: 1px; font-variant-numeric: tabular-nums; flex: none; max-width: 46%; }
.tx-base { font-weight: 680; white-space: nowrap; }
.tx-orig { font-size: 12.5px; color: var(--text-2); white-space: nowrap; }
.tag { color: var(--accent-text); }
.more-btn { margin: 12px auto 0; display: block; }
.list-summary { font-size: 13px; color: var(--text-2); margin: -2px 6px 8px; }

.empty { text-align: center; padding: 36px 20px; color: var(--text-2); }
.empty .em { font-size: 46px; margin-bottom: 10px; }
.empty b { display: block; color: var(--text); font-size: 17px; margin-bottom: 4px; }

/* =====================================================================
   6. Аналитика
   ===================================================================== */
.period-nav { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 12px 0; }
.period-nav .label { font-size: 17px; font-weight: 750; letter-spacing: -.015em; text-align: center; flex: 1; }
.custom-range { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center; margin-bottom: 12px; }
.custom-range .input { height: 44px; background: var(--surface); box-shadow: var(--shadow-sm); }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
.stat { background: var(--surface); border-radius: 18px; padding: 14px 15px; box-shadow: var(--shadow); border: 1px solid var(--card-border); min-width: 0; }
.stat.wide { grid-column: 1 / -1; }
.stat-label { font-size: 13px; font-weight: 600; color: var(--text-2); }
.stat-value { font-size: 22px; font-weight: 800; letter-spacing: -.025em; margin-top: 4px; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stat.wide .stat-value { font-size: 34px; }
.stat-foot { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 6px; font-size: 13px; color: var(--text-2); }
.delta { display: inline-flex; align-items: center; gap: 3px; padding: 3px 8px; border-radius: 8px; font-size: 13px; font-weight: 700; }
.delta.up { color: var(--bad); background: rgba(240, 68, 90, .12); }
.delta.down { color: var(--ok); background: rgba(18, 184, 134, .12); }
.delta.flat { color: var(--text-2); background: var(--surface-2); }
.donut-wrap { position: relative; height: 230px; margin: 8px 0 6px; }
.donut-center { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; pointer-events: none; }
.donut-center b { font-size: 22px; font-weight: 800; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.donut-center span { font-size: 13px; color: var(--text-2); }
.chart-box { position: relative; height: 210px; margin-top: 8px; }
.chart-off { display: grid; place-items: center; height: 100%; color: var(--text-2); font-size: 14px; text-align: center; padding: 0 20px; background: var(--surface-2); border-radius: 14px; }
.legend-row { display: flex; align-items: center; gap: 12px; width: 100%; padding: 10px 2px; text-align: left; }
.legend-row + .legend-row { border-top: 1px solid var(--border); }
.lg-main { flex: 1; min-width: 0; }
.lg-name { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mini-bar { display: block; height: 4px; border-radius: 2px; background: var(--surface-2); margin-top: 6px; overflow: hidden; }
.mini-bar i { display: block; height: 100%; border-radius: 2px; }
.lg-amt { text-align: right; font-variant-numeric: tabular-nums; flex: none; min-width: 92px; }
.lg-amt b { display: block; font-weight: 700; }
.lg-amt small { color: var(--text-2); font-size: 12.5px; }
.cur-row { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 12px; align-items: center; padding: 10px 2px; }
.cur-row + .cur-row { border-top: 1px solid var(--border); }
.cur-flag { font-size: 24px; width: 34px; text-align: center; }
.cur-row .r { text-align: right; font-variant-numeric: tabular-nums; }
.cur-row small { color: var(--text-2); font-size: 12.5px; display: block; }
.rate-row { padding: 12px 0; }
.rate-row + .rate-row { border-top: 1px solid var(--border); }
.rr-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.rr-head .muted { margin-left: auto; font-size: 13px; }
.rr-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.rr-grid > div { background: var(--surface-2); border-radius: 12px; padding: 9px 11px; font-variant-numeric: tabular-nums; }
.rr-grid small { display: block; font-size: 12px; color: var(--text-2); margin-bottom: 2px; }
.rr-note { font-size: 13.5px; color: var(--text-2); margin-top: 8px; }

/* =====================================================================
   7. Бюджеты и настройки
   ===================================================================== */
.budget-row { display: flex; gap: 12px; align-items: center; width: 100%; padding: 12px 14px; text-align: left; position: relative; }
.budget-row + .budget-row::before { content: ""; position: absolute; left: 68px; right: 0; top: 0; height: 1px; background: var(--border); }
.budget-row:active { background: var(--surface-2); }

/* Входящие: траты из Apple Pay и SMS */
.ib-item { padding: 14px; border-radius: 18px; background: var(--surface-2); margin-bottom: 12px; }

.steps code { font-size: 13px; padding: 1px 6px; border-radius: 6px; background: var(--surface-2); }

/* =====================================================================
   9. Анимации и адаптив
   ===================================================================== */
@keyframes viewIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@keyframes spin { to { transform: rotate(360deg); } }

/* =====================================================================

/* --- Даты (всегда локальные строки YYYY-MM-DD, без UTC-сдвигов) --- */
const pad = (n) => String(n).padStart(2, '0');
const toISO = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const todayISO = () => toISO(new Date());
const parseISO = (s) => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (iso, n) => { const d = parseISO(iso); d.setDate(d.getDate() + n); return toISO(d); };
const addMonths = (iso, n) => { const d = parseISO(iso); return toISO(new Date(d.getFullYear(), d.getMonth() + n, 1)); };
const monthStart = (iso) => iso.slice(0, 8) + '01';
const monthEnd = (iso) => { const d = parseISO(iso); return toISO(new Date(d.getFullYear(), d.getMonth() + 1, 0)); };
const daysBetween = (a, b) => Math.round((parseISO(b) - parseISO(a)) / DAY_MS);
const minISO = (a, b) => (a < b ? a : b);
const maxISO = (a, b) => (a > b ? a : b);

function fmtDay(iso, withYear = false) {
  const d = parseISO(iso);
  const y = withYear || d.getFullYear() !== new Date().getFullYear() ? ` ${d.getFullYear()}` : '';
  return `${d.getDate()} ${MONTHS_GEN[d.getMonth()]}${y}`;
}
function fmtDayHeader(iso) {
  const t = todayISO();
  if (iso === t) return 'Сегодня';
  if (iso === addDays(t, -1)) return 'Вчера';
  return `${WEEKDAYS[parseISO(iso).getDay()]}, ${fmtDay(iso)}`;
}
function fmtShortDate(iso) {
  if (!iso) return '';
  const d = parseISO(iso);
  const y = d.getFullYear() !== new Date().getFullYear() ? '.' + String(d.getFullYear()).slice(2) : '';
  return `${pad(d.getDate())}.${pad(d.getMonth() + 1)}${y}`;
}
/** Короткая подпись диапазона дат: «1–11 октября», «29 сен – 5 окт», «Октябрь 2026». */
function rangeLabel(from, to) {
  const a = parseISO(from), b = parseISO(to);
  const thisYear = new Date().getFullYear();
  if (from === monthStart(from) && to === monthEnd(from)) return `${MONTHS[a.getMonth()]} ${a.getFullYear()}`;
  if (from.slice(5) === '01-01' && to.slice(5) === '12-31' && from.slice(0, 4) === to.slice(0, 4)) return from.slice(0, 4);
  const yb = b.getFullYear() !== thisYear || a.getFullYear() !== b.getFullYear() ? ` ${b.getFullYear()}` : '';
  if (from === to) return fmtDay(from);
  if (a.getMonth() === b.getMonth() && a.getFullYear() === b.getFullYear()) return `${a.getDate()}–${b.getDate()} ${MONTHS_GEN[b.getMonth()]}${yb}`;
  const ya = a.getFullYear() !== b.getFullYear() ? ` ${a.getFullYear()}` : '';
  return `${a.getDate()} ${MONTHS_SHORT[a.getMonth()]}${ya} – ${b.getDate()} ${MONTHS_SHORT[b.getMonth()]}${yb}`;
}

const nfCache = new Map();
function nf(opts) {

}
/** Сумма с разделителями разрядов и символом валюты: «1 234,56 ₺». short — без копеек для сумм от 100 (итоги, сводки). */
const SYMBOL_FIX = { GEL: '₾' }; // где символ из Intl неудачный
function fmtMoney(value, cur, { short = false } = {}) {
  const v = Number(value) || 0;
  const whole = Number.isInteger(round2(v)) || (short && Math.abs(v) >= 100);
  const d = whole ? 0 : 2;
  try {
    const f = nf({ style: 'currency', currency: cur, currencyDisplay: 'narrowSymbol', minimumFractionDigits: d, maximumFractionDigits: d });
    return SYMBOL_FIX[cur] ? f.formatToParts(v).map((p) => (p.type === 'currency' ? SYMBOL_FIX[cur] : p.value)).join('') : f.format(v);
  } catch (e) {
    return nf({ minimumFractionDigits: d, maximumFractionDigits: d }).format(v) + ' ' + cur;
  }
}
const symCache = {};
/** Символ валюты: TRY → ₺, RUB → ₽. Для неизвестных — сам код. */
function sym(cur) {
  if (symCache[cur]) return symCache[cur];
  let s = SYMBOL_FIX[cur] || cur;
  if (SYMBOL_FIX[cur]) return (symCache[cur] = s);
  try {
    const part = nf({ style: 'currency', currency: cur, currencyDisplay: 'narrowSymbol' }).formatToParts(1).find((p) => p.type === 'currency');
    if (part) s = part.value;
  } catch (e) { /* оставляем код валюты */ }
  return (symCache[cur] = s);
}

/** Разбор чисел в любом формате: «1 234,5», «1,234.50», «12.5». */
function parseNum(str) {
  let s = String(str ?? '').replace(/[\s  ']/g, '');
  if (!s) return NaN;
  if (s.includes(',') && s.includes('.')) s = s.lastIndexOf(',') > s.lastIndexOf('.') ? s.replace(/\./g, '').replace(',', '.') : s.replace(/,/g, '');
  else s = s.replace(',', '.');
  return Number(s);
}
function rgba(hex, a) {
  const h = hex.replace('#', '');
  const n = parseInt(h.length === 3 ? h.split('').map((c) => c + c).join('') : h, 16);
  return `rgba(${(n >> 16) & 255}, ${(n >> 8) & 255}, ${n & 255}, ${a})`;
}

/** Первый «символ» строки (эмодзи из нескольких кодовых точек тоже). */
function firstGrapheme(s) {
  s = String(s || '').trim();

/** Приводит загруженное состояние к актуальной схеме (на случай обновлений приложения). */
function migrate(s) {
  if (!s || typeof s !== 'object') return null;
  const d = defaultState();
  s.settings = { ...d.settings, ...(s.settings || {}) };
  s.settings.inbox = { ...d.settings.inbox, ...(s.settings.inbox && typeof s.settings.inbox === 'object' ? s.settings.inbox : {}) };
  if (!Array.isArray(s.settings.currencies) || !s.settings.currencies.length) s.settings.currencies = [s.settings.baseCurrency];
  if (!s.settings.currencies.includes(s.settings.baseCurrency)) s.settings.currencies.unshift(s.settings.baseCurrency);
  s.categories = Array.isArray(s.categories) && s.categories.length ? s.categories : d.categories;
  if (!s.categories.some((c) => c.id === 'other')) s.categories.push({ ...DEFAULT_CATEGORIES[DEFAULT_CATEGORIES.length - 1], budget: null });
  s.expenses = Array.isArray(s.expenses) ? s.expenses : [];
  s.templates = Array.isArray(s.templates) ? s.templates : [];
  s.inbox = Array.isArray(s.inbox) ? s.inbox : [];
  s.merchantRules = s.merchantRules && typeof s.merchantRules === 'object' && !Array.isArray(s.merchantRules) ? s.merchantRules : {};
  s.meta = { ...d.meta, ...(s.meta || {}) };
  if (!Array.isArray(s.meta.inboxSeen)) s.meta.inboxSeen = [];
  s.v = 1;
  return s;
}

async function fetchJSON(url, ms = 7000) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), ms);
  try {
    const res = await fetch(url, { signal: ctrl.signal });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return await res.json();
  } finally { clearTimeout(timer); }
}

const Rates = {
  cache: {},
  inflight: new Map(),
  load() { try { this.cache = JSON.parse(localStorage.getItem(RATES_KEY)) || {}; } catch (e) { this.cache = {}; } },
  save() { try { localStorage.setItem(RATES_KEY, JSON.stringify(this.cache)); } catch (e) { /* кэш не критичен */ } },
  key: (date, from, to) => `${date}|${from}|${to}`,
  put(date, from, to, rate, provider, actualDate) {
    if (!(rate > 0) || !isFinite(rate)) return;
    this.cache[this.key(date, from, to)] = { r: sig(rate), p: provider, d: actualDate || date, t: Date.now() };
  },
  /** Курс из кэша (сегодняшний считается свежим 6 часов). */
  peek(from, to, date) {
    if (from === to) return { rate: 1, provider: '', date };
    const e = this.cache[this.key(date, from, to)];
    if (!e) return null;
    if (date >= todayISO() && Date.now() - e.t > 6 * 36e5) return null;
    return { rate: e.r, provider: e.p, date: e.d };
  },
  /** Ближайший известный курс (для работы офлайн): из кэша или из прошлых покупок. */
  nearest(from, to, date) {
    let best = null, bestDiff = Infinity;
    const suffix = `|${from}|${to}`;
    for (const k in this.cache) {
      if (!k.endsWith(suffix)) continue;
      const diff = Math.abs(daysBetween(k.slice(0, 10), date));
      if (diff < bestDiff) { bestDiff = diff; best = { rate: this.cache[k].r, provider: this.cache[k].p, date: this.cache[k].d }; }
    }
    if (to === base()) {
      for (const e of S().expenses) {
        if (e.currency !== from || !(e.rate > 0)) continue;
        const diff = Math.abs(daysBetween(e.date, date));
        if (diff < bestDiff) { bestDiff = diff; best = { rate: e.rate, provider: 'прошлая покупка', date: e.date }; }
      }
    }
    return best;
  },
  /** Курс from→to на дату: кэш, затем сеть. Возвращает { rate, provider, date } или null. */
  async get(from, to, date, timeout) {
    if (from === to) return { rate: 1, provider: '', date };
    const d = minISO(date, todayISO());
    const hit = this.peek(from, to, d);
    if (hit) return hit;
    if (navigator.onLine === false) return null;
    await this.fetchDay(d, to, [from], timeout);
    return this.peek(from, to, d);
  },
  /**
   * Загружает курсы всех «моих» валют к валюте base на дату одним запросом.
   * Порядок источников: Frankfurter (ЦБ разных стран) → currency-api (jsDelivr / Cloudflare) → ExchangeRate-API (только текущий курс).
   */
  fetchDay(date, baseCur, wanted, timeout = 7000) {
    const k = date + '|' + baseCur;
    if (this.inflight.has(k)) return this.inflight.get(k);
    const p = (async () => {
      const today = todayISO();
      const isToday = date >= today;
      const list = unique([...wanted, ...S().settings.currencies]).filter((c) => c !== baseCur && /^[A-Z]{3}$/.test(c));
      const missing = () => wanted.filter((c) => !this.peek(c, baseCur, date));
      // 1) Frankfurter v2: ответ — массив { date, base, quote, rate }, где 1 base = rate quote
      try {
        const url = `${FRANKFURTER}/rates?base=${baseCur}&quotes=${list.join(',')}${isToday ? '' : '&date=' + date}`;
        const rows = await fetchJSON(url, timeout);
        if (Array.isArray(rows)) rows.forEach((row) => { if (row && row.rate > 0) this.put(date, row.quote, baseCur, 1 / row.rate, 'Frankfurter', row.date); });
      } catch (e) { /* пробуем следующий источник */ }
      if (!missing().length) return;
      // 2) currency-api (fawazahmed0): основной адрес jsDelivr, запасной — Cloudflare Pages
      const tag = isToday ? 'latest' : date;
      const b = baseCur.toLowerCase();
      for (const url of [
        `https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@${tag}/v1/currencies/${b}.min.json`,
        `https://${tag}.currency-api.pages.dev/v1/currencies/${b}.min.json`,
      ]) {
        try {
          const j = await fetchJSON(url, timeout);
          if (j && j[b]) {
            list.forEach((c) => { const v = j[b][c.toLowerCase()]; if (v > 0 && !this.peek(c, baseCur, date)) this.put(date, c, baseCur, 1 / v, 'currency-api', j.date || date); });
            break;
          }
        } catch (e) { /* следующий адрес */ }
      }
      if (!missing().length) return;
      // 3) ExchangeRate-API: только текущий курс, поэтому используем лишь для свежих дат
      if (daysBetween(date, today) <= 7) {
        try {
          const j = await fetchJSON(`https://open.er-api.com/v6/latest/${baseCur}`, timeout);
          if (j && j.result === 'success' && j.rates) list.forEach((c) => { const v = j.rates[c]; if (v > 0 && !this.peek(c, baseCur, date)) this.put(date, c, baseCur, 1 / v, 'ExchangeRate-API', today); });
        } catch (e) { /* курса нет — пользователь введёт вручную */ }
      }
    })().finally(() => { this.inflight.delete(k); this.save(); });
    this.inflight.set(k, p);
    return p;
  },
  /** Курсы за диапазон дат одним запросом (для пересчёта и уточнения многих покупок). */
  async prefetchRange(baseCur, currencies, start, end) {
    const curs = unique(currencies).filter((c) => c !== baseCur);
    if (!curs.length || navigator.onLine === false) return;
    const rows = await fetchJSON(`${FRANKFURTER}/rates?base=${baseCur}&quotes=${curs.join(',')}&from=${start}&to=${end}`, 15000);
    if (!Array.isArray(rows)) return;
    const by = {};
    rows.forEach((r) => { if (r && r.rate > 0) (by[r.quote] = by[r.quote] || {})[r.date] = r.rate; });
    curs.forEach((c) => {
      const m = by[c];
      if (!m) return;
      const dates = Object.keys(m).sort();
      let last = m[dates[0]], lastD = dates[0];
      // выходные и праздники: берём последний опубликованный курс
      for (let d = start; d <= end; d = addDays(d, 1)) {
        if (m[d]) { last = m[d]; lastD = d; }
        if (!this.peek(c, baseCur, d)) this.put(d, c, baseCur, 1 / last, 'Frankfurter', lastD);
      }
    });
    this.save();
  },
  count() { return Object.keys(this.cache).length; },
  clear() { this.cache = {}; this.save(); },
};

/** Уточняет приблизительные курсы (демо, офлайн-покупки, импорт), когда появился интернет. */
let resolving = false;
async function resolvePending() {
  if (resolving || navigator.onLine === false) return;
  const b = base();
  const pend = S().expenses.filter((e) => e.ratePending && e.currency !== b);
  if (!pend.length) return;
  resolving = true;
  try {
    const today = todayISO();
    const dates = pend.map((e) => minISO(e.date, today)).sort();
    try { await Rates.prefetchRange(b, pend.map((e) => e.currency), dates[0], dates[dates.length - 1]); } catch (e) { /* дальше — по одной дате */ }
    let changed = 0, fails = 0;
    for (const e of pend) {
      const d = minISO(e.date, today);
      const r = Rates.peek(e.currency, b, d) || (fails < 2 ? await Rates.get(e.currency, b, d).catch(() => null) : null);
      if (!r) { fails++; continue; }
      if (e.rateSource === 'manual') {
        if (e.demoFactor) e.rate = sig(r.rate * e.demoFactor);
      } else {
        e.rate = sig(r.rate); e.rateProvider = r.provider; e.rateDate = r.date;
      }
      e.ratePending = false;
      e.baseAmount = round2(e.amount * e.rate);
      changed++;
    }
    if (changed) Store.commit();
  } finally { resolving = false; }
}

/* =====================================================================
   4. UI-ядро: нижние листы, тосты, диалоги
   ===================================================================== */
const Sheet = {
  stack: [],
  /** Открывает нижний лист. refresh() вызывается при изменении данных, пока лист открыт. */
  open({ title = '', body = '', foot = '', className = '', left = 'Закрыть', right = '', onClose, refresh }) {
    const z = 60 + this.stack.length * 2;
    const overlay = document.createElement('div');
    overlay.className = 'overlay';
    overlay.style.zIndex = z;
    const sheet = document.createElement('div');
    sheet.className = `sheet ${foot ? 'has-foot' : ''} ${className}`;
    sheet.style.zIndex = z + 1;
    sheet.setAttribute('role', 'dialog');
    sheet.setAttribute('aria-modal', 'true');
    sheet.setAttribute('aria-label', title);
    sheet.innerHTML = `<div class="sheet-handle"></div>
      <div class="sheet-head"><button class="link-btn" data-sheet-close>${esc(left)}</button><h2>${esc(title)}</h2><div>${right}</div></div>
      <div class="sheet-body">${body}</div>${foot ? `<div class="sheet-foot">${foot}</div>` : ''}`;
    document.body.append(overlay, sheet);
    const entry = { overlay, sheet, body: sheet.querySelector('.sheet-body'), foot: sheet.querySelector('.sheet-foot'), onClose, refresh, closed: false };
    this.stack.push(entry);
    overlay.addEventListener('click', () => this.close(entry));
    sheet.querySelector('[data-sheet-close]').addEventListener('click', () => this.close(entry));
    this.enableDrag(entry);
    void sheet.offsetHeight; // принудительный reflow, чтобы сработала анимация появления
    overlay.classList.add('show');
    sheet.classList.add('show');
    document.documentElement.classList.add('sheet-open');
    return entry;
  },
  close(entry = this.stack[this.stack.length - 1]) {
    if (!entry || entry.closed) return;
    entry.closed = true;
    if (entry.sheet.contains(document.activeElement)) document.activeElement.blur();
    this.stack = this.stack.filter((x) => x !== entry);
    entry.overlay.classList.remove('show');
    entry.sheet.classList.remove('show');
    setTimeout(() => { entry.overlay.remove(); entry.sheet.remove(); }, 360);
    if (!this.stack.length) document.documentElement.classList.remove('sheet-open');
    if (entry.onClose) entry.onClose();
  },
  closeAll() { [...this.stack].reverse().forEach((e) => this.close(e)); },
  refreshAll() { this.stack.forEach((e) => { if (e.refresh && !e.closed) e.refresh(); }); },
  /** Закрытие свайпом вниз за «ручку» или заголовок. */
  enableDrag(entry) {
    let y0 = null, dy = 0;
    const zones = [entry.sheet.querySelector('.sheet-handle'), entry.sheet.querySelector('.sheet-head')];
    const start = (e) => { if (e.target.closest('button, input')) return; y0 = e.touches[0].clientY; dy = 0; entry.sheet.style.transition = 'none'; };
    const move = (e) => { if (y0 == null) return; dy = Math.max(0, e.touches[0].clientY - y0); entry.sheet.style.transform = `translateY(${dy}px)`; };
    const end = () => {
      if (y0 == null) return;
      entry.sheet.style.transition = '';
      entry.sheet.style.transform = '';
      if (dy > 90) this.close(entry);
      y0 = null;
    };
    zones.forEach((z) => {
      z.addEventListener('touchstart', start, { passive: true });
      z.addEventListener('touchmove', move, { passive: true });
      z.addEventListener('touchend', end);
      z.addEventListener('touchcancel', end);
    });
  },
};

/** Всплывающее уведомление с необязательной кнопкой действия (например, «Отменить»). */
function toast(msg, { action, onAction, duration } = {}) {
  const root = $('#toast-root');
  while (root.children.length >= 2) root.firstElementChild.remove();
  const t = document.createElement('div');
  t.className = 'toast';
  t.innerHTML = `<span>${esc(msg)}</span>${action ? `<button>${esc(action)}</button>` : ''}`;
  root.append(t);
  void t.offsetHeight;
  t.classList.add('show');
  const hide = () => { t.classList.remove('show'); setTimeout(() => t.remove(), 300); };
  const timer = setTimeout(hide, duration || (action ? 5500 : 2800));
  if (action) t.querySelector('button').addEventListener('click', () => { clearTimeout(timer); hide(); onAction && onAction(); });
}

/** Лист с вариантами выбора. Возвращает value выбранного варианта или null. */
function choiceSheet({ title, text = '', options }) {
  return new Promise((resolve) => {
    let done = false;
    const s = Sheet.open({
      title, left: 'Отмена',
      body: `${text ? `<p class="sheet-text">${text}</p>` : ''}<div class="stack">${options.map((o, i) =>
        `<button class="btn ${o.kind === 'danger' ? 'btn-danger' : o.kind === 'primary' ? 'btn-primary' : 'btn-secondary'}" data-i="${i}">${esc(o.label)}</button>`).join('')}</div>`,
      onClose: () => { if (!done) resolve(null); },
    });
    s.body.addEventListener('click', (e) => {
      const b = e.target.closest('[data-i]');
      if (!b) return;
      done = true;
      resolve(options[+b.dataset.i].value);
      Sheet.close(s);
    });
  });
}
const confirmSheet = ({ title, text, ok = 'Подтвердить', danger = false }) =>
  choiceSheet({ title, text, options: [{ label: ok, value: true, kind: danger ? 'danger' : 'primary' }] }).then((v) => v === true);

function showBusy(text) {
  const el = document.createElement('div');
  el.className = 'busy';
  el.innerHTML = `<div><span class="spinner"></span>${esc(text)}</div>`;
  document.body.append(el);
  return { close: () => el.remove() };
}

const Filters = { q: '', cats: new Set(), curs: new Set(), tags: new Set(), pays: new Set() };
const filterCount = () => (Filters.q ? 1 : 0) + Filters.cats.size + Filters.curs.size + Filters.tags.size + Filters.pays.size;
function matchFilters(e) {
  if (Filters.cats.size && !Filters.cats.has(e.categoryId)) return false;
  if (Filters.curs.size && !Filters.curs.has(e.currency)) return false;
  if (Filters.pays.size && !Filters.pays.has(e.payment)) return false;
  if (Filters.tags.size && !(e.tags || []).some((t) => Filters.tags.has(t))) return false;
  const q = Filters.q.trim().toLowerCase();
  if (q) {
    const hay = [e.comment, getCat(e.categoryId).name, (e.tags || []).map((t) => '#' + t).join(' '), e.payment, e.currency, String(e.amount)].join(' ').toLowerCase();
    if (!q.split(/\s+/).every((tok) => hay.includes(tok))) return false;
  }
  return true;
}
function onFiltersChanged() {
  App.dirty = new Set(App.tabs);
  App.render(App.tab);
}
function renderFilterBar(box) {
  const items = [];
  const chip = (label, k, v) => `<button class="chip sm on" data-action="filter-remove" data-k="${k}" data-v="${esc(v)}">${label}<span class="x">×</span></button>`;
  if (Filters.q) items.push(chip(`«${esc(Filters.q)}»`, 'q', ''));
  Filters.cats.forEach((id) => { const c = getCat(id); items.push(chip(`${esc(c.emoji)} ${esc(c.name)}`, 'cats', id)); });
  Filters.curs.forEach((c) => items.push(chip(`${flagOf(c)} ${c}`, 'curs', c)));
  Filters.tags.forEach((t) => items.push(chip(`#${esc(t)}`, 'tags', t)));
  Filters.pays.forEach((p) => items.push(chip(esc(p), 'pays', p)));
  box.innerHTML = items.length ? items.join('') + '<button class="chip sm ghost" data-action="filter-clear">Сбросить всё</button>' : '';
  const n = filterCount();
  $$('[data-action="filters"] .badge').forEach((b) => { b.hidden = !n; b.textContent = n; });
}
function openFilterSheet() {
  const s = Sheet.open({
    title: 'Фильтры и поиск', left: 'Готово', right: '<button class="link-btn" data-reset>Сбросить</button>',
    body: '<div id="flt"></div>',
    foot: '<button class="btn btn-primary" data-done></button>',
  });
  const box = $('#flt', s.sheet);
  const updateCount = () => {
    const n = S().expenses.filter(matchFilters).length;
    $('[data-done]', s.sheet).textContent = `Показать: ${n}`;
  };
  const render = () => {
    const st = S();
    const curs = unique([...st.settings.currencies, ...st.expenses.map((e) => e.currency)]);
    const pays = unique([...st.settings.paymentMethods, ...st.expenses.map((e) => e.payment)]).filter(Boolean);
    const tags = allTags();
    const group = (label, k, items) => items.length ? `<div class="field"><div class="field-label">${label}</div><div class="chips">${items.map(([v, l]) =>
      `<button class="chip sm ${Filters[k].has(v) ? 'on' : ''}" data-k="${k}" data-v="${esc(v)}">${l}</button>`).join('')}</div></div>` : '';
    box.innerHTML = `<label class="search">${icon('search')}<input id="flt-q" type="search" placeholder="Комментарий, #тег, категория" value="${esc(Filters.q)}" autocomplete="off" enterkeyhint="search"></label>
      ${group('Категории', 'cats', st.categories.map((c) => [c.id, `${esc(c.emoji)} ${esc(c.name)}`]))}
      ${group('Валюты', 'curs', curs.map((c) => [c, `${flagOf(c)} ${c}`]))}
      ${group('Теги', 'tags', tags.map((t) => [t, '#' + esc(t)]))}
      ${group('Способ оплаты', 'pays', pays.map((p) => [p, esc(p)]))}`;
    $('#flt-q', box).addEventListener('input', debounce((e) => { Filters.q = e.target.value; syncSearchInputs(); onFiltersChanged(); updateCount(); }, 150));
    updateCount();
  };
  box.addEventListener('click', (e) => {
    const b = e.target.closest('[data-k]');
    if (!b) return;
    const set = Filters[b.dataset.k];
    set.has(b.dataset.v) ? set.delete(b.dataset.v) : set.add(b.dataset.v);
    b.classList.toggle('on');
    onFiltersChanged();
    updateCount();
  });
  $('[data-reset]', s.sheet).addEventListener('click', () => { clearFilters(); render(); });
  $('[data-done]', s.sheet).addEventListener('click', () => Sheet.close(s));
  render();
}
function clearFilters() {
  Filters.q = '';
  ['cats', 'curs', 'tags', 'pays'].forEach((k) => Filters[k].clear());
  syncSearchInputs();
  onFiltersChanged();
}
function syncSearchInputs() {
  const inp = $('#home-search');
  if (inp && document.activeElement !== inp) inp.value = Filters.q;
}

/** Период аналитики: неделя (с понедельника), месяц, год или произвольный. */
const Period = { type: 'month', anchor: todayISO(), from: null, to: null };
function periodRange() {
  const a = Period.anchor, d = parseISO(a);
  switch (Period.type) {
    case 'week': { const from = addDays(a, -((d.getDay() + 6) % 7)); return { from, to: addDays(from, 6) }; }
    case 'year': return { from: `${d.getFullYear()}-01-01`, to: `${d.getFullYear()}-12-31` };
    case 'custom': return { from: Period.from, to: Period.to };
    default: return { from: monthStart(a), to: monthEnd(a) };
  }
}
function prevRange(r) {
  switch (Period.type) {
    case 'week': return { from: addDays(r.from, -7), to: addDays(r.to, -7) };
    case 'year': { const y = +r.from.slice(0, 4) - 1; return { from: `${y}-01-01`, to: `${y}-12-31` }; }
    case 'custom': { const len = daysBetween(r.from, r.to) + 1; return { from: addDays(r.from, -len), to: addDays(r.from, -1) }; }
    default: { const f = addMonths(r.from, -1); return { from: f, to: monthEnd(f) }; }
  }
}
function shiftPeriod(dir) {
  if (Period.type === 'custom') {
    const len = daysBetween(Period.from, Period.to) + 1;
    Period.from = addDays(Period.from, dir * len);
    Period.to = addDays(Period.to, dir * len);
  } else if (Period.type === 'week') Period.anchor = addDays(Period.anchor, 7 * dir);
  else if (Period.type === 'year') { const y = +Period.anchor.slice(0, 4) + dir; Period.anchor = `${y}-01-01`; }
  else Period.anchor = addMonths(Period.anchor, dir);
  App.render('analytics');
}
/**
 * Сравнение с прошлым периодом. Если период ещё идёт — сравниваем с тем же числом дней
 * прошлого периода (1–11 ноября против 1–11 октября), иначе сравнение было бы нечестным.
 */
function comparePeriods(r, list) {
  const today = todayISO();
  if (r.from > today) return null;
  const p = prevRange(r);
  let curTo = r.to, prevTo = p.to;
  if (r.to > today) {
    const elapsed = daysBetween(r.from, today);
    curTo = today;
    prevTo = minISO(addDays(p.from, elapsed), p.to);
  }
  const cur = sumBase(inRange(list, r.from, curTo));
  const prev = sumBase(inRange(S().expenses.filter(matchFilters), p.from, prevTo));
  return { cur, prev, pct: prev > 0 ? (cur - prev) / prev : null, label: rangeLabel(p.from, prevTo) };
}
function deltaBadge(pct) {
  if (pct == null) return '';
  if (Math.abs(pct) < 0.005) return '<span class="delta flat">0%</span>';
  const up = pct > 0;
  return `<span class="delta ${up ? 'up' : 'down'}">${icon(up ? 'arrowUp' : 'arrowDown', 13)}${fmtPct(Math.abs(pct))}</span>`;
}

/** Строка покупки в списке. */
function txRow(e, { showDate = false } = {}) {
  const b = base(), c = getCat(e.categoryId);
  const sub = [];
  if (showDate) sub.push(fmtDay(e.date));

const sortByDateDesc = (a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : (b.createdAt || 0) - (a.createdAt || 0));

/** Средний курс, по которому тратилась валюта, против текущего курса. */
function renderAvgRates(curRows) {
  const box = $('#avg-rates');
  if (!box) return;
  const b = base(), today = todayISO();
  const rows = curRows.filter((x) => x.code !== b && x.origRated > 0);
  const need = [];
  box.innerHTML = rows.map((x) => {
    const avg = x.base / x.origRated;
    const cur = Rates.peek(x.code, b, today);
    if (!cur) need.push(x.code);
    const unit = avg < 0.01 ? 1000 : avg < 1 ? 100 : 1; // «100 ₽ = 52,84 ₺» читается лучше, чем «1 ₽ = 0,528414 ₺»
    const fmtR = (rate) => `${nf({ maximumFractionDigits: 0 }).format(unit)} ${sym(x.code)} = ${nf({ maximumFractionDigits: rate * unit < 1 ? 4 : 2 }).format(rate * unit)} ${sym(b)}`;
    let note = '<span class="muted">Текущий курс недоступен без интернета</span>';
    if (cur) {
      const now = x.origRated * cur.rate, diff = (now - x.base) / x.base;
      note = `По сегодняшнему курсу эти траты стоили бы <b>${fmtMoney(now, b, { short: true })}</b> — ${Math.abs(diff) < 0.001 ? 'столько же'
        : `<span class="${diff > 0 ? 'ok-text' : 'bad-text'}">на ${fmtPct(Math.abs(diff))} ${diff > 0 ? 'дороже' : 'дешевле'}</span>`}.`;
    }
    return `<div class="rate-row"><div class="rr-head"><span style="font-size:20px">${flagOf(x.code)}</span><b>${x.code}</b><span class="muted">${fmtMoney(x.orig, x.code)}</span></div>
      <div class="rr-grid"><div><small>Ваш средний курс</small><b>${fmtR(avg)}</b></div><div><small>Сейчас</small><b>${cur ? fmtR(cur.rate) : '—'}</b></div></div>
      <div class="rr-note">${note}</div></div>`;
  }).join('');
  if (need.length && navigator.onLine !== false) {
    Promise.all(need.map((c) => Rates.get(c, b, today).catch(() => null))).then((res) => {

    });
  }
}

      + (list.length ? groupedList(list) : '<div class="empty">Покупок нет</div>');
  }
  render();
}

const BudgetView = { anchor: todayISO() };
function budgetState(spent, limit) {
  const p = limit > 0 ? spent / limit : 0;
  return { p, cls: p > 1 ? 'over' : p >= 0.8 ? 'warn' : '' };
}
function renderBudgets() {
  const st = S(), b = base(), today = todayISO();
  const from = monthStart(BudgetView.anchor), to = monthEnd(BudgetView.anchor), d = parseISO(from);
  $('#bu-label').textContent = `${MONTHS[d.getMonth()]} ${d.getFullYear()}`;
  $('[data-action="budget-next"]').disabled = from >= monthStart(today);
  const list = inRange(st.expenses, from, to);
  const total = sumBase(list);
  const tb = st.settings.totalBudget;
  const isCurrent = from === monthStart(today);
  let totalHtml;
  if (tb > 0) {
    const { p, cls } = budgetState(total, tb);
    const left = tb - total, daysLeft = daysBetween(today, to) + 1;
    totalHtml = `<div class="card budget-total" data-action="budget-edit" data-id="total" role="button">
      <div class="stat-label">Общий лимит на месяц</div>
      <div class="big">${fmtMoney(total, b, { short: true })} <span class="muted" style="font-size:18px;font-weight:650">из ${fmtMoney(tb, b, { short: true })}</span></div>
      <div class="progress ${cls}"><i style="width:${clamp(p * 100, 0, 100)}%"></i></div>
      <div class="meta"><span class="${cls === 'over' ? 'bad-text' : cls === 'warn' ? 'warn-text' : ''}">${left >= 0 ? `Осталось ${fmtMoney(left, b, { short: true })}` : `Превышен на ${fmtMoney(-left, b, { short: true })}`} · ${fmtPct(p)}</span>
      ${isCurrent && left > 0 ? `<span>≈ ${fmtMoney(left / daysLeft, b, { short: true })} в день до конца месяца</span>` : ''}</div></div>`;
  } else {
    totalHtml = `<div class="card budget-total" data-action="budget-edit" data-id="total" role="button">
      <div class="stat-label">Потрачено за месяц</div><div class="big">${fmtMoney(total, b, { short: true })}</div>
      <p class="card-sub" style="margin:8px 0 0">Общий лимит не задан. <span class="link-btn">Задать лимит</span></p></div>`;
  }
  const spentBy = {};
  list.forEach((e) => { spentBy[e.categoryId] = (spentBy[e.categoryId] || 0) + (e.baseAmount || 0); });
  const cats = [...st.categories].sort((x, y) => {
    const bx = x.budget > 0, by = y.budget > 0;
    if (bx !== by) return bx ? -1 : 1;
    if (bx) return (spentBy[y.id] || 0) / y.budget - (spentBy[x.id] || 0) / x.budget;
    return (spentBy[y.id] || 0) - (spentBy[x.id] || 0);
  });
  const rows = cats.map((c) => {
    const spent = spentBy[c.id] || 0;
    if (c.budget > 0) {
      const { p, cls } = budgetState(spent, c.budget);
      return `<button class="budget-row" data-action="budget-edit" data-id="${c.id}">
        <span class="tx-icon" style="background:${rgba(c.color, 0.16)}">${esc(c.emoji)}</span>
        <span class="br-main"><span class="br-top"><span class="br-name">${esc(c.name)}</span><span class="br-val">${fmtMoney(spent, b, { short: true })} <span class="muted">/ ${fmtMoney(c.budget, b, { short: true })}</span></span></span>
        <span class="progress ${cls}"><i style="width:${clamp(p * 100, 0, 100)}%"></i></span>
        <span class="br-sub ${cls}">${spent > c.budget ? `Превышен на ${fmtMoney(spent - c.budget, b, { short: true })}` : `Осталось ${fmtMoney(c.budget - spent, b, { short: true })}`} · ${fmtPct(p)}</span></span></button>`;
    }
    return `<button class="budget-row" data-action="budget-edit" data-id="${c.id}">
      <span class="tx-icon" style="background:${rgba(c.color, 0.16)}">${esc(c.emoji)}</span>
      <span class="br-main"><span class="br-top"><span class="br-name">${esc(c.name)}</span><span class="br-val">${fmtMoney(spent, b, { short: true })}</span></span>

    <div class="list">${rows}</div>

/**
 * Открывает форму покупки.
 * id — редактирование; prefill — новая покупка с заполненными полями (копия, шаблон без курса, трата из «Входящих»).
 * prefill.keepDate — оставить дату из prefill (иначе сегодня); onSaved(rec) — вызывается после сохранения.
 */
function openExpenseForm({ id = null, prefill = null, onSaved = null } = {}) {
  const st = S(), b = base();
  const editing = id ? st.expenses.find((x) => x.id === id) : null;
  if (id && !editing) return;
  const src = editing || prefill || {};
  const keepRate = !!editing || (prefill && prefill.rateSource === 'manual');
  const f = {
    amount: src.amount != null ? String(src.amount).replace('.', ',') : '',
    currency: src.currency || st.settings.lastCurrency || b,
    categoryId: src.categoryId || null,
    date: editing ? editing.date : prefill && prefill.keepDate && prefill.date ? prefill.date : todayISO(),
    payment: src.payment || '',
    rate: keepRate ? src.rate : null,
    rateSource: keepRate ? src.rateSource : 'auto',
    rateProvider: keepRate ? src.rateProvider : '',
    rateDate: keepRate ? src.rateDate : '',
    ratePending: keepRate ? !!src.ratePending : false,
    loading: false, token: 0, rateOpen: false,
  };
  const curList = unique([...st.settings.currencies, f.currency]);
  const catOrder = categoriesByRecency();
  const s = Sheet.open({
    title: editing ? 'Покупка' : prefill && prefill.title ? prefill.title : prefill && prefill.isCopy ? 'Копия покупки' : 'Новая покупка',
    left: 'Отмена', className: 'sheet-form',
    body: `
      <div class="amount-wrap"><input class="amount-input" id="f-amount" type="text" inputmode="decimal" placeholder="0" autocomplete="off" enterkeyhint="done" aria-label="Сумма" value="${esc(f.amount)}"><span class="amount-cur" id="f-sym"></span></div>
      <div class="chips scroll cur-chips" id="f-curs" aria-label="Валюта">${curList.map((c) => `<button type="button" class="chip sm" data-cur="${c}">${flagOf(c)} ${c}</button>`).join('')}</div>
      <div class="rate-line" id="f-rate-line"></div>
      <div class="rate-edit" id="f-rate-edit" hidden><span id="f-rate-label"></span><input class="input" id="f-rate" type="text" inputmode="decimal" placeholder="Курс" autocomplete="off" aria-label="Курс"><span>${esc(sym(b))}</span><button type="button" class="chip sm" id="f-rate-auto">Авто</button></div>
      <div class="field"><div class="field-label">Категория</div><div class="cat-grid" id="f-cats">${catOrder.map((c) =>
        `<button type="button" class="cat-tile${c.id === f.categoryId ? ' on' : ''}" data-c="${c.id}" style="--c:${c.color};--cs:${rgba(c.color, 0.12)}"><span class="em" style="background:${rgba(c.color, 0.16)}">${esc(c.emoji)}</span><span class="nm">${esc(c.name)}</span></button>`).join('')}</div></div>
      <div class="field"><div class="field-label">Дата</div><div class="chips" id="f-dates">
        <button type="button" class="chip sm" data-d="0">Сегодня</button><button type="button" class="chip sm" data-d="-1">Вчера</button>
        <label class="chip sm date-chip">${icon('calendar', 17)}<span id="f-date-label"></span><input type="date" id="f-date" value="${f.date}" aria-label="Дата покупки"></label></div></div>
      <div class="field"><input class="input" id="f-comment" type="text" placeholder="Комментарий (необязательно)" maxlength="140" enterkeyhint="done" value="${esc(src.comment || '')}"></div>
      <div class="field"><input class="input" id="f-tags" type="text" placeholder="Теги: #отпуск #работа" autocapitalize="none" autocomplete="off" spellcheck="false" enterkeyhint="done" value="${esc((src.tags || []).map((t) => '#' + t).join(' '))}"><div class="chips tag-sugg" id="f-tag-sugg"></div></div>
      <div class="field"><div class="field-label">Способ оплаты</div><div class="chips" id="f-pay">${st.settings.paymentMethods.map((p) => `<button type="button" class="chip sm${p === f.payment ? ' on' : ''}" data-p="${esc(p)}">${esc(p)}</button>`).join('')}</div></div>`,
    foot: `<button class="btn btn-primary" id="f-save" type="button">${editing ? 'Сохранить' : 'Добавить'}</button>
      ${editing ? '<div class="btn-row"><button class="btn btn-secondary" id="f-dup">Дублировать</button><button class="btn btn-secondary" id="f-tpl">В шаблоны</button><button class="btn btn-danger" id="f-del">Удалить</button></div>' : ''}`,
  });
  const q = (sel) => $(sel, s.sheet);
  const amountInput = q('#f-amount');
  // Фокус синхронно в обработчике нажатия — иначе iOS не откроет клавиатуру
  if (!editing) amountInput.focus({ preventScroll: true });

  const shake = (el) => { el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); };
  const syncCur = () => {
    q('#f-sym').textContent = sym(f.currency);
    $$('[data-cur]', s.sheet).forEach((x) => x.classList.toggle('on', x.dataset.cur === f.currency));
  };
  const syncDates = () => {
    const t = todayISO();
    $$('[data-d]', s.sheet).forEach((x) => x.classList.toggle('on', addDays(t, +x.dataset.d) === f.date));
    const other = f.date !== t && f.date !== addDays(t, -1);
    q('.date-chip').classList.toggle('on', other);
    q('#f-date-label').textContent = other ? fmtDay(f.date) : 'Другая дата';
    if (q('#f-date').value !== f.date) q('#f-date').value = f.date;
  };
  const renderRate = () => {
    const line = q('#f-rate-line'), edit = q('#f-rate-edit');
    if (f.currency === b) { line.innerHTML = ''; edit.hidden = true; return; }
    const amt = parseNum(amountInput.value);
    let html;
    if (f.loading) html = `<span class="spinner"></span> Получаю курс на ${fmtDay(minISO(f.date, todayISO()))}…`;
    else if (f.rate > 0) {
      const src = f.rateSource === 'manual' ? '<span class="badge-src manual">вручную</span>'
        : f.ratePending ? `<span class="badge-src pending">приблизительно${f.rateDate ? ' · ' + fmtShortDate(f.rateDate) : ''}</span>`
        : `<span class="badge-src">авто${f.rateProvider ? ' · ' + esc(f.rateProvider) : ''}${f.rateDate ? ', ' + fmtShortDate(f.rateDate) : ''}</span>`;
      html = `${amt > 0 ? `<b>≈ ${fmtMoney(amt * f.rate, b)}</b> ·` : ''} 1 ${f.currency} = ${fmtRate(f.rate)} ${esc(sym(b))} ${src}`;
    } else html = `<span class="warn-text">Нет курса${navigator.onLine === false ? ' (нет интернета)' : ''} — введите вручную</span>`;
    line.innerHTML = `${html} <button type="button" class="link-btn sm" data-rate-toggle>${f.rateOpen ? 'Готово' : 'Изменить курс'}</button>`;
    edit.hidden = !(f.rateOpen || (!f.loading && !(f.rate > 0)));
    q('#f-rate-label').textContent = `1 ${f.currency} =`;
    const ri = q('#f-rate');
    if (document.activeElement !== ri) ri.value = f.rate > 0 ? fmtRateInput(f.rate) : '';
  };
  /** Автоматический курс на дату покупки (кэш → API → ближайший известный). */
  const loadRate = async () => {
    if (f.currency === b) { Object.assign(f, { rate: 1, rateSource: 'auto', ratePending: false, rateProvider: '', rateDate: '' }); renderRate(); return; }
    if (f.rateSource === 'manual') { renderRate(); return; }
    const tok = ++f.token;
    const d = minISO(f.date, todayISO());
    let r = Rates.peek(f.currency, b, d), pending = false;
    if (!r) {
      f.loading = true; renderRate();
      r = await Rates.get(f.currency, b, d).catch(() => null);
      if (tok !== f.token || s.closed) return;
      f.loading = false;
      if (!r) { r = Rates.nearest(f.currency, b, d); pending = !!r; }
    }
    if (r) Object.assign(f, { rate: r.rate, rateProvider: r.provider, rateDate: r.date, ratePending: pending });
    else Object.assign(f, { rate: null, ratePending: false, rateOpen: true });
    renderRate();
  };
  const renderTagSugg = () => {
    const have = new Set(parseTags(q('#f-tags').value));
    q('#f-tag-sugg').innerHTML = allTags().filter((t) => !have.has(t)).slice(0, 8).map((t) => `<button type="button" class="chip sm" data-tag="${esc(t)}">#${esc(t)}</button>`).join('');
  };

  // --- обработчики ---
  amountInput.addEventListener('input', () => {
    const clean = amountInput.value.replace(/[^\d.,\s]/g, '');
    if (clean !== amountInput.value) amountInput.value = clean;
    renderRate();
  });
  amountInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); amountInput.blur(); } });
  q('#f-curs').addEventListener('click', (e) => {
    const x = e.target.closest('[data-cur]');
    if (!x || x.dataset.cur === f.currency) return;
    Object.assign(f, { currency: x.dataset.cur, rateSource: 'auto', rate: null, rateOpen: false, ratePending: false });
    syncCur(); loadRate();
  });
  q('#f-rate-line').addEventListener('click', (e) => {
    if (!e.target.closest('[data-rate-toggle]')) return;
    f.rateOpen = !f.rateOpen;
    renderRate();
    if (f.rateOpen) q('#f-rate').focus();
  });
  q('#f-rate').addEventListener('input', (e) => {
    const v = parseNum(e.target.value);
    Object.assign(f, { rate: v > 0 ? v : null, rateSource: 'manual', ratePending: false, rateProvider: '', rateDate: '' });
    renderRate();
  });
  q('#f-rate-auto').addEventListener('click', () => {
    Object.assign(f, { rateSource: 'auto', rate: null, rateOpen: false });
    loadRate();
  });
  q('#f-cats').addEventListener('click', (e) => {
    const x = e.target.closest('[data-c]');
    if (!x) return;
    f.categoryId = x.dataset.c;

  q('#f-dates').addEventListener('click', (e) => {
    const x = e.target.closest('[data-d]');
    if (!x) return;
    f.date = addDays(todayISO(), +x.dataset.d);
    syncDates(); loadRate();
  });
  q('#f-date').addEventListener('change', (e) => {
    if (!e.target.value) { e.target.value = f.date; return; }
    f.date = e.target.value;
    syncDates(); loadRate();
  });
  q('#f-tags').addEventListener('input', renderTagSugg);
  q('#f-tag-sugg').addEventListener('click', (e) => {
    const x = e.target.closest('[data-tag]');
    if (!x) return;
    const inp = q('#f-tags');
    inp.value = (inp.value.trim() + ' #' + x.dataset.tag).trim() + ' ';
    renderTagSugg();
  });
  q('#f-pay').addEventListener('click', (e) => {
    const x = e.target.closest('[data-p]');
    if (!x) return;
    f.payment = f.payment === x.dataset.p ? '' : x.dataset.p;
    $$('[data-p]', s.sheet).forEach((p) => p.classList.toggle('on', p.dataset.p === f.payment));
  });
  ['#f-comment', '#f-tags'].forEach((sel) => q(sel).addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); e.target.blur(); } }));

  /** Собирает данные формы; при ошибке подсвечивает поле и возвращает null. */
  const collect = () => {
    const amount = parseNum(amountInput.value);
    if (!(amount > 0)) { shake(q('.amount-wrap')); toast('Введите сумму'); amountInput.focus(); return null; }
    if (!f.categoryId) { shake(q('#f-cats')); toast('Выберите категорию'); return null; }
    if (f.currency !== b && !(f.rate > 0)) {
      if (f.loading) { toast('Курс ещё загружается…'); return null; }
      f.rateOpen = true; renderRate(); shake(q('#f-rate-edit')); q('#f-rate').focus(); toast('Укажите курс'); return null;
    }
    const rate = f.currency === b ? 1 : f.rate;
    return {
      amount: round2(amount), currency: f.currency, rate: sig(rate),
      rateSource: f.currency === b ? 'auto' : f.rateSource, rateProvider: f.currency === b ? '' : f.rateProvider || '',
      rateDate: f.currency === b ? '' : f.rateDate || '', ratePending: f.currency === b ? false : f.ratePending,
      baseAmount: round2(amount * rate), categoryId: f.categoryId, date: f.date,
      comment: q('#f-comment').value.trim(), payment: f.payment, tags: parseTags(q('#f-tags').value),
    };
  };
  q('#f-save').addEventListener('click', () => {
    const data = collect();
    if (!data) return;
    st.settings.lastCurrency = data.currency;
    let rec;
    if (editing) {
      Object.assign(editing, data, { updatedAt: Date.now() });
      delete editing.demo; delete editing.demoFactor;
      rec = editing;
    } else {
      rec = { id: uid(), ...data, createdAt: (prefill && prefill.createdAt) || Date.now(), updatedAt: Date.now() };
      st.expenses.push(rec);
    }
    if (onSaved) onSaved(rec);
    App.flash(rec.id);
    Sheet.close(s);
    Store.commit();
    toast(editing ? 'Изменения сохранены' : `Добавлено: ${fmtMoney(rec.amount, rec.currency)}`);
  });
  if (editing) {
    q('#f-del').addEventListener('click', () => { Sheet.close(s); deleteExpense(editing.id); });
    q('#f-dup').addEventListener('click', () => {
      const data = collect() || editing;
      Sheet.close(s);
      setTimeout(() => openExpenseForm({ prefill: { ...data, isCopy: true } }), 0);
    });
    q('#f-tpl').addEventListener('click', () => {
      const data = collect();
      if (!data) return;
      st.templates.push({ id: uid(), name: (data.comment || getCat(data.categoryId).name).slice(0, 24), amount: data.amount, currency: data.currency, categoryId: data.categoryId, payment: data.payment, comment: data.comment });
      Store.commit();
      toast('Шаблон добавлен на главный экран');
    });
  }
  syncCur(); syncDates(); renderTagSugg();
  if (editing) renderRate(); else loadRate();
}

/** Удаление с возможностью отмены. */
function deleteExpense(id) {
  const st = S();
  const i = st.expenses.findIndex((e) => e.id === id);

  const [removed] = st.expenses.splice(i, 1);
  Store.commit();
  toast('Покупка удалена', { action: 'Отменить', onAction: () => { st.expenses.splice(Math.min(i, st.expenses.length), 0, removed); App.flash(removed.id); Store.commit(); } });

/** Быстрое добавление по шаблону одним нажатием. */
let tplBusy = false;
async function quickAddTemplate(id) {
  const st = S(), b = base(), t = st.templates.find((x) => x.id === id);
  if (!t || tplBusy) return;
  tplBusy = true;
  try {
    const date = todayISO();
    let r = { rate: 1, provider: '', date: '' }, pending = false;
    if (t.currency !== b) {
      r = await Rates.get(t.currency, b, date, 4000).catch(() => null);
      if (!r) { r = Rates.nearest(t.currency, b, date); pending = !!r; }
      if (!r) {
        toast('Нет курса без интернета — введите его вручную');
        openExpenseForm({ prefill: { ...t, tags: [] } });
        return;
      }
    }
    const e = makeExpense({ ...t, date, rate: r.rate, rateProvider: r.provider, rateDate: r.date, ratePending: pending });
    st.expenses.push(e);
    App.flash(e.id);
    Store.commit();
    if (navigator.vibrate) navigator.vibrate(8);
    toast(`Добавлено: ${t.name} · ${fmtMoney(t.amount, t.currency)}`, { action: 'Отменить', onAction: () => { st.expenses = st.expenses.filter((x) => x.id !== e.id); Store.commit(); } });
  } finally { tplBusy = false; }
}

/** Смена основной валюты: курс X→новая = курс X→старая × курс старая→новая на дату покупки. Ручные курсы сохраняют смысл. */
async function changeBaseCurrency(newBase) {
  const st = S(), old = base();
  if (navigator.onLine === false) { toast('Для пересчёта нужен интернет'); return; }
  const ok = await confirmSheet({
    title: `Перейти на ${newBase}?`,
    text: `Все суммы и бюджеты будут пересчитаны из ${old} в ${newBase} по курсам на даты покупок. Ручные курсы сохранятся через кросс-курс.`,
    ok: 'Пересчитать',
  });
  if (!ok) return;
  const busy = showBusy('Пересчитываю…');
  try {
    const today = todayISO();
    const dates = unique(st.expenses.map((e) => minISO(e.date, today))).sort();
    if (dates.length) { try { await Rates.prefetchRange(newBase, [old], dates[0], dates[dates.length - 1]); } catch (e) { /* по одной дате */ } }
    const cross = {};
    for (const d of unique([...dates, today])) {
      const r = await Rates.get(old, newBase, d);
      if (!r) throw new Error('нет курса на ' + d);
      cross[d] = r.rate;
    }
    st.expenses.forEach((e) => {
      const d = minISO(e.date, today);
      if (e.currency === newBase) Object.assign(e, { rate: 1, rateSource: 'auto', ratePending: false, rateProvider: '', rateDate: '' });
      else if (e.rate > 0) e.rate = sig(e.rate * cross[d]);
      else e.ratePending = true;
      e.baseAmount = e.rate > 0 ? round2(e.amount * e.rate) : null;
    });
    const k = cross[today];
    const nice = (v) => (v >= 1000 ? Math.round(v / 100) * 100 : Math.round(v));
    st.categories.forEach((c) => { if (c.budget > 0) c.budget = nice(c.budget * k); });
    if (st.settings.totalBudget > 0) st.settings.totalBudget = nice(st.settings.totalBudget * k);
    st.settings.baseCurrency = newBase;
    if (!st.settings.currencies.includes(newBase)) st.settings.currencies.unshift(newBase);
    Store.commit();
    toast(`Основная валюта: ${newBase}`);
  } catch (e) {
    toast('Не удалось получить курсы. Проверьте интернет и попробуйте ещё раз');
  } finally { busy.close(); }
}

/** На телефоне — системное меню «Поделиться» (можно сохранить в «Файлы»), на компьютере — скачивание. */
async function shareOrDownload(blob, filename) {
  const file = new File([blob], filename, { type: blob.type });
  if (isTouch() && navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: filename }); return true; }
    catch (e) { if (e.name === 'AbortError') return false; /* иначе — обычное скачивание */ }
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
  return true;
}

function parseCSV(text) {

  const delim = count('\t') > 0 ? '\t' : count(';') >= count(',') ? ';' : ',';

  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (quoted) {
      if (ch === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else quoted = false; } else field += ch;
    } else if (ch === '"') quoted = true;
    else if (ch === delim) { row.push(field); field = ''; }

  };

    .replace(/[^\p{L}\p{N}]+/gu, ' ').trim().split(' ').filter((w) => /\p{L}/u.test(w));

/* --- Разбор сумм: «₺1.234,50», «9,99 $», «USD 12.00», «450,00 TL», SMS банка --- */
const CUR_ALIASES = { '₺': 'TRY', TL: 'TRY', YTL: 'TRY', $: 'USD', '€': 'EUR', '£': 'GBP', '₽': 'RUB', 'РУБ': 'RUB', 'Р': 'RUB', '₾': 'GEL', '₸': 'KZT', '₴': 'UAH' };

    /(?:i[sş]yeri|merchant|магазин)\s*[:\-]\s*([^,;\n]+?)(?:\s+(?:\d|tutar)|[,;\n]|$)/i,
    /\b(?:at|в)\s+([A-Z0-9][A-Z0-9 &'.\-]{2,40}?)(?:\s+(?:on|for|\d)|[,;.\n]|$)/,

/** Категория по тексту из команды: «🛒 Еда», «Еда» или просто эмодзи. */
function categoryFromText(t) {
  const s = String(t || '').trim();
  if (!s) return null;

  const n = norm(s), cats = S().categories;
  return cats.find((c) => n && norm(c.name) === n) || cats.find((c) => c.emoji && s.startsWith(c.emoji)) || null;

function inboxTime(raw) {

/** Сырая запись с сервера → элемент «Входящих» (или null, если это не трата, например код из SMS). */
function normalizeInboxItem(raw) {
  if (!raw || typeof raw !== 'object' || !raw.id) return null;
  const str = (v, n = 200) => (v == null ? '' : String(v)).trim().slice(0, n);
  const text = str(raw.text, 600);
  const source = ['wallet', 'sms', 'mail', 'test', 'quick'].includes(raw.source) ? raw.source : text ? 'sms' : 'wallet';
  let amount = null, currency = curFrom(str(raw.currency, 8));
  if (raw.amount != null && raw.amount !== '') {
    const m = typeof raw.amount === 'number' ? { amount: raw.amount, currency: null } : parseMoney(str(raw.amount, 60), true);
    if (m) { amount = m.amount; currency = m.currency || currency; }
  }
  if (amount == null && text) {

    if (m) { amount = m.amount; currency = m.currency || currency; }

    amount: amount > 0 ? round2(amount) : null,
    currency: currency || (amount > 0 ? base() : null),
    merchant: str(raw.merchant, 80) || str(raw.comment, 140) || merchantFromText(text),
