  if (o) return `${o.merchant || 'покупка'} из ${inboxSrc(o)[1]} в ${timeOf(o.at)}`;
  const e = st.expenses.find((x) => x.amount === it.amount && x.currency === it.currency && x.date === it.date && Math.abs((x.createdAt || 0) - it.at) < 3 * 36e5);
  if (e) return `«${e.comment || getCat(e.categoryId).name}» уже есть в истории`;
  return '';
}
/** Способ оплаты: по названию карты, иначе «Apple Pay» или «Карта», если такие есть в списке. */
function inboxPayment(it) {
  if (it.source === 'quick') return ''; // способ оплаты неизвестен (могли быть и наличные)
  const methods = S().settings.paymentMethods;
  const card = (it.card || '').toLowerCase();
  if (card) { const m = methods.find((p) => card.includes(p.toLowerCase()) || p.toLowerCase().includes(card)); if (m) return m; }
  if (it.source === 'wallet') { const m = methods.find((p) => /apple\s*pay/i.test(p)); if (m) return m; }
  return methods.find((p) => /^карта$/i.test(p)) || '';
}
/** Превращает элемент «Входящих» в покупку. Возвращает покупку или null, если нет курса (тогда — ручной ввод). */
async function expenseFromInbox(it, categoryId) {
  const b = base();
  let r = { rate: 1, provider: '', date: '' }, pending = false;
  if (it.currency !== b) {
    const d = minISO(it.date, todayISO());
    r = await Rates.get(it.currency, b, d, 5000).catch(() => null);
    if (!r) { r = Rates.nearest(it.currency, b, d); pending = !!r; }
    if (!r) return null;
  }
  const st = S();
  const e = makeExpense({ amount: it.amount, currency: it.currency, rate: r.rate, rateProvider: r.provider, rateDate: r.date, ratePending: pending, categoryId, date: it.date, comment: it.merchant || '', payment: inboxPayment(it) });
  e.createdAt = it.at;
  e.source = it.source;
  st.expenses.push(e);
  learnMerchant(it.merchant, categoryId);
  st.inbox = st.inbox.filter((x) => x.id !== it.id);
  return e;
}

const Inbox = {
  busy: false,
  lastTry: 0,
  configured() { const c = S().settings.inbox; return !!(c && c.url && c.token); },
  /** Запрос к серверу «Входящих» с ключом в заголовке. */
  async req(path, { method = 'GET', body, cfg } = {}) {
    const c = cfg || S().settings.inbox;
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 9000);
    try {
      const res = await fetch(c.url.replace(/\/+$/, '') + path, {
        method, cache: 'no-store', signal: ctrl.signal,
        headers: { Authorization: 'Bearer ' + c.token, ...(body ? { 'Content-Type': 'application/json' } : {}) },
        body: body ? JSON.stringify(body) : undefined,
      });
      let j = null;
      try { j = await res.json(); } catch (e) { /* не JSON */ }
      if (!res.ok) { const err = new Error((j && j.error) || 'HTTP ' + res.status); err.status = res.status; throw err; }
      return j || {};
    } finally { clearTimeout(timer); }
  },
  /**
   * Забирает новые траты с сервера. Знакомые магазины добавляются сразу (если включено),
   * остальные — во «Входящие». После сохранения записи удаляются с сервера.
   * loud — показывать ошибки (ручное обновление).
   */
  async sync({ force = false, loud = false } = {}) {
    if (!this.configured() || this.busy || navigator.onLine === false) return null;
    if (!force && Date.now() - this.lastTry < 15000) return null;
    this.busy = true;
    this.lastTry = Date.now();
    try {
      const j = await this.req('/tx');
      const items = Array.isArray(j.items) ? j.items : [];
      const st = S(), seen = new Set(st.meta.inboxSeen);
      const fresh = [];
      items.forEach((raw) => {
        if (!raw || !raw.id || seen.has(raw.id)) return;
        seen.add(raw.id);
        const it = normalizeInboxItem(raw);
        if (it) fresh.push(it);
      });
      const auto = [];
      for (const it of fresh.sort((a, b) => a.at - b.at)) {
        // быстрая запись с категорией — сразу в историю
        if (it.catFixed && it.amount > 0 && it.currency) {
          const e = await expenseFromInbox(it, it.categoryId).catch(() => null);
          if (e) { auto.push(e); continue; }
        }
        const dup = findDuplicate(it);
        if (dup) it.dup = dup;
        const sug = suggestCategory(it.merchant);
        if (sug && !it.catFixed) it.categoryId = sug.id;
        if (!dup && sug && sug.learned && st.settings.inbox.autoAdd !== false && it.amount > 0 && it.currency) {
          const e = await expenseFromInbox(it, sug.id).catch(() => null);
          if (e) { auto.push(e); continue; }
        }
        st.inbox.push(it);
      }
      st.meta.inboxSeen = [...seen].slice(-400);
      st.meta.inboxSyncAt = Date.now();
      if (fresh.length) Store.commit(); else Store.save();
      // удаляем с сервера только то, что уже сохранено на устройстве
      const ids = items.map((x) => x && x.id).filter(Boolean);
      if (ids.length) this.req('/ack', { method: 'POST', body: { ids } }).catch(() => { /* удалится при следующей синхронизации */ });
      this.announce(auto, fresh.length - auto.length);
      return { added: auto.length, pending: fresh.length - auto.length };
    } catch (e) {
      if (loud) toast(inboxErrorText(e));
      return null;
    } finally { this.busy = false; }
  },
  announce(auto, pending) {
    if (!auto.length && !pending) return;
    if (Sheet.stack.some((x) => x.sheet.classList.contains('sheet-inbox'))) return; // лист уже открыт и обновится сам
    auto.forEach((e) => App.flash(e.id));
    const what = auto.length === 1 ? `${auto[0].comment || getCat(auto[0].categoryId).name} · ${fmtMoney(auto[0].amount, auto[0].currency)}` : `${auto.length} ${plural(auto.length, 'трата', 'траты', 'трат')}`;
    if (auto.length && pending) toast(`Добавлено автоматически: ${what}. Ещё ${pending} ждут подтверждения`, { action: 'Разобрать', onAction: openInboxSheet });
    else if (auto.length) toast(`Добавлено автоматически: ${what}`);
    else toast(`Новые траты из банка: ${pending}`, { action: 'Разобрать', onAction: openInboxSheet });
  },
};
function inboxErrorText(e) {
  if (e && e.status === 401) return 'Ключ не совпадает с TOKEN на сервере';
  if (e && e.message === 'not_configured') return 'На сервере не настроены INBOX или TOKEN';
  if (e && e.status) return `Сервер ответил ошибкой (${e.status})`;
  return navigator.onLine === false ? 'Нет интернета' : 'Сервер недоступен — проверьте адрес';
}

/** Копирование в буфер обмена (с запасным способом для старых браузеров). */
async function copyText(text, okMsg = 'Скопировано') {
  try { await navigator.clipboard.writeText(text); toast(okMsg); return; } catch (e) { /* запасной способ */ }
  const ta = document.createElement('textarea');
  ta.value = text; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
  document.body.append(ta); ta.select(); ta.setSelectionRange(0, text.length);
  let ok = false;
  try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
  ta.remove();
  toast(ok ? okMsg : 'Не удалось скопировать');
}

/** Лист «Входящие»: подтверждение трат из банка. */
function openInboxSheet() {
  const existing = Sheet.stack.find((x) => x.sheet.classList.contains('sheet-inbox'));
  if (existing) return;
  let busy = false;
  const s = Sheet.open({
    title: 'Входящие', className: 'sheet-inbox',
    right: Inbox.configured() ? '<button class="link-btn" data-ib-sync>Обновить</button>' : '',
    body: '<div id="ib-box"></div>',
    refresh: () => render(),
  });
  const box = $('#ib-box', s.sheet);
  const byId = (id) => S().inbox.find((x) => x.id === id);
  const render = () => {
    const st = S();
    if (!st.inbox.length) {
      box.innerHTML = Inbox.configured()
        ? `<div class="empty"><div class="em">📭</div><b>Новых трат нет</b>Они появятся здесь после оплаты Apple Pay или SMS от банка.${st.meta.inboxSyncAt ? `<br><small class="muted">Проверено в ${timeOf(st.meta.inboxSyncAt)}</small>` : ''}</div>`
        : `<div class="empty"><div class="em">🏦</div><b>Не настроено</b>Подключите автоматический ввод трат из Apple Pay и SMS.</div><button class="btn btn-primary" data-ib-setup>Настроить</button>`;
      return;
    }
    const cats = categoriesByRecency();
    const ready = st.inbox.filter((it) => it.amount > 0 && it.categoryId && !it.dup);
    box.innerHTML = '<p class="sheet-text">Выберите категорию и нажмите «Добавить». Категорию магазина приложение запомнит и в следующий раз добавит такую трату само.</p>'
      + st.inbox.slice().sort((a, b) => b.at - a.at).map((it) => {
        const [ico, label] = inboxSrc(it);
        const order = it.categoryId ? [getCat(it.categoryId), ...cats.filter((c) => c.id !== it.categoryId)] : cats;
        return `<div class="ib-item" data-id="${esc(it.id)}">
          <div class="ib-meta">${ico} ${label}${it.card ? ' · ' + esc(it.card) : ''} · ${fmtDayHeader(it.date)}, ${timeOf(it.at)}</div>
          <div class="ib-main"><div class="ib-title">${esc(it.merchant || (it.text ? it.text.slice(0, 70) : 'Без названия'))}</div>
            <div class="ib-amt">${it.amount > 0 ? fmtMoney(it.amount, it.currency) : '<span class="warn-text">сумма?</span>'}</div></div>
          ${it.text && it.merchant ? `<div class="ib-text">${esc(it.text)}</div>` : ''}
          ${it.dup ? `<div class="ib-dup">⚠️ Возможно, дубль: ${esc(it.dup)}</div>` : ''}
          <div class="chips scroll ib-cats">${order.map((c) => `<button type="button" class="chip sm${c.id === it.categoryId ? ' on' : ''}" data-ib-cat="${c.id}">${esc(c.emoji)} ${esc(c.name)}</button>`).join('')}</div>
          <div class="btn-row"><button class="btn btn-secondary" data-ib-del>Удалить</button><button class="btn btn-secondary" data-ib-edit>Изменить</button><button class="btn btn-primary" data-ib-ok>Добавить</button></div>
        </div>`;
      }).join('')
      + (ready.length > 1 ? `<button class="btn btn-primary" data-ib-all style="margin-top:6px">Добавить все с категорией (${ready.length})</button>` : '');
  };
  const openForm = (it) => {
    openExpenseForm({
      prefill: { amount: it.amount, currency: it.currency || base(), categoryId: it.categoryId, comment: it.merchant || '', payment: inboxPayment(it), date: it.date, keepDate: true, createdAt: it.at, title: 'Трата из банка' },
      onSaved: (rec) => {
        rec.source = it.source;
        learnMerchant(it.merchant, rec.categoryId);
        S().inbox = S().inbox.filter((x) => x.id !== it.id);
      },
    });
  };
  const addOne = async (it) => {
    if (!(it.amount > 0) || !it.categoryId) { if (!it.categoryId && it.amount > 0) toast('Выберите категорию'); else openForm(it); return null; }
    const e = await expenseFromInbox(it, it.categoryId);
    if (!e) { toast('Нет курса — введите его вручную'); openForm(it); return null; }
    return e;
  };
  const restore = (items, expenseIds) => {
    const st = S();
    st.expenses = st.expenses.filter((x) => !expenseIds.includes(x.id));
    items.forEach((it) => { if (!st.inbox.some((x) => x.id === it.id)) st.inbox.push(it); });
    Store.commit();
  };
  box.addEventListener('click', async (ev) => {
    const t = ev.target;
    if (t.closest('[data-ib-setup]')) { Sheet.close(s); openInboxSetupSheet(); return; }
    if (busy) return;
    if (t.closest('[data-ib-all]')) {
      busy = true;
      try {
        const items = S().inbox.filter((it) => it.amount > 0 && it.categoryId && !it.dup).map((it) => ({ ...it }));
        const added = [];
        for (const it of items) { const e = await expenseFromInbox(byId(it.id) || it, it.categoryId); if (e) added.push(e.id); }
        Store.commit();
        toast(`Добавлено: ${added.length}`, { action: 'Отменить', onAction: () => restore(items, added) });
      } finally { busy = false; }
      return;
    }
    const card = t.closest('.ib-item');
    const it = card && byId(card.dataset.id);
    if (!it) return;
    const cat = t.closest('[data-ib-cat]');
    if (cat) {
      it.categoryId = cat.dataset.ibCat;
      Store.save();
      $$('[data-ib-cat]', card).forEach((x) => x.classList.toggle('on', x === cat));
      return;
    }
    if (t.closest('[data-ib-edit]')) { openForm(it); return; }
    if (t.closest('[data-ib-del]')) {
      const copy = { ...it };
      S().inbox = S().inbox.filter((x) => x.id !== it.id);
      Store.commit();
      toast('Удалено из «Входящих»', { action: 'Отменить', onAction: () => restore([copy], []) });
      return;
    }
    if (t.closest('[data-ib-ok]')) {
      busy = true;
      try {
        const copy = { ...it };
        const e = await addOne(it);
        if (!e) return;
        App.flash(e.id);
        Store.commit();
        if (navigator.vibrate) navigator.vibrate(8);
        toast(`Добавлено: ${fmtMoney(e.amount, e.currency)}`, { action: 'Отменить', onAction: () => restore([copy], [e.id]) });
      } finally { busy = false; }
    }
  });
  const syncBtn = $('[data-ib-sync]', s.sheet);
  if (syncBtn) syncBtn.addEventListener('click', async () => {
    syncBtn.disabled = true;
    const r = await Inbox.sync({ force: true, loud: true });
    syncBtn.disabled = false;
    if (r && !r.added && !r.pending) { render(); toast('Новых трат нет'); }
    else if (r && r.added) toast(`Добавлено сразу (знакомые магазины): ${r.added}`);
  });
  render();
}

      <details class="adv"${own ? ' open' : ''}><summary>Свой сервер и ключ</summary>
        <p class="sheet-text">Для тех, кто хочет держать сервер у себя. Код — <b>inbox-worker/worker.js</b> в репозитории приложения.</p>
        <div class="field"><div class="field-label">Адрес сервера</div><input class="input" id="is-url" type="url" inputmode="url" autocapitalize="none" autocomplete="off" spellcheck="false" placeholder="https://traty-inbox.имя.workers.dev" value="${esc(c.url)}"></div>
        <div class="field"><div class="field-label">Ключ</div><input class="input" id="is-token" type="text" autocapitalize="none" autocomplete="off" spellcheck="false" placeholder="Ключ (TOKEN)" value="${esc(c.token)}">
          <div class="btn-row"><button class="btn btn-secondary" data-gen>Создать ключ</button><button class="btn btn-secondary" data-copy-token>Копировать</button></div></div>
        <ol class="steps" style="margin-top:16px">
          <li><span class="n">1</span><span><b>dash.cloudflare.com</b> → <b>Storage &amp; Databases → KV → Create</b>, имя <b>traty-inbox</b>.</span></li>
          <li><span class="n">2</span><span><b>Workers &amp; Pages → Create → Worker</b> → <b>Deploy</b> → <b>Edit code</b>: вставьте код из <b>inbox-worker/worker.js</b> → <b>Deploy</b>.</span></li>
          <li><span class="n">3</span><span><b>Settings → Bindings → Add → KV namespace</b>: имя <b>INBOX</b>. <b>Variables and Secrets → Add → Secret</b>: имя <b>TOKEN</b>, значение — ключ выше.</span></li>
        </ol>
        <button class="btn btn-secondary" data-save-own>Сохранить свой сервер</button>
      </details>
      ${connected ? '<button class="btn btn-danger" data-disconnect style="margin-top:22px">Отключить</button>' : ''}`,
  });
  const q = (sel) => $(sel, s.sheet);
  const status = (html) => { q('#is-status').innerHTML = html; };
  const reopen = () => { Sheet.close(s); setTimeout(openInboxSetupSheet, 380); };
  const save = (v) => { S().settings.inbox = { ...S().settings.inbox, ...v }; Store.commit(); };

  const connectBtn = q('[data-connect]');
  if (connectBtn) connectBtn.addEventListener('click', async () => {
    connectBtn.disabled = true;
    status('<span class="spinner"></span> Подключаю…');
    try {
      const j = await Inbox.req('/register', { method: 'POST', cfg: { url: DEFAULT_INBOX_URL, token: '' } });
      if (!j.key) throw new Error('no_key');
      save({ url: DEFAULT_INBOX_URL, token: j.key });
      toast('Подключено — осталось создать команду');
      Inbox.sync({ force: true });
      reopen();
    } catch (e) {
      connectBtn.disabled = false;
      const msg = e && e.status === 429 ? 'Сегодня было слишком много подключений — попробуйте завтра'
        : e && e.message === 'registration_closed' ? 'Новые подключения на сервере закрыты'
        : inboxErrorText(e);
      status(`❌ ${esc(msg)}`);
    }
  });
  const auto = q('#is-auto');
  if (auto) auto.addEventListener('click', (e) => {
    const x = e.target.closest('[data-v]');
    if (!x) return;
    $$('#is-auto button', s.sheet).forEach((b) => b.classList.toggle('on', b === x));
    S().settings.inbox.autoAdd = x.dataset.v === '1';
    Store.save();
  });
  const check = q('[data-check]');
  if (check) check.addEventListener('click', async () => {
    status('<span class="spinner"></span> Проверяю…');
    try {
      const j = await Inbox.req('/');
      status(`✅ Сервер на связи${j.pending != null ? ` · ждут на сервере: ${j.pending}` : ''}`);
    } catch (e) { status(`❌ ${esc(inboxErrorText(e))}`); }
  });
  const test = q('[data-test]');
  if (test) test.addEventListener('click', async () => {
    status('<span class="spinner"></span> Отправляю тестовую трату…');
    try {
      await Inbox.req('/tx', { method: 'POST', body: { amount: '₺1,00', merchant: 'Тестовая трата', source: 'test' } });
      await Inbox.sync({ force: true, loud: true });
      status('✅ Тестовая трата отправлена — через несколько секунд она появится во «Входящих» (можно удалить).');
    } catch (e) { status(`❌ ${esc(inboxErrorText(e))}`); }
  });
  const copyUrl = q('[data-copy-url]');
  if (copyUrl) copyUrl.addEventListener('click', () => {
    const v = S().settings.inbox;
    copyText(`${v.url}/batch?key=${encodeURIComponent(v.token)}`, 'Ссылка для команд скопирована');
  });
  // шаблоны строк для файла-очереди: время|источник|сумма|категория|комментарий|карта
  const COPY_TEXTS = {
    cats: () => [S().categories.map((c) => `${c.emoji} ${c.name}`).join('\n'), 'Список категорий скопирован'],
    quick: () => ['ДАТА|quick|СУММА|КАТЕГОРИЯ|КОММЕНТАРИЙ|', 'Шаблон скопирован'],
    wallet: () => ['ДАТА|wallet|СУММА||ПРОДАВЕЦ|КАРТА', 'Шаблон скопирован'],
    sms: () => ['ДАТА|sms|||ТЕКСТ|', 'Шаблон скопирован'],
  };
  s.body.addEventListener('click', (e) => {
    const x = e.target.closest('[data-copy]');
    if (!x || !COPY_TEXTS[x.dataset.copy]) return;
    const [text, msg] = COPY_TEXTS[x.dataset.copy]();
    copyText(text, msg);
  });
  q('[data-gen]').addEventListener('click', async () => {
    if (q('#is-token').value.trim()) {
      const ok = await confirmSheet({ title: 'Создать новый ключ?', text: 'Старый ключ перестанет подходить: его нужно будет заменить на сервере (TOKEN) и в ссылке команды.', ok: 'Создать' });
      if (!ok) return;
    }
    q('#is-token').value = genToken();
  });
  q('[data-copy-token]').addEventListener('click', () => { const t = q('#is-token').value.trim(); if (t) copyText(t, 'Ключ скопирован'); else toast('Сначала создайте ключ'); });
  q('[data-save-own]').addEventListener('click', async () => {
    const v = { url: cleanUrl(q('#is-url').value), token: q('#is-token').value.trim() };
    if (!v.url || !v.token) { toast('Укажите адрес и ключ'); return; }
    status('<span class="spinner"></span> Проверяю…');
    try {
      await Inbox.req('/', { cfg: v });
      save(v);
      toast('Свой сервер подключён');
      Inbox.sync({ force: true });
      reopen();
    } catch (e) { status(`❌ ${esc(inboxErrorText(e))}`); }
  });
  const disc = q('[data-disconnect]');
  if (disc) disc.addEventListener('click', async () => {
    const ok = await confirmSheet({ title: 'Отключить?', text: 'Новые траты из Apple Pay и SMS перестанут приходить в приложение. Уже добавленные покупки останутся. Команду в «Командах» можно будет удалить.', ok: 'Отключить', danger: true });
    if (!ok) return;
    save({ url: '', token: '' });
    toast('Автоматический ввод отключён');
    reopen();
  });
}

/** Запомненные магазины и их категории. */
function openMerchantRulesSheet() {
  const s = Sheet.open({ title: 'Магазины', body: '<div id="mr-box"></div>', refresh: () => render() });
  const box = $('#mr-box', s.sheet);
  const render = () => {
    const R = S().merchantRules;
    const keys = Object.keys(R).filter((k) => !k.startsWith('#')).sort();
    box.innerHTML = '<p class="sheet-text">Когда вы подтверждаете трату из банка, приложение запоминает категорию магазина. Нажмите на магазин, чтобы забыть его.</p>'
      + (keys.length ? `<div class="list">${keys.map((k) => { const c = getCat(R[k]); return `<button class="row" data-k="${esc(k)}"><span class="ri">${esc(c.emoji)}</span><span class="rl">${esc(k)}</span><span class="rv">${esc(c.name)}</span></button>`; }).join('')}</div>`
        : '<div class="empty">Пока ничего не запомнено</div>');
  };
  box.addEventListener('click', async (e) => {
    const x = e.target.closest('[data-k]');
    if (!x) return;
    const k = x.dataset.k;
    const ok = await confirmSheet({ title: k, text: 'Забыть категорию этого магазина? Следующая трата из него будет ждать подтверждения во «Входящих».', ok: 'Забыть', danger: true });
    if (!ok) return;
    const R = S().merchantRules, first = '#' + k.split(' ')[0];
    delete R[k];
    if (!Object.keys(R).some((o) => !o.startsWith('#') && '#' + o.split(' ')[0] === first)) delete R[first];
    Store.commit();
  });
  render();
}

/* =====================================================================
   10. PWA: тема, service worker, установка, напоминание о бэкапе
   ===================================================================== */
const darkMQ = window.matchMedia('(prefers-color-scheme: dark)');
function applyTheme() {
  const pref = S().settings.theme;
  const dark = pref === 'dark' || (pref === 'system' && darkMQ.matches);
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  $('#meta-theme').setAttribute('content', dark ? '#0A0B0F' : '#F3F4F8');
  try { localStorage.setItem(THEME_KEY, pref); } catch (e) { /* не критично */ }
  if (App.tab === 'analytics' && window.Chart) App.render('analytics');
  else App.dirty.add('analytics');
}
/** Раз в неделю — напоминание сделать резервную копию (только если есть свои, не демо, покупки). */
function backupDue() {
  const m = S().meta;
  const last = Math.max(m.lastBackupAt || 0, m.backupSnoozeAt || 0, m.createdAt || 0);
  return Date.now() - last > 7 * DAY_MS && S().expenses.some((e) => !e.demo);
}
function openInstallSheet() {
  const s = Sheet.open({
    title: 'Установка на iPhone',
    body: `<div class="install-hero"><img src="icons/apple-touch-icon.png" alt=""></div>
      <p class="sheet-text" style="text-align:center">Добавьте «Траты» на экран «Домой» — приложение откроется во весь экран и будет работать без интернета.</p>
      <ol class="steps">
        <li><span class="n">1</span><span>Нажмите <b>«Поделиться»</b> <span class="ios-ico">${icon('share')}</span> в панели Safari. В iOS 26 она спрятана в меню <span class="ios-ico">${icon('dots')}</span>.</span></li>
        <li><span class="n">2</span><span>Пролистайте список и выберите <b>«На экран „Домой“»</b> <span class="ios-ico">${icon('plusSq')}</span>.</span></li>
        <li><span class="n">3</span><span>Оставьте включённым «Открыть как веб-приложение» и нажмите <b>«Добавить»</b>.</span></li>
      </ol>
      <div class="note">⚠️ Safari и приложение на экране «Домой» хранят данные раздельно. Установите приложение сейчас и вносите траты уже в нём — или перенесите данные через экспорт и импорт JSON.</div>`,
    foot: '<button class="btn btn-primary" data-ok>Понятно</button>',
  });
  $('[data-ok]', s.sheet).addEventListener('click', () => Sheet.close(s));
}
function maybeShowInstallHint() {
  const st = S();
  if (!isIOS() || isStandalone() || st.meta.installHintShown) return;
  setTimeout(() => {
    if (Sheet.stack.length) return; // не перебиваем открытую форму, покажем в следующий раз
    st.meta.installHintShown = true;
    Store.save();
    openInstallSheet();
  }, 1500);
}
function registerServiceWorker() {
  if (!('serviceWorker' in navigator) || !/^https?:$/.test(location.protocol)) return;
  const hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('./sw.js').then((reg) => {
    reg.addEventListener('updatefound', () => {
      const nw = reg.installing;
      if (!nw) return;
      nw.addEventListener('statechange', () => {
        if (nw.state === 'installed' && navigator.serviceWorker.controller) {
          toast('Доступна новая версия', { action: 'Обновить', duration: 15000, onAction: () => nw.postMessage('SKIP_WAITING') });
        }
      });
    });
  }).catch((e) => console.warn('Service worker не зарегистрирован:', e));
  let reloading = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!hadController || reloading) return; // первая установка — перезагрузка не нужна
    reloading = true;
    location.reload();
  });
}
/** Загрузка Chart.js с CDN без блокировки интерфейса. */
function loadChartJs() {
  return new Promise((resolve) => {
    if (window.Chart) { resolve(true); return; }
    const sc = document.createElement('script');
    sc.src = CHART_URL;
    sc.crossOrigin = 'anonymous';
    sc.async = true;
    sc.onload = () => resolve(!!window.Chart);
    sc.onerror = () => { sc.remove(); resolve(false); };
    document.head.append(sc);
  });
}
/** Клавиатура iOS: поднимаем нижний лист над клавиатурой через visualViewport. */
function setupViewport() {
  const vv = window.visualViewport;
  if (!vv) return;
  const root = document.documentElement;
  const update = () => {
    const kb = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
    root.style.setProperty('--kb', kb > 80 ? kb + 'px' : '0px');
    root.style.setProperty('--vvh', vv.height + 'px');
    root.classList.toggle('kb-open', kb > 80);
  };
  vv.addEventListener('resize', update);
  vv.addEventListener('scroll', update);
  update();
}

  },
  'filter-clear': () => clearFilters(),

  'period-next': () => shiftPeriod(1),

  'export-json': () => exportJSON(),
  'export-csv': () => exportCSV(),

  wipe: async () => {

    if (!ok) return;
    const fresh = defaultState();
    fresh.meta.installHintShown = true;

    clearFilters();

  },

/** Долгое нажатие (для шаблонов: открыть редактор вместо добавления). */
function bindLongPress(container, selector, handler) {
  let timer = null, fired = false, start = null;
  container.addEventListener('pointerdown', (e) => {
    const t = e.target.closest(selector);
    if (!t) return;
    fired = false; start = [e.clientX, e.clientY];
    timer = setTimeout(() => { fired = true; if (navigator.vibrate) navigator.vibrate(12); handler(t); }, 550);
  });
  const cancel = () => clearTimeout(timer);
  container.addEventListener('pointerup', cancel);
  container.addEventListener('pointercancel', cancel);
  container.addEventListener('pointerleave', cancel);
  container.addEventListener('pointermove', (e) => { if (start && Math.hypot(e.clientX - start[0], e.clientY - start[1]) > 10) cancel(); });
  container.addEventListener('click', (e) => { if (fired) { e.stopPropagation(); e.preventDefault(); fired = false; } }, true);
  container.addEventListener('contextmenu', (e) => { if (e.target.closest(selector)) e.preventDefault(); });
}

function bindStatic() {
  document.addEventListener('click', (e) => {
    const el = e.target.closest('[data-action]');
    if (!el || el.disabled) return;
    const fn = Actions[el.dataset.action];
    if (fn) fn(el, e);
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && Sheet.stack.length) Sheet.close(); });
  $('#home-search').addEventListener('input', debounce((e) => { Filters.q = e.target.value; homeLimit = 60; onFiltersChanged(); }, 150));
  $('#an-seg').addEventListener('click', (e) => {
    const x = e.target.closest('[data-period]');
    if (!x) return;
    Period.type = x.dataset.period;
    if (Period.type === 'custom' && !Period.from) { Period.from = monthStart(todayISO()); Period.to = todayISO(); }
    App.render('analytics');
  });
  const onRange = () => {
    const a = $('#an-from').value, b = $('#an-to').value;
    if (!a || !b) return;
    Period.from = minISO(a, b); Period.to = maxISO(a, b);
    App.render('analytics');
  };
  $('#an-from').addEventListener('change', onRange);
  $('#an-to').addEventListener('change', onRange);
  $('#import-file').addEventListener('change', (e) => { const file = e.target.files[0]; e.target.value = ''; if (file) handleImportFile(file); });
  bindLongPress($('#home-templates'), '[data-action="tpl"]', (el) => openTemplateEditor(el.dataset.id));
  darkMQ.addEventListener('change', () => { if (S().settings.theme === 'system') applyTheme(); });
  window.addEventListener('online', () => { resolvePending(); App.refresh(); Inbox.sync(); });
  window.addEventListener('offline', () => toast('Нет интернета — курсы можно ввести вручную'));
  window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferredInstall = e; App.dirty.add('settings'); });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) return;
    if (App.day !== todayISO()) { App.day = todayISO(); Period.anchor = todayISO(); App.refresh(); } // наступил новый день
    else if (App.tab === 'home') renderBanners();
    Inbox.sync();
  });
}

function init() {
  Rates.load();
  Store.load();
  applyTheme();
  setupViewport();
  bindStatic();
  App.go('home');
  chartReady = loadChartJs();
  registerServiceWorker();
  maybeShowInstallHint();
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  setTimeout(resolvePending, 600);
  setTimeout(() => Inbox.sync(), 900);
}
document.addEventListener('DOMContentLoaded', init);
